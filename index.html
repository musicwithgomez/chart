<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goldmine Sync</title>
<style>
:root{--bg:#f6f8f7;--chart:#f5f2ea;--ink:#111;--mut:#8b9490;--grn:#2e9e6b;--grnl:#d6f3e4;--red:#d9484f;--blu:#2196f3;--line:#e3e7e5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0b0b0d;font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--ink)}
button,input{font-family:inherit}
#app{height:100%;max-width:560px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px 4px;font-weight:800}
.top .sym{font-size:20px;font-weight:800;border:0;background:none;padding:0;color:var(--ink)}.top .sym i{font-size:11px;color:#999;font-style:normal}
.dot{width:9px;height:9px;border-radius:50%;background:#e0a030}.dot.ok{background:#2fd08a}.dot.off{background:#e0555a}
.pill{background:var(--grnl);border:1.5px solid #8fdcb8;color:#1c9a62;border-radius:10px;padding:4px 10px;font-size:14px}
.pill.neg{background:#fde4e4;border-color:#f0b4b6;color:#c2383f}
.sp{flex:1}.bid{color:#b3261e;font-size:15px}.ask{color:#0a7a3a;font-size:15px}
.tfs{display:flex;gap:2px;padding:4px 10px;overflow:auto;scrollbar-width:none}
.tfs button{border:0;background:none;color:#a7b0ac;font-weight:700;font-size:13px;padding:7px 11px;border-radius:9px;white-space:nowrap}
.tfs button.on{background:var(--grnl);color:#25a06d;outline:1.5px solid #8fdcb8}
#chartView{flex:1;min-height:0;display:flex;flex-direction:column}
#panelView{flex:1;min-height:0;overflow:auto;padding:6px 14px 14px;display:none}
#cw{position:relative;flex:1;min-height:160px;background:var(--chart);border-top:1px solid #ddd}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#c{z-index:0}
/* Dedicated SL/TP label layer: always above the chart canvas and its trade labels. */
#riskOverlay{position:absolute;inset:0;z-index:2147483647;pointer-events:none}
.tb{position:absolute;top:6px;left:6px;display:flex;gap:5px}
.tb button{border:1px solid #d6d2c6;background:#fffdf7cc;color:#6d716f;font-weight:700;font-size:11px;padding:4px 8px;border-radius:7px}
.tb button.on{background:#e5f7ee;border-color:#9fdcbd;color:#2a9565}
#tm{position:absolute;top:6px;right:68px;background:#1d2b27;color:#4fe3a0;font-weight:800;font-size:12px;padding:4px 8px;border-radius:7px;font-variant-numeric:tabular-nums}
#toast{position:absolute;left:12px;right:12px;top:38px;background:#0e5240;color:#7dffc5;border:1px solid #2fa36e;border-radius:10px;padding:10px 12px;text-align:center;font-weight:700;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:4}
#toast.bad{background:#5a1c20;color:#ffc2c5;border-color:#c2383f}#toast.on{opacity:1}
.chips{display:flex;gap:8px;align-items:center;padding:0 10px;overflow:auto;scrollbar-width:none;white-space:nowrap}
.chips:not(:empty){padding:6px 10px}
.be{background:#fdf3e0;border:1.5px solid #f0d9a8;color:#e8860b;font-weight:800;border-radius:10px;padding:7px 12px;font-size:13px}
.row2{display:flex;gap:20px;padding:4px 14px 6px;overflow:auto;scrollbar-width:none;white-space:nowrap;font-weight:800;font-size:14px}
.row2:empty{display:none}
.row2 .buy,.row2 .sell{color:#111}.row2 em{font-style:normal;color:#b7bdbb;font-weight:600}.row2 b{font-weight:800;margin-right:2px}.row2 u{text-decoration:none;color:#ee6a6a;margin-left:8px;padding:2px 4px}
.mode{display:flex;padding:2px 10px}.mode button{flex:1;border:0;background:none;color:var(--mut);font-weight:700;font-size:14px;padding:8px;border-radius:9px}
.mode button.on{background:#d9f5e7;color:#25a06d;outline:1.5px solid #9fdcbd}
.ent{display:none;align-items:center;gap:8px;padding:4px 14px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.ent input{width:110px;border:1.5px solid #cfd6d3;border-radius:9px;padding:7px 9px;font-size:16px;font-weight:700;background:#fff}
.ent button{width:34px;height:34px;border:0;border-radius:9px;background:#e8ebea;font-size:20px;font-weight:800}
.ent p{flex-basis:100%;margin:2px 0 0;font-size:12px}
.lots{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 14px}
.lots button{width:40px;height:40px;border:0;border-radius:10px;background:#e8ebea;font-size:24px;font-weight:800}
.lots .v{text-align:center;font-size:26px;font-weight:800;line-height:1;min-width:64px}.lots small{display:block;font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.5px;margin-top:3px}
.lots .sltp{margin-left:auto;width:auto;font-size:13px;padding:0 14px;background:none;border:1.5px solid #cfd6d3;color:#79827e}
.go{display:flex;gap:12px;padding:4px 14px 8px}.go button{flex:1;border:0;border-radius:14px;height:56px;color:#fff;font-weight:800;font-size:17px;line-height:1.2}
.go button:disabled{opacity:.55}.go small{display:block;font-size:15px;font-weight:700}
#sell{background:#0d0d0f}#buy{background:var(--blu)}
.nav{display:flex;border-top:1px solid var(--line);padding:6px 0 4px;background:var(--bg)}
.nav button{flex:1;border:0;background:none;font-size:10.5px;font-weight:700;color:#79827e;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7}.nav .on{color:var(--blu)}
#sheet{position:absolute;inset:auto 0 0 0;background:#fff;border-radius:18px 18px 0 0;padding:16px 18px 20px;box-shadow:0 -10px 40px #0004;transform:translateY(110%);transition:transform .25s;z-index:9;max-height:82%;overflow:auto}
#sheet.on{transform:none}#sheet h4{margin:0 0 8px;font-size:16px}
#sheet button,.pn button.wide{display:block;width:100%;margin:6px 0;padding:12px;border:1.5px solid #cfd6d3;border-radius:11px;background:#fff;font-weight:700;font-size:14px}
#sheet button.bad{border-color:#e9a5a8;color:#c2383f}
#sheet .manage-levels{background:#f7f9f8;border:1px solid #e4e9e6;border-radius:13px;padding:10px 12px;margin:10px 0}
#sheet .manage-levels label{font-size:12px;color:#4f5d56;margin-top:4px}
#sheet .manage-levels button{background:#e3f5eb;border-color:#b6e3ca;color:#187c50;margin:8px 0 12px}
#sheet .manage-divider{height:1px;background:#e5eae7;margin:12px 0}
#sheet label,.pn label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:8px 0 0}
#sheet input,.pn input{display:block;width:100%;margin-top:4px;border:1.5px solid #cfd6d3;border-radius:10px;padding:10px;font-size:16px;font-weight:600}
#sheet .sm,.pn .sm{font-size:12px;color:var(--mut);margin:0 0 4px}
.pn h3{margin:12px 0 4px;font-size:15px}
.pn .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.pn .r small{color:var(--mut);font-size:12px}.pn .r button{border:1.5px solid #cfd6d3;background:#fff;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px}
.buy{color:#2a8fe0}.sell{color:#e0555a}.pos{color:#1c9a62}.neg{color:#c2383f}
.pn .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.pn .kv b{font-weight:800}
.pn .note{font-size:12px;color:var(--mut);line-height:1.5;margin:8px 0}
.demo{display:inline-block;background:var(--grnl);color:#1c9a62;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:800}

/* In-app confirmations and redesigned account/trade panels */
#confirmUI{position:absolute;left:12px;right:12px;bottom:78px;z-index:30;display:none;align-items:center;gap:8px;padding:11px 12px;background:#fff;border:1px solid #dce3df;border-radius:14px;box-shadow:0 8px 28px #0002}
#confirmUI.on{display:flex}#confirmText{flex:1;font-size:13px;font-weight:750;line-height:1.35}
#confirmUI button{flex:0 0 40px;width:40px;height:40px;border:0;border-radius:11px;font-size:22px;font-weight:900}
#confirmYes{background:#d6f3e4;color:#168353}#confirmNo{background:#fde4e4;color:#c2383f}
.pn h3{font-size:17px;letter-spacing:-.25px;margin:18px 0 8px}.pn h3:first-child{margin-top:8px}
.pn .section-sub{font-size:12px;color:var(--mut);margin:-3px 0 10px}
.pn .trade-card{background:#fff;border:1px solid #e5eae7;border-radius:16px;padding:13px;margin:9px 0;box-shadow:0 3px 12px #14251b08}
.pn .trade-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pn .trade-title{font-size:14px;font-weight:850;line-height:1.35}.pn .trade-sub{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.45}
.pn .trade-profit{font-size:16px;font-weight:850;white-space:nowrap;font-variant-numeric:tabular-nums}
.pn .trade-badge{display:inline-block;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:850;background:#edf2ef;color:#5c6962;margin-right:5px}
.pn .trade-badge.buy{background:#e5f3ff;color:#247bc1}.pn .trade-badge.sell{background:#fde9e9;color:#c2383f}
.pn .trade-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}
.pn .trade-metric{min-width:0;background:#f7f9f8;border-radius:10px;padding:8px}.pn .trade-metric span{display:block;color:var(--mut);font-size:10px;font-weight:700;margin-bottom:4px}.pn .trade-metric b{display:block;font-size:12px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.pn .trade-actions{display:flex;gap:8px;margin-top:12px}.pn .trade-actions button{flex:1;border:1px solid #dbe2de;border-radius:10px;padding:9px 10px;background:#fff;font-size:12px;font-weight:800}.pn .trade-actions button.primary{background:#e3f5eb;border-color:#b6e3ca;color:#187c50}.pn .trade-actions button.danger{color:#c2383f;background:#fff8f8;border-color:#f0c9cb}
.pn .account-hero{padding:17px;border-radius:18px;background:linear-gradient(135deg,#172b24,#24513f);color:#fff;margin:10px 0 12px}
.pn .account-hero .eyebrow{font-size:11px;font-weight:750;color:#b7d5c7}.pn .account-hero .amount{font-size:28px;font-weight:900;letter-spacing:-.7px;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.pn .account-hero .hero-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#d6e9df}.pn .account-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pn .account-tile{background:#fff;border:1px solid #e5eae7;border-radius:14px;padding:12px}.pn .account-tile span{display:block;color:var(--mut);font-size:11px;font-weight:700;margin-bottom:7px}.pn .account-tile b{font-size:16px;font-weight:850;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pn .account-info{background:#fff;border:1px solid #e5eae7;border-radius:14px;padding:4px 12px;margin-top:10px}
.pn .account-info .kv{font-size:12px;padding:11px 0}.pn .empty-state{text-align:center;background:#fff;border:1px dashed #d8e0db;border-radius:15px;padding:24px 16px;color:var(--mut);font-size:13px}

/* ================= LIGHT THEME + LAYOUT FIXES (final overrides) ================= */
#cw{isolation:isolate;z-index:0}              /* chart layers (incl. SL/TP labels) can never rise above the ticket */
#riskOverlay{z-index:2}
#sheet:not(.on){visibility:hidden;pointer-events:none}

function commitGhost(d){
 if(d.kind==='gentry'){if(d.moved)setEntry(d.price);return}
 const k=d.kind==='gtp'?'tp':'sl';
 if(d.moved)ghost[k]=d.price;else if(d.def!=null)ghost[k]=d.def}
function onHit(h){
 if(h.act==='gconfirm'){confirmGhost();return}
 if(h.act==='gcancel'){ghostOff();return}
 if(h.act==='gremove'){ghost[h.kind]=null;dirty=true;return}
 if(h.act==='close'){confirmClose=null;dirty=true;closePos(h.ticket,100)}
 else if(h.act==='confirmclose'){const t=h.ticket;confirmClose=null;dirty=true;closePos(t,100)}
 else if(h.act==='cancel'){cancelPending(h.ticket)}
 else if(h.act==='riskremove'){confirmRisk=null;dirty=true;removeRiskLevel(h.ticket,h.kind)}
 else if(h.act==='confirmrisk'){const t=h.ticket,k=h.kind;confirmRisk=null;dirty=true;removeRiskLevel(t,k)}
 else if(h.act==='pos'){activePos=activePos===h.ticket?null:h.ticket;if(activePos!==null){const p=S.P.find(x=>x.ticket===activePos);if(p&&!activeLevels[p.ticket])activeLevels[p.ticket]={sl:p.sl||null,tp:p.tp||null};}dirty=true}}

   const body={login:S.login,ticket,sl:kind==='sl'?0:p.sl,tp:kind==='tp'?0:p.tp};

async function commitDrag(d){

 try{
  if(d.kind==='sl'||d.kind==='tp'){const p=S.P.find(p=>p.ticket===d.ticket);if(!p)return;

const NAV=[['Chart','M3 17l6-6 4 4 8-8'],['Positions','M12 3l9 5-9 5-9-5zM3 13l9 5 9-5'],['History','M12 6v6l4 2M4 12a8 8 0 108-8'],['Account','M4 11l8-7 8 7v9H4z'],['Settings','M12 15a3 3 0 100-6 3 3 0 000 6zM19 12l2-1-2-4-2 1-2-1-1-2h-4l-1 2-2 1-2-1-2 4 2 1v2l-2 1 2 4 2-1 2 1 1 2h4l1-2 2-1 2 1 2-4-2-1z']];
function navUI(){$('#nav').innerHTML=NAV.map(([n,d])=>`<button class="${(panel||'Chart')==n?'on':''}" data-n="${n}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${n}</button>`).join('')}
function showPanel(n){
 panel=n==='Chart'||!n?null:n;navUI();sheet(null);
 const pv=$('#panelView');if(panel!=='Positions')delete pv.dataset.pos;
 $('#chartView').style.display=panel?'none':'flex';$('#tfs').style.display=panel?'none':'flex';pv.style.display=panel?'block':'none';
 if(!panel){size();dirty=true;return}
 if(panel==='Positions')renderPositions();else if(panel==='History'){histDeals=null;renderHistory()}else if(panel==='Account')renderAccount();else renderSettings()}
let posSig='',posTab='open',openRow=null,histP='7D',histDeals=null;
const sgn=v=>v<0?'neg':'pos';
function renderPositions(){
 const pv=$('#panelView'),A=S.allP,B=S.allO,sig=posTab+'|'+openRow+'|'+A.map(p=>p.ticket+':'+p.sl+':'+p.tp).join('|')+'#'+B.map(o=>o.ticket+':'+o.price+':'+o.sl+':'+o.tp).join('|');
 if(sig!==posSig||!pv.dataset.pos){posSig=sig;pv.dataset.pos='1';
  const total=A.reduce((v,p)=>v+(+p.profit||0),0),lots=A.reduce((v,p)=>v+p.volume,0),lv=(l,v)=>l+' '+(v?fx(v):'—');
  const open=A.map(p=>{const o=openRow===p.ticket;return `<button class="prow${o?' open':''}" data-row="${p.ticket}"><span class="rl"><span class="rt"><span class="tag ${p.type.toLowerCase()}">${esc(p.type)}</span>${esc(p.symbol)} <span style="font-weight:600;color:var(--mut)">${p.volume}</span></span><span class="rp ${sgn(p.profit)}" data-ppl="${p.ticket}">${money(p.profit)}</span></span><span class="rs">@ ${fx(p.price_open)} · ${lv('SL',p.sl)} · ${lv('TP',p.tp)}</span></button>`+(o?`<div class="act"><button data-do="editpos" data-tk="${p.ticket}">Manage</button><button class="danger" data-pc="${p.ticket}">Close</button></div>`:'')}).join('');
  const ord=B.map(o=>`<div class="prow"><span class="rl"><span class="rt"><span class="tag ${o.name.startsWith('BUY')?'buy':'sell'}">${esc(o.name)}</span>${esc(o.symbol)} <span style="font-weight:600;color:var(--mut)">${o.volume}</span></span><button class="mini" data-po="${o.ticket}">Cancel</button></span><span class="rs">@ ${fx(o.price)} · ${lv('SL',o.sl)} · ${lv('TP',o.tp)}</span></div>`).join('');
  pv.innerHTML=`<div class="pv"><div class="sum"><div><small>Floating P/L</small><div class="big ${sgn(total)}" data-totalpl>${money(total)}</div></div><div class="meta">${A.length} open<br>${+lots.toFixed(2)} lots</div></div>
  <div class="seg"><button class="${posTab==='open'?'on':''}" data-pt="open">Open (${A.length})</button><button class="${posTab==='orders'?'on':''}" data-pt="orders">Orders (${B.length})</button></div>
  ${posTab==='open'?(A.length?`<div class="list">${open}</div><button class="wide danger" data-do="closeall">Close all positions</button>`:'<div class="empty-state">No open positions right now.</div>'):(B.length?`<div class="list">${ord}</div>`:'<div class="empty-state">No pending orders.</div>')}</div>`}
 const totalNow=A.reduce((v,p)=>v+(+p.profit||0),0),te=$('[data-totalpl]');if(te){te.textContent=money(totalNow);te.className='big '+sgn(totalNow)}
 A.forEach(p=>{const e=document.querySelector(`[data-ppl="${p.ticket}"]`);if(e){e.textContent=money(p.profit);e.className='rp '+sgn(p.profit)}})}
async function renderHistory(){
 const pv=$('#panelView');
 if(!histDeals){pv.innerHTML='<div class="pv"><p class="note">Loading trade history…</p></div>';
  try{const r=await api(`/api/history?login=${S.login}&limit=200`);histDeals=r.deals||[]}catch(e){if(panel==='History')pv.innerHTML='<div class="pv"><p class="note">'+esc(e.message)+'</p></div>';return}}
 if(panel==='History')drawHistory()}
function drawHistory(){
 const pv=$('#panelView'),n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
 const cut={Today:t0,'7D':t0-6*864e5,'30D':t0-29*864e5,All:0}[histP];
 const ts=d=>{const x=new Date(String(d.time||'').replace(' ','T'));return isNaN(x)?null:x.getTime()};
 const D=histDeals.filter(d=>{const t=ts(d);return t===null||t>=cut});
 const net=D.reduce((v,d)=>v+d.profit,0),wins=D.filter(d=>d.profit>0).length,days=[],map={};
 D.forEach(d=>{const k=String(d.time||'').slice(0,10)||'Earlier';if(!map[k]){map[k]={k,sum:0,rows:[]};days.push(map[k])}map[k].sum+=d.profit;map[k].rows.push(d)});
 pv.innerHTML=`<div class="pv"><div class="sum"><div><small>Net result · ${histP==='All'?'all loaded':histP==='Today'?'today':'last '+histP}</small><div class="big ${sgn(net)}">${money(net)}</div></div><div class="meta">${D.length} trades</div></div>
 <div class="seg">${['Today','7D','30D','All'].map(k=>`<button class="${k===histP?'on':''}" data-hp="${k}">${k}</button>`).join('')}</div>
 <div class="stats"><div class="stat"><span>Win rate</span><b>${D.length?Math.round(wins/D.length*100)+'%':'—'}</b></div><div class="stat"><span>Wins / losses</span><b>${wins} / ${D.length-wins}</b></div><div class="stat"><span>Avg per trade</span><b class="${sgn(net)}">${D.length?money(net/D.length):'—'}</b></div></div>
 ${days.length?days.map(g=>`<div class="dayh"><span>${esc(g.k)}</span><span class="${sgn(g.sum)}">${money(g.sum)}</span></div><div class="list">${g.rows.map(d=>`<div class="prow"><span class="rl"><span class="rt"><span class="tag ${d.type==='BUY'?'buy':'sell'}">${esc(d.type)}</span>${esc(d.symbol)} <span style="font-weight:600;color:var(--mut)">${+(+d.volume).toFixed(2)}</span></span><span class="rp ${sgn(d.profit)}">${money(d.profit)}</span></span><span class="rs">${esc(String(d.time||'').slice(11,16))} · closed @ ${d.price}</span></div>`).join('')}</div>`).join(''):'<div class="empty-state" style="margin-top:12px">No closed trades in this period.</div>'}</div>`}
async function renderAccount(){
 const pv=$('#panelView');pv.innerHTML='<div class="pv"><p class="note">Loading account details…</p></div>';
 try{const a=await api('/api/account?login='+S.login);if(panel!=='Account')return;const m=v=>CUR()+Number(v).toFixed(2),ml=a.margin>0?Math.round(a.equity/a.margin*100)+'%':'—';
  pv.innerHTML=`<div class="pv"><div class="account-hero"><div class="eyebrow">${a.is_demo?'DEMO ACCOUNT':'LIVE ACCOUNT'} · ${esc(a.currency||'')}</div><div class="amount">${m(a.equity)}</div><div class="hero-row"><span>Equity</span><span>Balance ${m(a.balance)}</span></div></div>
  <div class="account-grid"><div class="account-tile"><span>Floating P/L</span><b class="${sgn(a.profit)}">${money(a.profit)}</b></div><div class="account-tile"><span>Margin level</span><b>${ml}</b></div><div class="account-tile"><span>Margin used</span><b>${m(a.margin)}</b></div><div class="account-tile"><span>Free margin</span><b>${m(a.margin_free)}</b></div></div>
  <div class="account-info"><div class="kv"><span>Account name</span><b>${esc(a.name)}</b></div><div class="kv"><span>Login</span><b>${a.login}</b></div><div class="kv"><span>Server</span><b>${esc(a.server)}</b></div><div class="kv"><span>Type</span><b>${a.is_demo?'Demo':'Live'}</b></div></div></div>`}
 catch(e){pv.innerHTML='<div class="pv"><p class="note">'+esc(e.message)+'</p></div>'}}

 $('#panelView').innerHTML=`<div class="pv"><h3>Connection</h3>
 <p class="note">This page talks to the bridge (<b>app.py</b>) running on your own PC, next to MetaTrader 5. Your key is stored only in this browser.</p>

 <button class="wide" data-do="pickSym">Symbol: ${esc(S.symbol||'not chosen yet')}</button>
 <button class="wide" data-do="forget">Forget key on this device</button>
 <p class="note">Status: ${S.ok?'connected to MT5':'not connected'}.<br>Use Chrome or Edge on the same PC that runs MT5. If the browser asks to allow access to local devices or the local network, tap Allow.</p></div>`}

/* ---------- clicks ---------- */
$('#confirmYes').addEventListener('click',()=>{const fn=pendingConfirm;clearConfirm();if(fn)fn()});
$('#confirmNo').addEventListener('click',clearConfirm);
document.addEventListener('click',e=>{
 const target=e.target,mgBtn=target.closest('[data-do="manage"]'),wasMg=$('#sheet').classList.contains('on')&&sheetKind==='manage';
 // Dismiss sheets when the user taps anywhere outside the sheet itself.
 if($('#sheet').classList.contains('on')&&!target.closest('#sheet')&&!target.closest('#tradeManageArea'))sheet(null);
 if(mgBtn&&wasMg)return; // tapping Manage again just closes it
 // The entry's TP/SL handles are temporary: any UI click outside the chart dismisses them.
 if(activePos!==null&&!target.closest('#cw')){activePos=null;dirty=true}
 const t=e.target.closest('button,u');if(!t)return;if(t.id==='confirmYes'||t.id==='confirmNo')return;const d=t.dataset;
 if(t.id==='symBtn'){symSheet();return}
 if(t.id==='accBtn'){accSheet();return}
 if(d.acc){switchAcct(d.acc);return}
 if(d.pt){posTab=d.pt;openRow=null;delete $('#panelView').dataset.pos;renderPositions();return}
 if(d.row){openRow=openRow===+d.row?null:+d.row;delete $('#panelView').dataset.pos;renderPositions();return}
 if(d.hp){histP=d.hp;drawHistory();return}
 if(d.fav){symFavs=symFavs.includes(d.fav)?symFavs.filter(x=>x!==d.fav):[...symFavs,d.fav];LS.set('gm_favs',JSON.stringify(symFavs));symSheet();return}
 if(d.cat){symCat=d.cat;symSheet();return}
 if(d.t){S.tf=d.t;LS.set('gm_tf',S.tf);S.C=[];header();if(S.ok)loadCandles().then(poll).catch(x=>toast(x.message,1));return}
 if(d.m){mode=d.m;ghost.tp=ghost.sl=null;if(mode!=='Market'&&S.bid)entry=+(S.bid+(mode==='Limit'?-1:1)*S.point*300).toFixed(S.digits);$('#entv').value=mode==='Market'?'':entry;header();dirty=true;return}
 if(d.x){const p=S.P.find(p=>p.ticket==d.x);if(p)closePos(+d.x,100);return}
 if(d.o){cancelPending(+d.o);return}
 if(d.pc){closePos(+d.pc,100);return}
 if(d.po){cancelPending(+d.po);return}
 if(d.n){showPanel(d.n);return}
 if(d.sym){S.symbol=d.sym;LS.set('gm_symbol',S.symbol);S.C=[];S.P=[];S.O=[];sheet(null);header();if(S.ok)loadCandles().then(poll).catch(x=>toast(x.message,1));return}
 switch(t.id){
  case 'be':beAll();return;
  case 'mi':lots=lots>0.1?+(lots-0.1).toFixed(2):Math.max(0.01,+(lots-0.01).toFixed(2));LS.set('gm_lots',lots);header();return;
  case 'pu':lots=lots>=0.1?Math.min(1,+(lots+0.1).toFixed(2)):+(lots+0.01).toFixed(2);LS.set('gm_lots',lots);header();return;
  case 'sltp':defSheet();return;
  case 'sell':place('sell');return;case 'buy':place('buy');return;
  case 'tEma':ema=!ema;LS.set('gm_ema',ema?'1':'0');header();dirty=true;return;
  case 'tLbl':lbl={small:'lines',lines:'off',off:'small'}[lbl];LS.set('gm_lbl',lbl);header();dirty=true;return;
  case 'em':case 'ep':{const st=S.point*10*(t.id==='em'?-1:1);if(!entry)entry=S.bid;setEntry(entry+st);dirty=true;return}}
 if(d.do==='x'&&t.closest('#tradeManageArea')){closeManage();return}
 if(d.do)doAction(d.do,d.tk)});
$('#entv').addEventListener('input',e=>{entry=+e.target.value||0;dirty=true});

async function beAll(){let ok=0,skip=0;for(const p of S.P){if(p.profit<=0){skip++;continue}
  try{await api('/api/modify',{login:S.login,ticket:p.ticket,sl:p.price_open,tp:p.tp});ok++}catch(e){skip++}}
 toast(`✓ Break-even set on ${ok}`+(skip?` · ${skip} skipped (not in profit yet)`:''),!ok);poll()}

async function doAction(a,tk){
 const t=+tk;
 if(a==='x'){sheet(null);return}
 if(a==='editpos'){posSheet(t);return}
 if(a==='manage'){manageSheet();return}
 if(a==='mgapply'){
  const rt=($('#manageTP')?$('#manageTP').value:'').trim(),rs=($('#manageSL')?$('#manageSL').value:'').trim(),ps=[...S.P];
  const tp=rt===''?null:Number(rt),sl=rs===''?null:Number(rs);
  if(!ps.length){toast('No open positions to update.',1);return}
  if(tp===null&&sl===null){toast('Enter a take profit and/or a stop loss first.',1);return}
  if((tp!==null&&!(tp>0))||(sl!==null&&!(sl>0))){toast('Enter valid prices.',1);return}
  sheet(null);let ok=0,failed=0;
  for(const p of ps){try{await api('/api/modify',{login:S.login,ticket:p.ticket,sl:sl!==null?sl:(p.sl||0),tp:tp!==null?tp:(p.tp||0)});ok++}catch(e){failed++}}
  toast(`✓ Levels updated on ${ok} position(s)`+(failed?` · ${failed} failed`:''),failed>0&&!ok);poll();return}
 if(a==='mgclearTP'||a==='mgclearSL'){
  const kind=a==='mgclearTP'?'tp':'sl',ps=[...S.P];sheet(null);let ok=0,failed=0;
  for(const p of ps){try{await api('/api/modify',{login:S.login,ticket:p.ticket,sl:kind==='sl'?0:(p.sl||0),tp:kind==='tp'?0:(p.tp||0)});ok++}catch(e){failed++}}
  toast(`✓ ${kind==='tp'?'Take profit':'Stop loss'} removed on ${ok} position(s)`+(failed?` · ${failed} failed`:''),failed>0&&!ok);poll();return}
 if(a==='mgbe'){sheet(null);beAll();return}
 if(a==='manage100'){sheet(null);askConfirm('Close ALL open positions?',async()=>{try{const r=await api('/api/close-all',{login:S.login});toast(`✓ Closed ${r.closed}`+(r.failed?` · ${r.failed} failed`:''),r.failed>0)}catch(e){toast(e.message,1)}poll()});return}
 if(['manage75','manage50','manage25'].includes(a)){const pct=+a.replace('manage','');const ps=[...S.P];sheet(null);if(!ps.length){toast('No open positions to manage.',1);return}askConfirm(`Close ${pct}% of all ${ps.length} open position(s)?`,async()=>{let ok=0,failed=0;for(const p of ps){try{await api('/api/close',{login:S.login,ticket:p.ticket,percent:pct});ok++}catch(e){failed++}}toast(`✓ Closed ${pct}% on ${ok} position(s)`+(failed?` · ${failed} failed`:''),failed>0);poll()});return}
 if(a==='savesltp'){const sl=+$('#fsl').value||0,tp=+$('#ftp').value||0;sheet(null);await run(()=>api('/api/modify',{login:S.login,ticket:t,sl,tp}),'✓ SL / TP saved');return}
 if(a==='be'){const p=S.P.find(p=>p.ticket===t);if(!p)return;sheet(null);await run(()=>api('/api/modify',{login:S.login,ticket:t,sl:p.price_open,tp:p.tp}),'✓ SL moved to break-even');return}
 if(a==='c50'){sheet(null);await closePos(t,50);return}
 if(a==='c100'){sheet(null);await closePos(t,100);return}
 if(a==='savedef'){DEF.sl=Math.max(0,+$('#dsl').value||0);DEF.tp=Math.max(0,+$('#dtp').value||0);LS.set('gm_sl',DEF.sl);LS.set('gm_tp',DEF.tp);sheet(null);header();return}
 if(a==='closeall'){askConfirm('Close ALL open positions?',async()=>{try{const r=await api('/api/close-all',{login:S.login});toast(`✓ Closed ${r.closed}`+(r.failed?` · ${r.failed} failed`:''),r.failed>0)}catch(e){toast(e.message,1)}poll()});return}
 if(a==='saveconn'){S.base=($('#sBase').value.trim()||'http://127.0.0.1:8765').replace(/\/+$/,'');S.key=$('#sKey').value.trim();LS.set('gm_base',S.base);LS.set('gm_key',S.key);connect();return}
 if(a==='pickSym'){if(!S.symbols.length&&!S.gold.length){toast('Connect first, then pick a symbol.',1);return}symSheet();return}
 if(a==='forget'){S.key='';LS.set('gm_key','');S.ok=false;stopPoll();status('off');renderSettings();toast('Key removed from this device.')}
}


/* Desktop-only floating / dockable trade ticket.
   It is built when the window is >= 900px and fully removed (controls put back in the normal
   phone layout) when the window is narrower, so phones never see "Trade ticket / Dock / Undock". */
const DESK=window.matchMedia('(min-width: 900px)');
function buildTradeWidget(){
 if($('#tradeWidget'))return;
 const chart=$('#chartView'),modeEl=$('#mode'),entEl=$('#ent'),lotsEl=document.querySelector('.lots'),goEl=document.querySelector('.go');
 if(!chart||!modeEl||!entEl||!lotsEl||!goEl)return;
 const widget=document.createElement('section');widget.id='tradeWidget';
 widget.innerHTML='<div id="tradeWidgetHead"><span class="dragHint">⋮⋮  TRADE TICKET</span><button type="button" id="tradeManage" data-do="manage" title="Manage open positions">Manage</button><button type="button" id="tradeDock">Dock</button><button type="button" id="tradeHide" title="Hide panel">×</button></div><div id="tradeWidgetBody"></div>';
 chart.appendChild(widget);
 const body=$('#tradeWidgetBody');
 [modeEl,entEl,lotsEl,goEl].forEach(el=>body.appendChild(el));
 const manageArea=document.createElement('div');manageArea.id='tradeManageArea';body.appendChild(manageArea);
 const restore=document.createElement('button');restore.id='tradeRestore';restore.type='button';restore.textContent='Show trade panel';chart.appendChild(restore);
 const dock=$('#tradeDock'),hide=$('#tradeHide'),head=$('#tradeWidgetHead'),manage=$('#tradeManage');
 // Docking reserves a column for the ticket and shrinks the chart to the left,
 // so the newest candles, price axis and position labels stay visible.
 const setDocked=on=>{
  widget.classList.toggle('docked',on);dock.textContent=on?'Undock':'Dock';LS.set('gm_dock',on?'1':'0');sheet(null);
  if(on){widget.style.left='';widget.style.top='0';widget.style.bottom='0';widget.style.right='0';if(!widget.classList.contains('hidden'))chart.classList.add('trade-docked')}
  else{chart.classList.remove('trade-docked');widget.style.left='';widget.style.top='16px';widget.style.bottom='auto';widget.style.right='20px'}
  dirty=true};
 dock.addEventListener('click',()=>setDocked(!widget.classList.contains('docked')));
 manage.addEventListener('click',e=>{
  e.stopPropagation();
  if(manageArea.style.display==='block')closeManage();else manageSheet()});
 hide.addEventListener('click',()=>{sheet(null);widget.classList.add('hidden');chart.classList.remove('trade-docked');restore.classList.add('on');dirty=true});
 restore.addEventListener('click',()=>{widget.classList.remove('hidden');restore.classList.remove('on');if(widget.classList.contains('docked'))chart.classList.add('trade-docked');dirty=true});
 let drag=null;
 head.addEventListener('pointerdown',e=>{if(e.target.closest('button')||widget.classList.contains('docked'))return;const r=widget.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};head.setPointerCapture(e.pointerId);e.preventDefault()});
 head.addEventListener('pointermove',e=>{if(!drag)return;const r=chart.getBoundingClientRect(),w=widget.offsetWidth,h=widget.offsetHeight;let x=e.clientX-r.left-drag.x,y=e.clientY-r.top-drag.y;x=Math.max(0,Math.min(r.width-w,x));y=Math.max(0,Math.min(r.height-h,y));widget.style.left=x+'px';widget.style.top=y+'px';widget.style.right='auto'});
 const end=()=>{drag=null};head.addEventListener('pointerup',end);head.addEventListener('pointercancel',end);
 if(LS.get('gm_dock','0')==='1')setDocked(true);
 if(manageOpen){try{manageSheet()}catch(e){console.error(e)}}
}
function destroyTradeWidget(){
 const widget=$('#tradeWidget');if(!widget)return;
 const chart=$('#chartView');sheet(null);
 const rs=$('#tradeRestore');if(rs)rs.remove();
 ['#mode','#ent','.lots','.go'].forEach(s=>chart.appendChild(document.querySelector(s)));
 widget.remove();chart.classList.remove('trade-docked');dirty=true}
const syncWidget=()=>DESK.matches?buildTradeWidget():destroyTradeWidget();
if(DESK.addEventListener)DESK.addEventListener('change',syncWidget);else DESK.addListener(syncWidget);
syncWidget();

/* ---------- start ---------- */
new ResizeObserver(size).observe($('#cw'));
navUI();header();size();connect();
</script></body></html>
