<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goldmine Journal</title>
<link rel="stylesheet" href="gp-theme.css?v=20261109b">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>

<style>
body{min-height:100%}
.jtop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;font-size:15px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.brand span{font-size:9.5px;font-weight:800;color:var(--acc);background:var(--accbg);padding:2px 6px;border-radius:5px;letter-spacing:.08em}
.jtop select,.filters select,.filters input{height:32px;padding:0 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12px;font-weight:600}
.tabsj{position:sticky;top:56px;z-index:19;display:flex;gap:2px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabsj button{height:42px;padding:0 13px;color:var(--mut);font-weight:700;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tabsj button:hover{color:var(--text)}.tabsj button.on{color:var(--text);border-bottom-color:var(--acc)}
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.filters .lab{font-size:11px;font-weight:700;color:var(--mut);margin-left:6px}
.filters .count{margin-left:auto;font-size:12px;color:var(--mut);font-weight:600}
main{padding:14px;display:flex;flex-direction:column;gap:14px;max-width:1500px;margin:0 auto}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kgrid .kpi b{font-size:17.5px}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:14px}.g2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.chartbox{height:300px;position:relative}
.acctline{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12.5px}
.acctline span{color:var(--mut)}.acctline b{text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:120px 1fr 92px;gap:10px;align-items:center;font-size:12px}
.brow .bt{height:10px;border-radius:5px;background:var(--panel2);position:relative;overflow:hidden}
.brow .bt i{position:absolute;top:0;bottom:0;border-radius:5px}
.brow b{text-align:right;font-variant-numeric:tabular-nums}
.brow small{color:var(--mut);font-size:11px}
.ins{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.ins .ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--panel2)}
.ins.good .ic{background:var(--upbg)}.ins.bad .ic{background:var(--dnbg)}.ins.warn .ic{background:rgba(230,150,20,.14)}
.ins b{font-size:13px}.ins p{color:var(--mut);font-size:12.5px;margin-top:2px}
.ins .imp{margin-left:auto;font-weight:800;font-size:13px;white-space:nowrap;align-self:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 110px;gap:6px}
.cal .hd{font-size:11px;font-weight:700;color:var(--mut);text-align:center;padding:4px 0}
.cal .d{min-height:86px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:7px 8px;display:flex;flex-direction:column;gap:2px;cursor:pointer;position:relative}
.cal .d:hover{border-color:var(--line2)}
.cal .d.out{opacity:.35;cursor:default}
.cal .d .dn_{font-size:11px;font-weight:700;color:var(--mut)}
.cal .d b{font-size:14px;font-weight:800;margin-top:auto;font-variant-numeric:tabular-nums}
.cal .d small{font-size:10.5px;color:var(--mut)}
.cal .d .nt{position:absolute;top:6px;right:7px;font-size:11px}
.cal .wk{border-radius:10px;background:var(--panel2);border:1px dashed var(--line2);padding:7px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.cal .wk small{font-size:10.5px;color:var(--mut)}.cal .wk b{font-size:13px;font-variant-numeric:tabular-nums}
.calnav{display:flex;align-items:center;gap:8px}
.calnav h4{font-size:16px;min-width:150px;text-align:center}
.twrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tbl tbody tr{cursor:pointer}
.tbl th.on{color:var(--acc)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);margin-right:3px}
.tag.m{background:var(--dnbg);color:var(--dn);border-color:transparent}
.stars{color:var(--orange);letter-spacing:1px}
/* trade drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);z-index:45;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;display:flex;flex-direction:column}
#drawer.on{transform:none;visibility:visible;transition:transform .22s ease}
#drawer header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#drawer header h3{font-size:17px}
#drawer .body{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
#tchart{height:300px;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.facts div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.facts small{display:block;font-size:10.5px;color:var(--mut);font-weight:600}.facts b{font-size:13.5px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:28px;padding:0 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600;color:var(--mut)}
.chips button.on{background:var(--accbg);color:var(--acc);border-color:var(--accline)}
.chips.m button.on{background:var(--dnbg);color:var(--dn);border-color:transparent}
.chips button.add{border-style:dashed}
.rate button{font-size:20px;color:var(--line2);padding:0 1px}.rate button.on{color:var(--orange)}
#scrim{position:fixed;inset:0;z-index:44;background:rgba(10,14,12,.35);display:none}#scrim.on{display:block}
svg.viz{width:100%;display:block;overflow:visible}
.legendx{display:flex;gap:12px;font-size:11px;color:var(--mut);flex-wrap:wrap}.legendx i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.empty-big{padding:60px 20px}
@media (max-width:1000px){.g2,.g2e,.g3{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.cal{grid-template-columns:repeat(7,1fr)}.cal .wk{display:none}.cal .d{min-height:62px;padding:5px}.cal .d b{font-size:11.5px}}
@media (max-width:640px){#themeSeg{display:none}.jtop{padding:0 10px}.jtop select{min-width:0;flex:0 1 auto}main{padding:10px}main>*,.g2>*,.g2e>*,.g3>*{min-width:0}.card{overflow-x:auto}.kgrid .kpi b{font-size:15px;white-space:normal;overflow:visible;text-overflow:clip}.kgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.brand b,.jtop .hide-sm{display:none}.brow{grid-template-columns:90px 1fr 80px}}
@media print{.jtop,.tabsj,.filters,#drawer,#scrim,.noprint{display:none!important}main{max-width:none;padding:0}.card,.kpi{break-inside:avoid}}
</style>
</head>
<body>
<header class="jtop">
  <a class="brand" href="terminal_pro.html" style="text-decoration:none;color:inherit" title="Back to the terminal">
    <svg viewBox="0 0 32 32"><defs><linearGradient id="lgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffdc91"/><stop offset="1" stop-color="#e0960c"/></linearGradient></defs><path d="M16 2.5 28.5 9.5v13L16 29.5 3.5 22.5v-13z" fill="url(#lgG)"/><path d="M9.5 19.5l4.2-5 3.3 3.2 5.5-6.7" fill="none" stroke="#1a1203" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <b>Goldmine</b><span>JOURNAL</span></a>
  <select id="acctSel" title="Account"></select>
  <span class="grow"></span>
  <a class="btn hide-sm" href="terminal_pro.html">← Terminal</a>
  <button class="btn" data-act="reload" title="Reload from MT5">↻</button>
  <button class="btn hide-sm" data-act="csv" title="Export the filtered trades with your notes">⇩ CSV</button>
  <button class="btn hide-sm" data-act="print" title="Print or save a PDF report">🖨 Report</button>
  <div class="seg" id="themeSeg"><button data-th="light">Light</button><button data-th="dark">Dark</button><button data-th="midnight">Night</button></div>
</header>
<nav class="tabsj" id="tabs"></nav>
<div class="filters" id="filters"></div>
<main id="main"></main>
<div id="scrim"></div>
<aside id="drawer"></aside>
<div id="toasts"></div>

<script>
'use strict';
/* =====================================================================
   GOLDMINE JOURNAL: every closed trade from MT5, enriched and analysed.
   Data: /api/journal (bridge) → enrich() → filters → stats() → views.
   Your notes, tags, setups, emotions and ratings stay in this browser.
   ===================================================================== */
const LWC = window.LightweightCharts;
const avg = a => a.length ? sum(a) / a.length : 0;
const sd = a => { if (a.length < 2) return 0; const m = avg(a); return Math.sqrt(sum(a, x => (x - m) ** 2) / (a.length - 1)) };
const pct = (v, d = 1) => (isFinite(v) ? v : 0).toFixed(d) + '%';
const rfmt = v => v == null || !isFinite(v) ? '—' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + 'R';
const fxp = (t, v) => v ? Number(v).toFixed(t.digits ?? 2) : '—';
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const SESSIONS = ['Asia', 'London', 'London/NY overlap', 'New York', 'After hours'];
const HOLDS = ['< 5m', '5–30m', '30m–2h', '2–8h', '8–24h', '> 1 day'];
const REASONS = { 0: 'Manual', 1: 'Manual (mobile)', 2: 'Manual (web)', 3: 'Expert / EA', 4: 'Stop loss', 5: 'Take profit', 6: 'Stop out' };
const LISTS = {
  setups: store.get('jl_setups', ['Breakout', 'Pullback', 'Reversal', 'Range', 'Trend continuation', 'Liquidity sweep', 'News']),
  tags: store.get('jl_tags', ['A+ setup', 'Scaled in', 'Partial taken', 'Moved SL to BE', 'Held overnight', 'Counter-trend']),
  mistakes: store.get('jl_mistakes', ['No stop loss', 'Oversized', 'Revenge trade', 'FOMO entry', 'Moved stop away', 'Cut winner early', 'Ignored plan', 'Overtrading']),
};
const EMOTIONS = [['', '—'], ['focused', '🎯 Focused'], ['calm', '😌 Calm'], ['confident', '💪 Confident'], ['fearful', '😰 Fearful'], ['greedy', '🤑 Greedy'], ['frustrated', '😤 Frustrated'], ['bored', '😐 Bored']];

const J = {
  login: store.get('login', 0), accounts: [], raw: null, all: [], trades: [], cash: [],
  tab: location.hash.slice(1) || store.get('jtab', 'overview'), f: Object.assign({ range: '90', sym: '', side: '', out: '', sess: '', setup: '', q: '' }, store.get('jfilt', {})),
  sort: { k: 'close_time', d: -1 }, limit: 150, cal: '', charts: [],
};

/* ---------- journal notes (per account + position), kept in this browser ---------- */
let META = store.get('jmeta', {}), DAYN = store.get('jdays', {});
const mkey = t => J.login + ':' + t.position;
function metaOf(t) {
  const m = META[mkey(t)]; if (m) return m;
  if (!CFG.demo) return {};
  // demo: deterministic sample notes so every psychology view has data
  const h = (t.position * 2654435761) >>> 0, r = k => ((h >>> k) % 100) / 100, loss = t.net < 0;
  return { setup: LISTS.setups[h % 6], emotion: loss && r(3) < .45 ? ['frustrated', 'fearful', 'greedy'][h % 3] : ['focused', 'calm', 'confident', 'bored'][h % 4], rating: loss ? 1 + (h % 3) : 3 + (h % 3),
    plan: !(loss && r(5) < .5), mistakes: loss && r(7) < .55 ? [LISTS.mistakes[h % 8]] : [], tags: r(9) < .3 ? [LISTS.tags[h % 6]] : [], sample: true };
}
function saveMeta(t, m) { delete m.sample; META[mkey(t)] = m; store.set('jmeta', META) }

/* =====================================================================
   1. LOAD + ENRICH
   ===================================================================== */
function sessionOf(t) { const h = new Date((t - GP.off) * 1000).getUTCHours(); return h < 7 ? 'Asia' : h < 12 ? 'London' : h < 16 ? 'London/NY overlap' : h < 21 ? 'New York' : 'After hours' }
function holdOf(s) { return s < 300 ? HOLDS[0] : s < 1800 ? HOLDS[1] : s < 7200 ? HOLDS[2] : s < 28800 ? HOLDS[3] : s < 86400 ? HOLDS[4] : HOLDS[5] }
function enrich(raw) {
  const trades = raw.trades.map(t => {
    const dir = t.side === 'BUY' ? 1 : -1, mpu = t.money_per_unit || 1, q = tzParts(t.open_time), qc = tzParts(t.close_time);
    const riskM = t.sl_initial ? Math.abs(t.open_price - t.sl_initial) * mpu * t.volume : 0;
    const x = { ...t, dir, dur: t.close_time - t.open_time, riskM, R: riskM ? t.net / riskM : null,
      planRR: t.sl_initial && t.tp_initial ? Math.abs(t.tp_initial - t.open_price) / Math.abs(t.open_price - t.sl_initial) : null,
      mfeM: t.mfe != null ? t.mfe * mpu * t.volume : null, maeM: t.mae != null ? t.mae * mpu * t.volume : null,
      move: (t.close_price - t.open_price) * dir, day: `${qc.y}-${pad2(qc.mo)}-${pad2(qc.d)}`, month: `${qc.y}-${pad2(qc.mo)}`,
      wd: WD[(['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].indexOf(q.wd) + 7) % 7] || q.wd, hour: q.h, session: sessionOf(t.open_time),
      exit: REASONS[t.reason] ?? 'Manual', outcome: t.net > 0.005 ? 'win' : t.net < -0.005 ? 'loss' : 'be', costs: (t.commission || 0) + (t.swap || 0) + (t.fee || 0) };
    x.hold = holdOf(x.dur); x.mfeR = riskM && x.mfeM != null ? x.mfeM / riskM : null; x.maeR = riskM && x.maeM != null ? x.maeM / riskM : null;
    x.eff = t.mfe > 0 ? clamp(x.move / t.mfe, -3, 1) : null;
    return x;
  }).sort((a, b) => a.close_time - b.close_time);
  // running balance from deposits / withdrawals + closed trades → risk % and return per trade
  const ev = [...raw.cash.map(c => ({ t: c.time, a: c.amount, cash: 1 })), ...trades.map(t => ({ t: t.close_time, tr: t }))].sort((a, b) => a.t - b.t);
  const known = sum(raw.cash, c => c.amount) + sum(trades, t => t.net);
  let bal = raw.account.balance - known; // balance before the first event in the window
  for (const e of ev) { if (e.cash) bal += e.a; else { e.tr.balBefore = bal; bal += e.tr.net; e.tr.balAfter = bal; e.tr.riskPct = e.tr.riskM && e.tr.balBefore > 0 ? e.tr.riskM / e.tr.balBefore * 100 : null; e.tr.ret = e.tr.balBefore > 0 ? e.tr.net / e.tr.balBefore * 100 : 0 } }
  // revenge / tilt context: was the previous trade a loss, closed shortly before this one opened?
  const byOpen = [...trades].sort((a, b) => a.open_time - b.open_time);
  for (const t of byOpen) {
    const prev = trades.filter(p => p.close_time <= t.open_time).slice(-2);
    const last = prev[prev.length - 1];
    t.afterLoss = !!(last && last.net < 0); t.revenge = !!(last && last.net < 0 && t.open_time - last.close_time < 1800);
    t.after2L = prev.length === 2 && prev.every(p => p.net < 0);
  }
  return trades;
}
async function load() {
  $('#main').innerHTML = `<div class="empty empty-big"><b>Loading your trades…</b><p>Reading the full deal history from MT5 and computing MAE / MFE for each trade.</p></div>`;
  try {
    if (!CFG.demo && !CFG.key) throw new Error('No bridge key yet: open the terminal, connect once, then come back.');
    const a = await api('/api/accounts'); J.accounts = a.accounts;
    if (!J.accounts.some(x => x.login === J.login)) J.login = J.accounts[0]?.login;
    $('#acctSel').innerHTML = J.accounts.map(x => `<option value="${x.login}" ${x.login === J.login ? 'selected' : ''}>${esc(x.name)} · ${x.login}</option>`).join('');
    J.raw = await api(`/api/journal?login=${J.login}&days=3650&excursion=1`);
    CURRENCY = J.raw.account.currency || 'USD';
    J.all = enrich(J.raw); J.cash = J.raw.cash;
    renderFilters(); apply();
  } catch (e) { $('#main').innerHTML = `<div class="empty empty-big"><b>Could not load the journal</b><p>${esc(e.message)}</p><p><a class="btn acc" href="terminal_pro.html?demo=1">Open the demo instead</a></p></div>` }
}

/* =====================================================================
   2. FILTERS
   ===================================================================== */
function renderFilters() {
  const opt = (id, label, list, cur) => `<select data-f="${id}" title="${label}"><option value="">${label}: all</option>${list.map(v => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>`;
  const syms = [...new Set(J.all.map(t => t.symbol))].sort();
  $('#filters').innerHTML = `<div class="seg" id="rangeSeg">${[['7', '7D'], ['30', '30D'], ['90', '90D'], ['ytd', 'YTD'], ['365', '1Y'], ['all', 'All']].map(([v, l]) => `<button data-range="${v}" class="${J.f.range === v ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${opt('sym', 'Symbol', syms, J.f.sym)}${opt('side', 'Side', ['BUY', 'SELL'], J.f.side)}${opt('out', 'Result', ['win', 'loss', 'be'], J.f.out)}${opt('sess', 'Session', SESSIONS, J.f.sess)}${opt('setup', 'Setup', LISTS.setups, J.f.setup)}
    <input data-f="q" placeholder="Search notes, tags…" value="${esc(J.f.q)}" style="width:170px">
    ${Object.entries(J.f).some(([k, v]) => v && k !== 'range') ? '<button class="btn sm ghost" data-act="clearF">✕ Clear filters</button>' : ''}
    <span class="count" id="fcount"></span>`;
}
function apply() {
  const f = J.f, now = J.raw.now, y0 = Date.UTC(new Date().getUTCFullYear(), 0, 1) / 1000;
  const from = f.range === 'all' ? 0 : f.range === 'ytd' ? y0 + GP.off : now + GP.off - (+f.range) * 86400;
  const q = f.q.trim().toLowerCase();
  J.trades = J.all.filter(t => {
    if (t.close_time < from) return false;
    if (f.sym && t.symbol !== f.sym) return false; if (f.side && t.side !== f.side) return false; if (f.out && t.outcome !== f.out) return false; if (f.sess && t.session !== f.sess) return false;
    const m = metaOf(t); if (f.setup && m.setup !== f.setup) return false;
    if (q && ![m.notes, m.setup, ...(m.tags || []), ...(m.mistakes || []), t.symbol, t.comment].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
  store.set('jfilt', J.f);
  $('#fcount') && ($('#fcount').textContent = `${J.trades.length} of ${J.all.length} trades`);
  render();
}

/* =====================================================================
   3. STATISTICS
   ===================================================================== */
function stats(ts) {
  const n = ts.length, W = ts.filter(t => t.outcome === 'win'), Lz = ts.filter(t => t.outcome === 'loss');
  const gp = sum(W, t => t.net), gl = -sum(Lz, t => t.net), net = gp - gl, Rs = ts.filter(t => t.R != null).map(t => t.R);
  let cum = 0, peak = 0, dd = 0, ddPct = 0, cw = 0, cl = 0, mw = 0, ml = 0, start = ts[0]?.balBefore || 0, pk = start;
  for (const t of ts) {
    cum += t.net; peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum);
    const b = start + cum; pk = Math.max(pk, b); if (pk > 0) ddPct = Math.max(ddPct, (pk - b) / pk * 100);
    if (t.outcome === 'win') { cw++; cl = 0; mw = Math.max(mw, cw) } else if (t.outcome === 'loss') { cl++; cw = 0; ml = Math.max(ml, cl) }
  }
  const days = group(ts, t => t.day), dn = Object.values(days).map(a => sum(a, t => t.net));
  const wr = n ? W.length / n : 0, payoff = Lz.length && W.length ? (gp / W.length) / (gl / Lz.length) : 0;
  return {
    n, wins: W.length, losses: Lz.length, be: n - W.length - Lz.length, wr: wr * 100, gp, gl, net, pf: gl ? gp / gl : gp ? Infinity : 0,
    avgW: W.length ? gp / W.length : 0, avgL: Lz.length ? gl / Lz.length : 0, payoff, exp: n ? net / n : 0,
    expR: avg(Rs), totalR: sum(Rs), nR: Rs.length, sqn: Rs.length > 1 && sd(Rs) ? Math.sqrt(Math.min(Rs.length, 100)) * avg(Rs) / sd(Rs) : 0,
    dd, ddPct, recovery: dd ? net / dd : 0, best: Math.max(0, ...ts.map(t => t.net)), worst: Math.min(0, ...ts.map(t => t.net)), mw, ml,
    holdW: avg(W.map(t => t.dur)), holdL: avg(Lz.map(t => t.dur)), costs: sum(ts, t => t.costs), comm: sum(ts, t => t.commission || 0), swap: sum(ts, t => t.swap || 0),
    days: dn.length, greenDays: dn.filter(x => x > 0).length, bestDay: Math.max(0, ...dn), worstDay: Math.min(0, ...dn), perDay: dn.length ? n / dn.length : 0,
    consistency: net > 0 ? Math.max(0, ...dn) / net * 100 : 0, kelly: payoff ? (wr - (1 - wr) / payoff) * 100 : 0,

  for (let i = 1; i <= n; i++) { const k = keys.findIndex(([j]) => j >= i), [ja, pa] = keys[k - 1], [jb, pb] = keys[k]; pts.push(pa + (pb - pa) * (i - ja) / (jb - ja || 1) + (rnd() - .5) * vol * .6) }
  x = t.close_price; for (let i = 0; i < pad; i++) { x += (rnd() - .5) * vol * 1.6; pts.push(x) }
  const start = t0 - pad * s, C = [];
  for (let i = 1; i < pts.length; i++) { const o = pts[i - 1], c = pts[i], w = Math.abs(c - o) * .5 + vol * .25 * rnd(); C.push({ time: start + (i - 1) * s, open: +o.toFixed(d), close: +c.toFixed(d), high: +(Math.max(o, c) + w * rnd()).toFixed(d), low: +(Math.min(o, c) - w * rnd()).toFixed(d) }) }
  return { candles: C, digits: d, point: t.point || Math.pow(10, -d) };
}
function curTrade() { return J.all.find(x => x.position === +$('#drawer').dataset.pos) }
function editMeta(fn) { const t = curTrade(); if (!t) return; const m = { mistakes: [], tags: [], ...metaOf(t) }; fn(m); saveMeta(t, m); const scroll = $('#drawer .body').scrollTop; openTrade(t.position).then(() => { $('#drawer .body').scrollTop = scroll }) }
function closeDrawer() { $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); render() }

/* =====================================================================
   8. EVENTS
   ===================================================================== */
document.addEventListener('click', async e => {
  const b = e.target.closest('button,[data-pos],[data-day],[data-sort],[data-month]'); if (!b) return; const d = b.dataset;
  if (d.m) return;
  if (d.tab) { J.tab = d.tab; store.set('jtab', J.tab); window.scrollTo(0, 0); return render() }
  if (d.th) { CFG.theme = d.th; saveCfg(); applyTheme(); return render() }
  if (d.range) { J.f.range = d.range; renderFilters(); return apply() }
  if (d.sort) { J.sort = { k: d.sort, d: J.sort.k === d.sort ? -J.sort.d : -1 }; return render() }
  if (d.cal) { J.cal = d.cal; return render() }
  if (d.day) return dayModal(d.day);
  if (d.month) { J.tab = 'calendar'; J.cal = d.month; return render() }
  if (d.savenote) { const k = J.login + ':' + d.savenote, v = $('#dayNote').value.trim(); if (v) DAYN[k] = v; else delete DAYN[k]; store.set('jdays', DAYN); resolveModal(null); toast('Daily note saved', 'ok'); return render() }
  if (d.pos && !b.closest('#drawer')) { resolveModal(null); return openTrade(+d.pos) }
  if (d.nav) { const list = [...J.trades].sort((a, c) => a.close_time - c.close_time), i = list.findIndex(t => t.position === +$('#drawer').dataset.pos), n = list[i + +d.nav]; if (n) openTrade(n.position); return }
  if (d.setup != null) return editMeta(m => m.setup = m.setup === d.setup ? '' : d.setup);
  if (d.tagx != null) return editMeta(m => m.tags = m.tags.includes(d.tagx) ? m.tags.filter(x => x !== d.tagx) : [...m.tags, d.tagx]);
  if (d.mistake != null) return editMeta(m => m.mistakes = m.mistakes.includes(d.mistake) ? m.mistakes.filter(x => x !== d.mistake) : [...m.mistakes, d.mistake]);
  if (d.rate) return editMeta(m => m.rating = m.rating === +d.rate ? 0 : +d.rate);
  if (d.addlist) {
    const key = { setup: 'setups', tagx: 'tags', mistake: 'mistakes' }[d.addlist], v = await formBox(`New ${key.slice(0, -1)}`, [{ id: 'v', label: 'Name', value: '', text: true }], 'Add'); if (!v || !v.v) return;
    LISTS[key].push(v.v); store.set('jl_' + key, LISTS[key]); return editMeta(() => {});
  }
  switch (d.act) {
    case 'closeDrawer': return closeDrawer();
    case 'reload': return load();
    case 'more': J.limit += 300; return render();
    case 'clearF': J.f = { range: J.f.range, sym: '', side: '', out: '', sess: '', setup: '', q: '' }; renderFilters(); return apply();
    case 'print': J.tab = 'overview'; render(); return setTimeout(() => print(), 400);
    case 'csv': return exportCsv();
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.f) { J.f[e.target.dataset.f] = e.target.value; renderFilters(); return apply() }
  if (e.target.id === 'acctSel') { J.login = +e.target.value; store.set('login', J.login); return load() }
  if (e.target.id === 'jEmo') return editMeta(m => m.emotion = e.target.value);
  if (e.target.id === 'jPlan') return editMeta(m => m.plan = e.target.checked);
});
let qT; document.addEventListener('input', e => { if (e.target.dataset.f === 'q') { clearTimeout(qT); qT = setTimeout(() => { J.f.q = e.target.value; apply() }, 250) } });
document.addEventListener('focusout', e => { if (e.target.id === 'jNotes') { const t = curTrade(); if (t) { const m = { mistakes: [], tags: [], ...metaOf(t), notes: e.target.value }; saveMeta(t, m); toast('Note saved', 'ok') } } });
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (modalOpen()) resolveModal(null); else if ($('#drawer').classList.contains('on')) closeDrawer() }
  if ($('#drawer').classList.contains('on') && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) $(`#drawer [data-nav="${e.key === 'ArrowLeft' ? -1 : 1}"]`)?.click();
});
function exportCsv() {
  const cols = ['position', 'symbol', 'side', 'volume', 'open_time', 'close_time', 'open_price', 'close_price', 'sl_initial', 'sl', 'tp_initial', 'profit', 'commission', 'swap', 'net', 'R', 'riskPct', 'mfeR', 'maeR', 'dur', 'session', 'exit'];
  const rows = [[...cols, 'setup', 'tags', 'mistakes', 'emotion', 'rating', 'followed_plan', 'notes'], ...J.trades.map(t => { const m = metaOf(t); return [...cols.map(k => k.endsWith('_time') ? fmtDT(t[k]) : t[k] ?? ''), m.setup || '', (m.tags || []).join('; '), (m.mistakes || []).join('; '), m.emotion || '', m.rating || '', m.plan === false ? 'no' : 'yes', m.notes || ''] })];
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' }));
  a.download = `goldmine-journal-${J.login}-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}

load();
</script>
