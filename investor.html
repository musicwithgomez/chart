<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Investor · Gomez Trading</title><link rel="stylesheet" href="gm.css"></head><body>
<div id="views">
 <section data-v="ov"><div class="card" id="acct" style="margin-bottom:14px"></div><div class="kp" id="kpi"></div><h3 style="margin:22px 0 10px">Traders you copy</h3><div class="card tw" id="mt"></div><p class="hint">Trading involves risk of loss. A performance fee applies only on profit above your high-water mark, and nothing is charged on losses.</p></section>
 <section data-v="di"><div class="gr" id="tt"></div></section>
</div>
<script type="module">
import{guard,db,F,esc,money,money2,accrued,FEE_DEFAULT,icon,ini,dt,mount,toast,ask,dlg,pwEncrypt}from"./gm.js";
const me=await guard(["investor","admin"]),$=s=>document.querySelector(s);
const sh=mount(me,{items:[{id:"ov",label:"Portfolio",icon:"wallet",title:"Portfolio",sub:"Your copied traders and capital"},{id:"di",label:"Discover",icon:"star",title:"Discover traders",sub:"Pick a trader to copy"}],
 extra:me.role==="admin"?`<a class="ni" href="admin.html">${icon("home")}Back to admin</a>`:""});
let M=[],T=[],AC=null,PUB=null;
async function load(){
 const[a,b,ad,pk]=await Promise.all([F.getDocs(F.query(F.collection(db,"follows"),F.where("investorId","==",me.uid))),F.getDocs(F.collection(db,"traders")),F.getDoc(F.doc(db,"accounts",me.uid)),F.getDoc(F.doc(db,"platform","crypto")).catch(e=>({exists:()=>false,err:e}))]);AC=ad.exists()?ad.data():null;PUB=pk.exists()?pk.data().pub||null:null;
 M=a.docs.map(d=>({id:d.id,...d.data()}));T=b.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.status==="active"&&t.id!==me.uid);
 const ac=M.filter(f=>f.status==="active");
 const stp=(n,t,ok)=>`<span class="pl ${ok?"g":""}">${n}. ${t}</span>`,lk=AC?.status==="linked";
 $("#acct").innerHTML=AC?`<div class="cb"><div class="al" style="border:0"><div><b>${esc(AC.broker)} · ${esc(AC.server)}</b><div class="hint">MT5 account ${esc(AC.login)}</div></div><span class="sp"></span>${stp(1,"Account added",1)} ${stp(2,"Linked by us",lk)} ${stp(3,"Copying",lk&&ac.length)}</div>${lk?"":`<p class="hint" style="margin:6px 0 0">${AC.status==="rejected"?"We couldn't connect this account. Please contact support.":"We're connecting your account. You can already choose a trader below."}</p>`}${!AC.pw&&PUB&&AC.status==="submitted"?`<div class="tbar" style="margin:10px 0 0"><input id="apw2" type="password" autocomplete="off" placeholder="MT5 password"><button class="b pr" id="apsv">Save password</button></div><p class="hint" style="margin:6px 0 0">We need your MT5 password to connect your account. It is encrypted in your browser before it is sent.</p>`:""}</div>`:
 `<div class="cb"><b>Step 1: add your trading account</b><p class="hint" style="margin:2px 0 12px">Add the MT5 account you want to copy trades into. Your password is encrypted in your browser before it is sent, and is only used to connect your account to copy trades.${PUB?"":` <b>Password setup isn't finished yet, please check back soon.</b>`}</p><div class="tbar" style="margin:0"><input id="ab" placeholder="Broker (e.g. Vantage)"><input id="as" placeholder="Server (e.g. VantageMarkets-Demo)"><input id="al" inputmode="numeric" placeholder="MT5 login number"><input id="apw" type="password" autocomplete="off" placeholder="MT5 password"><button class="b pr" id="asv">Add account</button></div></div>`;
 $("#kpi").innerHTML=[["Traders copied",ac.length,"Active right now"],["Capital allocated",money(ac.reduce((s,f)=>s+(+f.amount||0),0)),"Across all traders"]].map(([l,v,t])=>`<div class="card kpi"><small>${l}</small><b>${v}</b><span>${t}</span></div>`).join("");
 $("#mt").innerHTML=M.length?`<table class="tb"><tr><th>Trader</th><th>Amount</th><th>Equity</th><th>Fee</th><th>Since</th><th>Status</th><th></th></tr>${M.map(f=>`<tr><td><div class="pc"><span class="av">${esc(ini(f.traderName))}</span><b>${esc(f.traderName)}</b></div></td><td>${money(f.amount)}</td><td>${f.equity!=null?money2(f.equity):"–"}</td><td>${f.feePct??FEE_DEFAULT}% · ${money2(accrued(f))}</td><td>${dt(f.createdAt)}</td><td><span class="pl ${f.status==="active"?"g":""}">${f.status==="active"?"Active":"Stopped"}</span></td><td>${f.status==="active"?`<button class="b sm dn" data-s="${f.id}">Stop copying</button>`:""}</td></tr>`).join("")}</table>`:`<div class="em"><b>You aren't copying anyone yet</b>Open <a href="#di" style="color:var(--gd)">Discover</a> to choose a trader.</div>`;
 const on=new Set(ac.map(f=>f.traderId));
 $("#tt").innerHTML=T.length?T.map(t=>`<div class="card cb"><div class="pc"><span class="av">${esc(ini(t.displayName))}</span><b>${esc(t.displayName)}</b><span class="sp"></span>${on.has(t.id)?`<span class="pl g">Copying</span>`:`<button class="b sm pr" data-c="${t.id}" data-n="${esc(t.displayName)}" data-p="${t.feePct??FEE_DEFAULT}">Copy</button>`}</div><p class="hint" style="margin:10px 0 0">${t.feePct??FEE_DEFAULT}% of profit · nothing on losses</p></div>`).join(""):`<div class="card em" style="grid-column:1/-1"><b>No traders available yet</b>Approved traders will show up here.</div>`;
}
document.body.addEventListener("click",async e=>{
 const s=e.target.closest("[data-s]"),c=e.target.closest("[data-c]");
 try{
  if(e.target.id==="asv"){const b=$("#ab").value.trim(),sv=$("#as").value.trim(),l=$("#al").value.trim(),pw=$("#apw").value;if(!b||!sv||!/^\d{4,12}$/.test(l)||!pw){toast("Fill in broker, server, MT5 login and password",1);return}
   if(!PUB){toast("Password setup isn't finished yet. Please try again later.",1);return}
   await F.setDoc(F.doc(db,"accounts",me.uid),{ownerName:me.data.displayName||me.u.email,broker:b,server:sv,login:l,pw:await pwEncrypt(PUB,pw),status:"submitted",createdAt:F.serverTimestamp()});toast("Account added");await load();return}
  if(e.target.id==="apsv"){const pw=$("#apw2").value;if(!pw){toast("Enter your MT5 password",1);return}await F.updateDoc(F.doc(db,"accounts",me.uid),{pw:await pwEncrypt(PUB,pw)});toast("Password saved");await load();return}
  if(c&&!AC){toast("Add your trading account first",1);return}
  if(c&&M.some(f=>f.status==="active")){toast("You're already copying a trader. Stop that first.",1);return}
  if(s){if(!await ask("Stop copying?","New trades will no longer be copied. This doesn't close trades already open.","Stop copying",1))return;await F.updateDoc(F.doc(db,"follows",s.dataset.s),{status:"stopped"});toast("Stopped copying");await load()}
  if(c){const d=dlg(`<h3>Copy ${esc(c.dataset.n)}</h3><p>Choose how much to allocate. Fee: <b>${c.dataset.p}%</b> of profit above your high-water mark; nothing on losses. Trading involves risk of loss.</p><input id="amt" type="number" min="1" inputmode="decimal" placeholder="Amount in USD" style="width:100%;margin-bottom:18px"><div class="ra"><button class="b" data-x>Cancel</button><button class="b pr" data-ok>Start copying</button></div>`);
   d.addEventListener("click",async ev=>{if("x"in ev.target.dataset)d.remove();if("ok"in ev.target.dataset){const v=parseFloat(d.querySelector("#amt").value);if(!(v>0)){toast("Enter an amount",1);return}
    try{const old=M.find(f=>f.id===me.uid+"_"+c.dataset.c);if(old)await F.updateDoc(F.doc(db,"follows",old.id),{status:"active",amount:v});else await F.setDoc(F.doc(db,"follows",me.uid+"_"+c.dataset.c),{investorId:me.uid,investorName:me.data.displayName||me.u.email,traderId:c.dataset.c,traderName:c.dataset.n,amount:v,status:"active",feePct:+c.dataset.p,createdAt:F.serverTimestamp()});d.remove();toast("You are now copying "+c.dataset.n);await load();sh.show("ov")}catch(x){toast(x.message,1)}}})}
 }catch(x){console.error(x);toast(x.code==="permission-denied"?"Permission denied by Firestore. Publish the latest firestore.rules in Firebase Console (Firestore > Rules > Publish).":x.message,1)}
});
await load();sh.show(location.hash.slice(1)||"ov");
</script></body></html>
