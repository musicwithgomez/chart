<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Investor · Gomez Trading</title><link rel="stylesheet" href="gm.css"></head><body>
<div id="views">
 <section data-v="ov"><div class="kp" id="kpi"></div><h3 style="margin:22px 0 10px">Traders you copy</h3><div class="card tw" id="mt"></div><p class="hint">Trading involves risk of loss. A performance fee applies only on profit.</p></section>
 <section data-v="di"><div class="gr" id="tt"></div></section>
</div>
<script type="module">
import{guard,db,F,esc,money,icon,ini,dt,mount,toast,ask,dlg}from"./gm.js";
const me=await guard(["investor","admin"]),$=s=>document.querySelector(s);
const sh=mount(me,{items:[{id:"ov",label:"Portfolio",icon:"wallet",title:"Portfolio",sub:"Your copied traders and capital"},{id:"di",label:"Discover",icon:"star",title:"Discover traders",sub:"Pick a trader to copy"}],
 extra:me.role==="admin"?`<a class="ni" href="admin.html">${icon("home")}Back to admin</a>`:""});
let M=[],T=[];
async function load(){
 const[a,b]=await Promise.all([F.getDocs(F.query(F.collection(db,"follows"),F.where("investorId","==",me.uid))),F.getDocs(F.collection(db,"traders"))]);
 M=a.docs.map(d=>({id:d.id,...d.data()}));T=b.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.status==="active"&&t.id!==me.uid);
 const ac=M.filter(f=>f.status==="active");
 $("#kpi").innerHTML=[["Traders copied",ac.length,"Active right now"],["Capital allocated",money(ac.reduce((s,f)=>s+(+f.amount||0),0)),"Across all traders"]].map(([l,v,t])=>`<div class="card kpi"><small>${l}</small><b>${v}</b><span>${t}</span></div>`).join("");
 $("#mt").innerHTML=M.length?`<table class="tb"><tr><th>Trader</th><th>Amount</th><th>Since</th><th>Status</th><th></th></tr>${M.map(f=>`<tr><td><div class="pc"><span class="av">${esc(ini(f.traderName))}</span><b>${esc(f.traderName)}</b></div></td><td>${money(f.amount)}</td><td>${dt(f.createdAt)}</td><td><span class="pl ${f.status==="active"?"g":""}">${f.status==="active"?"Active":"Stopped"}</span></td><td>${f.status==="active"?`<button class="b sm dn" data-s="${f.id}">Stop copying</button>`:""}</td></tr>`).join("")}</table>`:`<div class="em"><b>You aren't copying anyone yet</b>Open <a href="#di" style="color:var(--gd)">Discover</a> to choose a trader.</div>`;
 const on=new Set(ac.map(f=>f.traderId));
 $("#tt").innerHTML=T.length?T.map(t=>`<div class="card cb"><div class="pc"><span class="av">${esc(ini(t.displayName))}</span><b>${esc(t.displayName)}</b><span class="sp"></span>${on.has(t.id)?`<span class="pl g">Copying</span>`:`<button class="b sm pr" data-c="${t.id}" data-n="${esc(t.displayName)}">Copy</button>`}</div></div>`).join(""):`<div class="card em" style="grid-column:1/-1"><b>No traders available yet</b>Approved traders will show up here.</div>`;
}
document.body.addEventListener("click",async e=>{
 const s=e.target.closest("[data-s]"),c=e.target.closest("[data-c]");
 try{
  if(s){if(!await ask("Stop copying?","New trades will no longer be copied. This doesn't close trades already open.","Stop copying",1))return;await F.updateDoc(F.doc(db,"follows",s.dataset.s),{status:"stopped"});toast("Stopped copying");await load()}
  if(c){const d=dlg(`<h3>Copy ${esc(c.dataset.n)}</h3><p>Choose how much to allocate. Trading involves risk of loss.</p><input id="amt" type="number" min="1" inputmode="decimal" placeholder="Amount in USD" style="width:100%;margin-bottom:18px"><div class="ra"><button class="b" data-x>Cancel</button><button class="b pr" data-ok>Start copying</button></div>`);
   d.addEventListener("click",async ev=>{if("x"in ev.target.dataset)d.remove();if("ok"in ev.target.dataset){const v=parseFloat(d.querySelector("#amt").value);if(!(v>0)){toast("Enter an amount",1);return}
    try{await F.setDoc(F.doc(db,"follows",me.uid+"_"+c.dataset.c),{investorId:me.uid,investorName:me.data.displayName||me.u.email,traderId:c.dataset.c,traderName:c.dataset.n,amount:v,status:"active",createdAt:F.serverTimestamp()});d.remove();toast("You are now copying "+c.dataset.n);await load();sh.show("ov")}catch(x){toast(x.message,1)}}})}
 }catch(x){toast(x.message,1)}
});
await load();sh.show(location.hash.slice(1)||"ov");
</script></body></html>
