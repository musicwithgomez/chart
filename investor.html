<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gomez Trading · Investor</title><link rel="stylesheet" href="gm.css"></head><body>
<header><b>Gomez Trading</b><span class="tag">INVESTOR</span><span class="sp"></span><a class="b" id="back" href="admin.html" hidden>Admin</a><button class="b" id="out">Sign out</button></header>
<main><h2 id="hi"></h2><div class="g" id="kpi"></div><h2>Who you copy</h2><div class="w" id="mt"></div><h2>Traders you can copy</h2><div class="w" id="tt"></div>
<p class="note">Trading involves risk of loss. A performance fee applies only on profit.</p></main>
<script type="module">
import{guard,db,F,esc,money,logout}from"./gm.js";
const me=await guard(["investor","admin"]);const $=s=>document.querySelector(s);
$("#out").onclick=logout;$("#back").hidden=me.role!=="admin";$("#hi").textContent="Welcome, "+(me.data.displayName||me.u.email);
async function load(){
 const[a,b]=await Promise.all([F.getDocs(F.query(F.collection(db,"follows"),F.where("investorId","==",me.uid))),F.getDocs(F.collection(db,"traders"))]);
 const mine=a.docs.map(d=>({id:d.id,...d.data()})),tr=b.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.status==="active"&&t.id!==me.uid),act=mine.filter(f=>f.status==="active");
 $("#kpi").innerHTML=[["Traders copied",act.length],["Capital allocated",money(act.reduce((s,f)=>s+(+f.amount||0),0))]].map(([l,v])=>`<div class="k"><small>${l}</small><b>${v}</b></div>`).join("");
 $("#mt").innerHTML=mine.length?`<table><tr><th>Trader</th><th>Amount</th><th>Status</th><th></th></tr>${mine.map(f=>`<tr><td>${esc(f.traderName)}</td><td>${money(f.amount)}</td><td><span class="pill ${f.status}">${esc(f.status)}</span></td><td>${f.status==="active"?`<button class="b s d" data-s="${f.id}">Stop copying</button>`:""}</td></tr>`).join("")}</table>`:`<div class="empty">You aren't copying anyone yet.</div>`;
 const on=new Set(act.map(f=>f.traderId));
 $("#tt").innerHTML=tr.length?`<table><tr><th>Trader</th><th></th></tr>${tr.map(t=>`<tr><td>${esc(t.displayName)}</td><td>${on.has(t.id)?`<span class="pill ok">copying</span>`:`<button class="b s p" data-c="${t.id}" data-n="${esc(t.displayName)}">Copy</button>`}</td></tr>`).join("")}</table>`:`<div class="empty">No traders available yet.</div>`;
}
document.body.addEventListener("click",async e=>{
 const b=e.target.closest("button[data-c],button[data-s]");if(!b)return;
 try{
  if(b.dataset.s)await F.updateDoc(F.doc(db,"follows",b.dataset.s),{status:"stopped"});
  else{const v=parseFloat(prompt("How much do you want to allocate to "+b.dataset.n+"? (USD)"));if(!(v>0))return;
   await F.setDoc(F.doc(db,"follows",me.uid+"_"+b.dataset.c),{investorId:me.uid,investorName:me.data.displayName||me.u.email,traderId:b.dataset.c,traderName:b.dataset.n,amount:v,status:"active",createdAt:F.serverTimestamp()})}
  await load();
 }catch(x){alert(x.message)}
});
await load();
</script></body></html>
