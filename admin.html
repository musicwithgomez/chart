<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gomez Trading · Admin</title><link rel="stylesheet" href="gm.css"></head><body>
<header><b>Gomez Trading</b><span class="tag">ADMIN</span><span class="sp"></span><a class="b" href="terminal.html">Trading terminal</a><button class="b" id="out">Sign out</button></header>
<nav class="t" id="tabs"><button data-t="ov" class="on">Overview</button><button data-t="us">Users</button><button data-t="cp">Copy links</button><button data-t="br">Broker accounts</button></nav>
<main>
<section id="ov"><div class="g" id="kpi"></div><h2>Trader requests</h2><div class="w" id="req"></div><h2>Newest sign-ups</h2><div class="w" id="new"></div></section>
<section id="us" hidden><p><input id="q" placeholder="Search name or email" style="width:100%;max-width:320px"></p><div class="w" id="ut"></div></section>
<section id="cp" hidden><div class="w" id="ct"></div></section>
<section id="br" hidden><div class="g" id="bk"></div><h2>MT5 accounts on your bridge</h2><div class="w" id="bt"></div><p class="note" id="bn"></p></section>
</main>
<script type="module">
import{guard,db,F,esc,money,logout}from"./gm.js";
const me=await guard(["admin"]);const $=s=>document.querySelector(s);
$("#out").onclick=logout;
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));["ov","us","cp","br"].forEach(i=>$("#"+i).hidden=i!==b.dataset.t);if(b.dataset.t==="br")bridge()});
let U=[],FL=[];
const dt=t=>t?.toDate?t.toDate().toLocaleDateString():"–";
const role=u=>(u.roles||[]).includes("trader")?"trader":"investor";
async function load(){
 const[a,b]=await Promise.all([F.getDocs(F.collection(db,"users")),F.getDocs(F.collection(db,"follows"))]);
 U=a.docs.map(d=>({id:d.id,...d.data()}));FL=b.docs.map(d=>({id:d.id,...d.data()}));render();
}
function render(){
 const tr=U.filter(u=>role(u)==="trader"),inv=U.filter(u=>role(u)==="investor"),act=FL.filter(f=>f.status==="active"),pend=U.filter(u=>u.requestedTrader&&role(u)!=="trader");
 $("#kpi").innerHTML=[["Users",U.length],["Traders",tr.length],["Investors",inv.length],["Trader requests",pend.length],["Active copy links",act.length],["Capital copied",money(act.reduce((s,f)=>s+(+f.amount||0),0))]].map(([l,v])=>`<div class="k"><small>${l}</small><b>${v}</b></div>`).join("");
 $("#req").innerHTML=pend.length?`<table>${pend.map(u=>`<tr><td>${esc(u.displayName)}</td><td>${esc(u.email)}</td><td><button class="b s p" data-a="role" data-id="${u.id}" data-v="trader">Approve as trader</button> <button class="b s d" data-a="deny" data-id="${u.id}">Decline</button></td></tr>`).join("")}</table>`:`<div class="empty">No pending requests.</div>`;
 const row=u=>`<tr><td>${esc(u.displayName)}</td><td>${esc(u.email)}</td><td><span class="pill ${role(u)}">${role(u)}</span></td><td><span class="pill ${u.status}">${esc(u.status)}</span></td><td>${dt(u.createdAt)}</td><td>${rbtn(u)}</td></tr>`;
 const rbtn=u=>`<button class="b s" data-a="role" data-id="${u.id}" data-v="${role(u)==="trader"?"investor":"trader"}">Make ${role(u)==="trader"?"investor":"trader"}</button> <button class="b s ${u.status==="blocked"?"":"d"}" data-a="block" data-id="${u.id}">${u.status==="blocked"?"Unblock":"Block"}</button>`;
 const head="<tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th></th></tr>";
 const sorted=[...U].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 $("#new").innerHTML=`<table>${head}${sorted.slice(0,5).map(row).join("")}</table>`;
 const q=$("#q").value.toLowerCase(),list=sorted.filter(u=>(u.displayName+u.email).toLowerCase().includes(q));
 $("#ut").innerHTML=list.length?`<table>${head}${list.map(row).join("")}</table>`:`<div class="empty">No users.</div>`;
 $("#ct").innerHTML=FL.length?`<table><tr><th>Investor</th><th>Copies trader</th><th>Amount</th><th>Status</th><th></th></tr>${FL.map(f=>`<tr><td>${esc(f.investorName)}</td><td>${esc(f.traderName)}</td><td>${money(f.amount)}</td><td><span class="pill ${f.status}">${esc(f.status)}</span></td><td><button class="b s ${f.status==="active"?"d":""}" data-a="fl" data-id="${f.id}" data-v="${f.status==="active"?"stopped":"active"}">${f.status==="active"?"Stop":"Resume"}</button></td></tr>`).join("")}</table>`:`<div class="empty">Nobody is copying anyone yet.</div>`;
}
$("#q").oninput=render;
document.body.addEventListener("click",async e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const{a,id,v}=b.dataset,u=U.find(x=>x.id===id);b.disabled=true;
 try{
  if(a==="role"){await F.updateDoc(F.doc(db,"users",id),{roles:[v],requestedTrader:false});
   await F.setDoc(F.doc(db,"traders",id),{displayName:u.displayName,status:v==="trader"?"active":"inactive",updatedAt:F.serverTimestamp()},{merge:true})}
  if(a==="deny")await F.updateDoc(F.doc(db,"users",id),{requestedTrader:false});
  if(a==="block")await F.updateDoc(F.doc(db,"users",id),{status:u.status==="blocked"?"active":"blocked"});
  if(a==="fl")await F.updateDoc(F.doc(db,"follows",id),{status:v});
  await load();
 }catch(x){alert(x.message);b.disabled=false}
});
// ---- Broker accounts: read from your Python bridge (same URL + key you set in the terminal's Settings)
async function bridge(){
 let base=localStorage.getItem("gm_base")||"",key=localStorage.getItem("gm_key")||"";
 try{const d=await F.getDoc(F.doc(db,"platform","bridge"));if(d.exists()&&d.data().url)base=d.data().url}catch(e){}
 base=base||"http://127.0.0.1:8765";
 const api=p=>fetch(base+p,{headers:{"X-Gomez-Key":key}}).then(async r=>{if(!r.ok)throw Error((await r.json().catch(()=>({}))).detail||r.status);return r.json()});
 $("#bn").textContent="Bridge: "+base;
 try{
  const[ac,cs]=await Promise.all([api("/api/accounts"),api("/api/copy/status")]);
  $("#bk").innerHTML=[["Bridge","Online"],["MT5 accounts",ac.accounts.length],["Copier",cs.running?"Running":"Stopped"],["Open copy links",cs.links.length]].map(([l,v])=>`<div class="k"><small>${l}</small><b>${v}</b></div>`).join("");
  $("#bt").innerHTML=`<table><tr><th>Name</th><th>Login</th><th>Server</th><th>Type</th><th>Balance / Equity</th></tr>${ac.accounts.map(a=>`<tr><td>${esc(a.name)}</td><td>${a.login}</td><td>${esc(a.server)}</td><td><span class="pill ${a.is_demo?"":"blocked"}">${a.is_demo?"demo":"LIVE"}</span></td><td id="bal${a.login}"><button class="b s" data-bal="${a.login}">Load</button></td></tr>`).join("")}</table>`;
  $("#bt").onclick=async e=>{const l=e.target.dataset.bal;if(!l)return;e.target.disabled=true;try{const r=await api("/api/account?login="+l);$("#bal"+l).textContent=`${r.balance} / ${r.equity} ${r.currency||""}`}catch(x){$("#bal"+l).textContent=x.message}};
 }catch(x){$("#bk").innerHTML=`<div class="k"><small>Bridge</small><b style="color:var(--bad)">Offline</b></div>`;$("#bt").innerHTML=`<div class="empty">Can't reach the bridge (${esc(x.message)}). Start app.py and set the key in the Trading terminal → Settings.</div>`}
}
await load();
</script></body></html>
