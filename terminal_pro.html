<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goldmine Pro Terminal</title>
<link rel="stylesheet" href="gp-theme.css?v=20261110v">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
<script src="gp-shared.js?v=20261110v"></script>
<style>
html,body{overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr}
:root{--watchW:248px;--ticketW:304px;--dockH:236px;--railW:40px}

/* top bar */
.top{display:flex;align-items:center;gap:8px;height:54px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;font-size:15px;padding-right:4px;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
.brand span{font-size:9.5px;font-weight:800;color:var(--acc);background:var(--accbg);padding:2px 6px;border-radius:5px;letter-spacing:.08em}
.sym{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap;min-width:0}
.sym:hover{border-color:var(--line2)}
.sym b{font-size:15px;font-weight:800}.sym small{color:var(--mut);font-size:11px}
.sessions{display:flex;gap:4px}
.sessions span{white-space:nowrap;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:20px;color:var(--dim);border:1px solid var(--line)}
.sessions span.on{color:var(--up);border-color:transparent;background:var(--upbg)}
.acct{display:flex;align-items:center;gap:16px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.acct:hover{border-color:var(--line2)}
.acct div{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.acct small{font-size:10px;color:var(--mut);font-weight:600}
.acct b{font-size:13px;font-variant-numeric:tabular-nums}
.conn{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);white-space:nowrap}
.conn i{width:9px;height:9px;border-radius:50%;background:#e0a030}
.conn.ok i{background:#2fd08a;box-shadow:0 0 0 3px var(--upbg)}
.conn.wait i{animation:pulse 1s infinite}
.conn.off i{background:#e0555a}
@keyframes pulse{50%{opacity:.3}}
/* header fits itself (fitHeader): it hides the least important parts first, one level at a time, instead of squashing the symbol */
.top{overflow:hidden}
.top>*{flex:none}.top>.grow{flex:1 1 0;min-width:0}
.top.f1 .sessions{display:none}
.top.f2 :is(#indBtn,#ccBtn) span,.top.f2 .sym small,.top.f2 .sym kbd{display:none}
.top.f3 .acct .hide-md{display:none}
.top.f4 .acct .hfm{display:none}
.top.f5 #tfBar button[data-tf]:not(.on){display:none}
.top.f6 .brand b,.top.f6 .brand span{display:none}
.top.f7 .acct div:not(.eq),.top.f7 .acct .badge,.top.f7 .conn em{display:none}
.top.f8 #indBtn,.top.f8 #ccBtn{display:none}
.top.f9 .brand{display:none}
.top.f10{gap:4px;padding:0 6px}.top.f10 .sym{padding:0 8px}.top.f10 .sym b{font-size:13.5px}.top.f10 .acct{padding:0 8px}.top.f10 .acct b{font-size:12px}.top.f10 #tfBar button{padding:0 7px}.top.f10 .ibtn.sq{width:30px}
.top.f11 .conn{display:none}.top.f11 #wBtn{width:28px}
#banner:empty{display:none}
#banner{display:flex;gap:10px;align-items:center;justify-content:center;padding:6px 12px;font-size:12px;font-weight:700;min-width:0}
#banner>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#banner>button{flex:none;white-space:nowrap}
#banner.live,#banner.lock{background:var(--dnbg);color:var(--dn)}
#banner.sim{background:rgba(33,150,243,.12);color:var(--blue)}
#banner button{text-decoration:underline;font-weight:800}

/* layout */
.main{display:grid;grid-template-columns:var(--watchW) minmax(0,1fr) var(--ticketW);min-height:0;grid-row:3} /* row 3 even when the banner (row 2) is hidden */
.center{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) min(var(--dockH),calc(100% - 150px));min-width:0;min-height:0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.phead{display:flex;align-items:center;gap:6px;height:40px;padding:0 8px 0 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:12px;letter-spacing:.03em;flex:none}
.phead .ibtn{height:28px}

/* collapsible side panels (desktop): a slim strip stays to reopen them */
.foldtab{display:none;width:100%;height:100%;flex-direction:column;align-items:center;gap:10px;padding:12px 0;color:var(--mut);font:600 11px var(--font);letter-spacing:.12em;background:var(--panel)}
.foldtab:hover{color:var(--text);background:var(--hover)}
.foldtab span{writing-mode:vertical-rl;text-orientation:mixed}
.fold{width:26px;height:26px;border-radius:7px;color:var(--mut);font-size:15px;flex:none}
.fold:hover{background:var(--hover);color:var(--text)}
@media (min-width:1101px){
  .main.cw{--watchW:32px}.main.cw .watch>*{display:none}.main.cw .watch>.foldtab{display:flex}
}
@media (min-width:861px){
  .main.ct{--ticketW:32px}.main.ct .ticket>*{display:none!important}.main.ct .ticket>.foldtab{display:flex!important}
}
/* watchlist */
.watch{display:flex;flex-direction:column;background:var(--panel);min-height:0;overflow:hidden}
#wlist{flex:1;overflow:auto;padding:4px 0}
.wrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 12px 8px 14px;cursor:pointer;position:relative;border-left:3px solid transparent}
.wrow:hover{background:var(--hover)}
.wrow.cur{background:var(--panel2);border-left-color:var(--acc)}
.wrow b{font-size:12.5px}
.wrow .px{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
.wrow small{color:var(--mut);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .ch{text-align:right;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.wrow .rng{grid-column:1/-1;height:3px;border-radius:3px;background:var(--line);position:relative;margin-top:3px}
.wrow .rng i{position:absolute;top:-2px;width:3px;height:7px;border-radius:2px;background:var(--text)}
.wrow .rm{position:absolute;right:4px;top:4px;width:18px;height:18px;border-radius:5px;color:var(--mut);display:none;font-size:13px;line-height:18px}
.wrow:hover .rm{display:block;background:var(--panel)}
.acard{border-top:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12px;flex:none}
.acard span{color:var(--mut)}.acard b{text-align:right;font-variant-numeric:tabular-nums}
.gauge{grid-column:1/-1;margin-top:4px}
.gauge .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px}
.gauge .bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.gauge small{display:flex;justify-content:space-between;color:var(--mut);font-size:10.5px}

/* chart */
.chartwrap{position:relative;min-height:0;background:var(--chart)}
#chart,#draw,#tl{position:absolute;top:0;right:0;bottom:0;left:var(--railW)}
#draw{z-index:4;pointer-events:none;width:calc(100% - var(--railW));height:100%;overflow:hidden}
#tl{z-index:6;pointer-events:none;overflow:hidden}
#chart[data-cur=ns] *{cursor:ns-resize!important}
#chart[data-cur=move] *{cursor:move!important}
#chart.dragging *{cursor:grabbing!important}
#chart.drawing *,#chart.picking *{cursor:crosshair!important}
#rail{position:absolute;left:0;top:0;bottom:0;width:var(--railW);z-index:7;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;overflow-y:auto;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
#rail button{position:relative;width:32px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;color:var(--mut)}
#rail button:hover{background:var(--hover);color:var(--text)}
#rail button.on{background:var(--accbg);color:var(--acc)}
#rail svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#rail hr{width:22px;border:0;border-top:1px solid var(--line);margin:4px 0;flex:none}
#legend{position:absolute;left:calc(var(--railW) + 10px);top:8px;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:3px;color:var(--ctext)}
.lg1{display:flex;align-items:center;gap:8px;font-size:13px}
.lg1 b{font-size:14px;font-weight:800}
.lg1 .cd{font-size:11px;font-weight:800;color:#4fe3a0;background:#1d2b27;padding:1px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
#lgOhlc{display:flex;gap:10px;font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums}
#lgOhlc b{font-weight:700}
#lgInd{display:flex;gap:10px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.ctools{position:absolute;right:76px;top:8px;z-index:8;display:flex;gap:4px}
.ctools button{height:28px;padding:0 9px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--mut);font-size:11.5px;font-weight:700;opacity:.92}
.ctools button:hover{color:var(--text);border-color:var(--line2)}
.ctools button.on{background:#e5f7ee;border-color:#9fdcbd;color:#2a9565}
/* chart tools follow the chart's own width (side panels open or closed), so they never run into the legend */
#chartwrap{container-type:inline-size}
@container (max-width:760px){.ctools .lbt{display:none}}
@container (max-width:640px){#emaBtn,#lblBtn{display:none}}
@container (max-width:420px){#lgSym{display:none}.ctools [data-act=fit]{display:none}}
:root[data-theme=dark] .ctools button.on,:root[data-theme=midnight] .ctools button.on{background:#294b3a;border-color:#3c5d4c;color:#61c799}
#pickHint{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:9;background:var(--acc);color:var(--acctx);font-weight:800;font-size:12px;padding:7px 14px;border-radius:30px;box-shadow:var(--shadow);display:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){#pickHint{white-space:normal;text-align:center;width:max-content}}
#pickHint.on{display:block}
#zones{position:absolute;top:0;bottom:0;z-index:2;pointer-events:none}
.zone{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center}
.zone span{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--chip)}
.zone.loss{background:color-mix(in srgb,var(--sell) 14%,transparent);border:1px solid color-mix(in srgb,var(--sell) 40%,transparent)}
.zone.loss span{color:var(--dn)}
.zone.win{background:color-mix(in srgb,var(--buy) 14%,transparent);border:1px solid color-mix(in srgb,var(--buy) 40%,transparent)}
.zone.win span{color:var(--up)}

/* trade labels on the chart: the ORIGINAL Goldmine Sync style
   (white box · 1.2px border in the line colour · radius 5 · 18px · bold 11px system font · dark text · red × inside) */
.chip:hover{z-index:2}
.chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;height:18px;font:700 11px -apple-system,'SF Pro Text','Segoe UI',Arial,sans-serif;white-space:nowrap;pointer-events:auto;user-select:none}
.chip .bd{height:18px;padding:0 7px;display:flex;align-items:center;gap:4px;border-radius:5px;cursor:ns-resize;background:var(--chip);border:1.2px solid var(--c);color:var(--chiptx);box-sizing:border-box}
.chip .bd em{font-style:normal;font-weight:700}
.chip .cx{font:800 15px Arial,sans-serif;color:#ee6a6a;margin-left:3px;cursor:pointer;line-height:1}
.chip .cx:hover{color:#c2383f}
.chip .dr{font-style:normal;color:#999;margin-left:6px}
/* the limit / stop you are preparing (ghost): filled, white text, ✓ and × inside, like the original */
.chip.fill .bd{background:var(--c);border-color:var(--c);color:#fff;font-weight:800}
.chip.fill .cx{color:#fff}
.chip .ok{display:inline-grid;place-items:center;height:12px;padding:0 5px;margin-left:8px;border-radius:4px;background:#ffffffee;color:#168353;font:800 13px Arial,sans-serif;cursor:pointer}
/* ＋ TP / ＋ SL handles, like the original: only visible while you hover (or click) the entry,
   28px above / below the label (TP on the profit side), translucent white with a dashed border */
.chip .hd{position:absolute;right:0;height:20px;width:54px;border-radius:5px;border:1px dashed var(--c2);background:color-mix(in srgb,var(--chip) 72%,transparent);color:var(--c2);font:700 10px -apple-system,'Segoe UI',Arial,sans-serif;cursor:ns-resize;visibility:hidden}
.chip .hd.hu{top:-29px}.chip .hd.hb{top:27px}
.chip .hd.hu::after,.chip .hd.hb::after{content:'';position:absolute;left:0;right:0;height:12px}
.chip .hd.hu::after{top:100%}.chip .hd.hb::after{bottom:100%}
.chip:hover .hd,.chip.act .hd{visibility:visible}
.chip .hd:hover{background:var(--chip)}
/* close confirmation: a green ✓ box next to the label, like the original */
.chip .cf{order:-1;display:grid;place-items:center;width:26px;height:18px;margin-right:6px;border-radius:5px;background:#d6f3e4;border:1px solid #2e9e6b;color:#168353;font:800 13px Arial,sans-serif;cursor:pointer}
:root[data-theme=dark] .chip .cf,:root[data-theme=midnight] .chip .cf{background:#2a513e;border-color:#3c5d4c;color:#5bcd9e}
/* label display modes (Labels: small / lines only / hidden) */
#tl.lines .chip:not(.rk){display:none!important}
#tl.off{display:none}
/* selected-drawing toolbar */
#dtb{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:4px;padding:5px 6px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);font-size:11.5px;max-width:calc(100% - 120px);overflow-x:auto;scrollbar-width:none}
#dtb b{padding:0 6px;white-space:nowrap}
#dtb .sw{width:18px;height:18px;border-radius:5px;border:1px solid var(--line2);flex:none}
#dtb input[type=color]{width:26px;height:22px;border:1px solid var(--line);border-radius:6px;background:none;padding:1px;cursor:pointer;flex:none}
#dtb button.t{height:24px;padding:0 7px;border-radius:6px;color:var(--mut);font-weight:700;white-space:nowrap}
#dtb button.t:hover{background:var(--hover);color:var(--text)}
#dtb button.t.on{background:var(--accbg);color:var(--acc)}
#dtb i{width:1px;height:18px;background:var(--line);flex:none;margin:0 2px}

/* dock */
.dock{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-top:1px solid var(--line);position:relative}
#dockGrip{position:absolute;left:0;right:0;top:-5px;height:10px;cursor:row-resize;z-index:5;touch-action:none;display:flex;justify-content:center;align-items:center}
#dockGrip::after{content:"";width:40px;height:4px;border-radius:3px;background:var(--line2);opacity:0;transition:opacity .15s}
#dockGrip:hover::after,.dock.drag #dockGrip::after{opacity:1}
.tabs{padding-right:44px!important;position:relative}
.dend{position:absolute;right:4px;top:0;height:40px;display:flex;align-items:center;gap:8px;z-index:3;background:var(--panel);padding-left:6px}
.dfold{flex:none;width:30px;height:30px;border-radius:7px;color:var(--mut);font-size:15px;line-height:1}
.dfold:hover{background:var(--hover);color:var(--text)}
.dpl{display:none;font-weight:800;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dock.min .dpl{display:block}
.dock.min .tabs{border-bottom:0}
.dock.min:has(.dpl:not(:empty)) .tabs{padding-right:120px!important}
.dock.min #tabTools,.dock.min #tabBody{display:none}
@media (max-width:860px){
  .dock{padding-top:16px}
  #dockGrip{top:-8px;height:24px;align-items:flex-start;padding-top:13px}
  #dockGrip::after{opacity:1;width:44px;height:5px}
  .dend{top:16px}
}
.tabs{display:flex;align-items:center;gap:8px;padding:0 8px;min-height:40px;border-bottom:1px solid var(--line);flex:none}
.tabsl{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabsl::-webkit-scrollbar{display:none}
.dock.stack .tabs{flex-wrap:wrap;gap:0}.dock.stack .tabsl{flex-basis:100%}
.dock.stack #tabTools{flex-basis:100%;overflow-x:auto;scrollbar-width:none;padding:6px 0;border-top:1px solid var(--line)}
.tabsl>button,.tabsl>a{height:40px;display:flex;align-items:center;padding:0 11px;color:var(--mut);font-weight:700;font-size:12.5px;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
.tabsl>button:hover,.tabsl>a:hover{color:var(--text)}
.tabsl>button.on{color:var(--text);border-bottom-color:var(--acc)}
.tabsl>button i{font-style:normal;font-size:10.5px;background:var(--panel2);border:1px solid var(--line);padding:0 6px;border-radius:10px;margin-left:4px;color:var(--mut)}
.tabsl>a{color:var(--acc)}
#tabTools{display:flex;gap:6px;flex:none}
#tabBody{flex:1;overflow:auto;min-height:0}
.tbl tr[data-sym]{cursor:pointer}
.tbl tr.cur td:first-child{box-shadow:inset 3px 0 var(--acc)}
.acts{display:flex;gap:4px;justify-content:flex-end}
.acts button{height:24px;min-width:26px;padding:0 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--mut)}
.acts button:hover{color:var(--text);border-color:var(--line2)}
.acts button.x:hover{background:var(--sell);color:#fff;border-color:transparent}
.lvl{cursor:pointer;border-bottom:1px dashed var(--line2)}
.lvl:hover{color:var(--acc)}
/* dock: summary strip + position / order cards + history */
.dsum{display:flex;gap:0;position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.dsum>div{padding:7px 14px;border-right:1px solid var(--line);white-space:nowrap;flex:none}
.dsum small{display:block;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.dsum b{font-size:13.5px;font-variant-numeric:tabular-nums}
.dsum em,.prow em,.hrow em{font-style:normal;font-weight:600;font-size:11px;color:var(--mut)}
.warn{color:var(--orange)!important}
.plist{padding:6px 8px 10px;display:flex;flex-direction:column;gap:5px}
.dock{container-type:inline-size}
.trk.none .dot,.trk.none .ent,.trk.none .fill{display:none}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(110px,1.6fr) minmax(0,.8fr) auto;align-items:center;gap:14px;padding:7px 10px 7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);position:relative;cursor:pointer;font-variant-numeric:tabular-nums}
.prow::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--up)}
.prow.SELL::before{background:var(--dn)}
.prow:hover{border-color:var(--line2)}
.prow.cur{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.prow small{display:block;font-size:10.5px;color:var(--mut);margin-top:2px}
.prow .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prow .nm b{font-size:13px}
.tgb{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--up) 60%,transparent);background:color-mix(in srgb,var(--up) 10%,transparent);color:var(--up);font:700 10.5px/1 inherit;cursor:pointer;white-space:nowrap}
.tgb i{font-style:normal;opacity:.6}.tgb:hover i{opacity:1;color:var(--dn)}
.tglist{display:flex;flex-direction:column;gap:5px}
.tglist>div{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:12px;font-variant-numeric:tabular-nums}
.tglist>div>span:first-child{flex:1;min-width:0}
.tglist .btn.sm{height:22px;padding:0 8px;font-size:11px}
.cklist{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.cklist button{display:grid;grid-template-columns:16px 1fr auto 38px;white-space:nowrap;align-items:center;gap:8px;width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);font:inherit;font-size:12px;text-align:left;cursor:pointer;font-variant-numeric:tabular-nums}
.cklist button i{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--mut);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;color:#fff}
.cklist button.on{border-color:var(--acc);background:var(--accbg)}
.cklist button.on i{background:var(--acc);border-color:var(--acc)}
.cklist button:not(.on){opacity:.75}
.cklist em{font-style:normal;font-size:10px;font-weight:800;color:var(--acc);margin-left:4px}

}

#trPanel.on{display:flex}

#trPanel .trh{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
#trPanel .trh{cursor:grab;user-select:none;touch-action:none;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:3px 3px 3px 6px}#trPanel.drag .trh{cursor:grabbing}#trPanel.drag{opacity:.85}
#trPanel .trh .grip{font-style:normal;letter-spacing:-2px;opacity:.6;margin-right:2px}#trPanel .trh b{text-transform:none;letter-spacing:0;font-size:11px;margin-left:6px;color:var(--text)}#trPanel .trh b.st{color:var(--sell)}#trPanel .trh b.bt{color:var(--buy)}#trPanel .trh b.pulse{animation:trBlink 1.2s ease-in-out infinite}@keyframes trBlink{50%{opacity:.45}}
#trPanel.col{width:auto;max-width:420px}#trPanel .trh>*{flex:none}#trPanel .trh span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#trPanel .trh button{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--mut);width:22px;height:22px;cursor:pointer;font-size:11px}
#trPanel .trc.slim{padding:6px 10px}#trPanel .trc.slim>small{margin:0}
#trPanel .trc{background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-left:3px solid var(--mut);border-radius:9px;padding:9px 11px;box-shadow:0 6px 20px -10px rgba(0,0,0,.5)}
#trPanel .trc.s{border-left-color:var(--sell)}#trPanel .trc.b{border-left-color:var(--buy)}
#trPanel .trc.almost{animation:trPulse 1.4s ease-in-out infinite}
#trPanel .trc.go.s{background:color-mix(in srgb,var(--sell) 14%,var(--panel))}#trPanel .trc.go.b{background:color-mix(in srgb,var(--buy) 14%,var(--panel))}
@keyframes trPulse{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 45%,transparent)}}
#trPanel .trc>b{display:block;font-size:12.5px;letter-spacing:.01em}#trPanel .trc>small{display:block;color:var(--mut);font-size:10.5px;margin:1px 0 6px}
#trPanel ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}#trPanel li{display:flex;gap:6px;align-items:baseline;color:var(--mut)}
#trPanel li i{flex:none;width:13px;height:13px;border-radius:4px;border:1.5px solid var(--line2);font-style:normal;font-size:9px;font-weight:900;display:grid;place-items:center;transform:translateY(2px)}
#trPanel li.ok{color:var(--text)}#trPanel li.ok i{background:var(--buy);border-color:var(--buy);color:#fff}
#trPanel li em{font-style:normal;color:var(--acc);font-weight:700;margin-left:auto;white-space:nowrap;padding-left:6px}
#trPanel .trr{margin-top:6px;font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums}
#trPanel .trk{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0}#trPanel .trk span{font-size:9.5px;color:var(--mut);text-transform:uppercase}#trPanel .trk b{display:block;font-size:12px;color:var(--text);text-transform:none;font-variant-numeric:tabular-nums}
#trPanel .trc .btn{margin-top:7px;width:100%}
#trPanel .bt{color:var(--buy);font-weight:800}#trPanel .st{color:var(--sell);font-weight:800}
@media (max-width:860px){#trPanel{width:220px;top:auto;bottom:34px;right:calc(var(--psw, 56px) + 6px);font-size:11px}#trPanel .trc ul,#trPanel .trr{display:none}#trPanel .trc.almost ul{display:grid}}

.mbody.bt p{font-size:12.5px;line-height:1.5}
.btopts{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.btopts label{min-width:150px}
.btchips{display:flex;gap:4px;flex-wrap:wrap;flex:1}.btchips button{height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-weight:700;font-size:12px;cursor:pointer}.btchips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btempty{padding:22px;text-align:center;color:var(--mut);font-size:12.5px;border:1px dashed var(--line);border-radius:10px}
.btwin{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);font-size:13px;margin-bottom:10px}.btwin .warn{color:var(--orange,#e0962c)}
.bthead{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:11.5px;color:var(--mut);font-weight:700}.btseg button{height:26px;font-size:11.5px}
.btscroll{overflow:auto;border:1px solid var(--line);border-radius:10px}
.bttbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bttbl th{position:sticky;top:0;background:var(--panel2);text-align:right;padding:7px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.bttbl td{text-align:right;padding:6px 9px;border-top:1px solid var(--line)}.bttbl th:first-child,.bttbl td:first-child,.bttbl th:nth-child(2),.bttbl td:nth-child(2){text-align:left}
.bttbl tbody tr{cursor:pointer}.bttbl tbody tr:hover td{background:var(--panel2)}.bttbl tr.best td{background:color-mix(in srgb,var(--acc) 10%,transparent)}.bttbl tr.sel td{outline:0;box-shadow:inset 0 0 0 9999px color-mix(in srgb,var(--blue,#2f7fd6) 10%,transparent)}
.bttbl .up{color:var(--buy)}.bttbl .dn{color:var(--sell)}
.trb{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:800;color:#fff;background:#7a4fd0}.trb.t2{background:#2f7fd6}
.btsub{margin:14px 0 6px;font-size:12.5px}
.modal.wide .mbox:has(.mbody.bt){width:min(920px,100%)}

.btmode{margin-bottom:2px;width:max-content}.btmode button{height:30px;font-size:12px}
.optgrid{display:grid;grid-template-columns:170px 1fr;gap:8px 12px;align-items:center}.optgrid>span{font-size:11.5px;font-weight:700;color:var(--mut)}
@media(max-width:640px){.optgrid{grid-template-columns:1fr}}
.optbar{height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;max-width:320px;overflow:hidden}.optbar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.btwin .ok{color:var(--buy);font-weight:700}.btwin .warn{color:var(--sell);font-weight:700}
.opttbl th.un,.opttbl td.un{background:color-mix(in srgb,var(--blue,#2f7fd6) 7%,transparent)}
.opttbl tbody tr{cursor:default}

.optcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}@media(max-width:640px){.optcards{grid-template-columns:1fr}}
.optcard{display:flex;flex-direction:column;gap:3px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-size:11.5px;color:var(--mut)}
.optcard small{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.optcard>b{font-size:22px;color:var(--text);letter-spacing:-.01em}.optcard>b em{font-style:normal;font-size:12px;font-weight:700;color:var(--mut);margin-left:6px}
.optcard .ok{color:var(--buy);font-weight:700}.optcard .warn{color:var(--sell);font-weight:700}.optcard .btn{margin-top:6px;align-self:flex-start}
.bthead{flex-wrap:wrap}.bthead .btseg{flex-wrap:wrap}

.trsys{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.trsys>div{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}.trsys>div.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--panel2))}
.trsys .nm{flex:1;min-width:0;text-align:left;background:none;border:0;padding:7px 9px;cursor:pointer;color:var(--text)}.trsys .nm b{display:block;font-size:12.5px}.trsys .nm small{display:block;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trsys .ib{background:none;border:0;cursor:pointer;padding:6px 8px;opacity:.6}.trsys .ib:hover{opacity:1}
.pop.trpop{width:320px;padding:8px}.pop.trpop .trsys{margin:4px 2px 6px}
#trPanel .trh .sysb{width:auto;padding:0 7px;font-size:10.5px;font-weight:800;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--acc)}#trPanel .trh{gap:3px}#trPanel .trh button{flex:none}

.optcards.three{grid-template-columns:repeat(3,1fr)}@media(max-width:820px){.optcards.three{grid-template-columns:1fr}}
.opttbl .wl{display:block;height:3px;border-radius:2px;background:var(--sell);margin-top:3px;overflow:hidden;min-width:44px}.opttbl .wl b{display:block;height:100%;background:var(--buy)}
.opttbl td.up,.optcard b.up{color:var(--buy)}.opttbl td.dn,.optcard b.dn{color:var(--sell)}

#trPanel .trbtns{display:flex;gap:5px;margin-top:7px}#trPanel .trbtns .btn{margin-top:0}#trPanel .trbtns .btn:first-child{flex:1;width:auto}#trPanel .trbtns .btn.ghost{width:auto}
#trPanel .btn.sell{background:var(--sell);border-color:var(--sell);color:#fff}#trPanel .btn.buy{background:var(--buy);border-color:var(--buy);color:#fff}
#trPanel .trdone{margin-top:6px;font-size:11px;font-weight:800;color:var(--acc)}
#trPanel .trh .lim{width:auto;padding:0 7px;font-size:10.5px;font-weight:800;color:#fff;border:0}#trPanel .trh .lim.st{background:var(--sell)}#trPanel .trh .lim.bt{background:var(--buy)}

#trPanel .trauto{display:flex;flex-direction:column;gap:2px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 90%,transparent);font-size:11px;color:var(--mut)}
#trPanel .trauto b{color:var(--text);font-size:11.5px;letter-spacing:.04em}#trPanel .trauto.run{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}#trPanel .trauto.run b{color:var(--acc)}#trPanel .trauto.wait{box-shadow:inset 3px 0 0 var(--orange,#e0962c)}
#trPanel .trauto .btn{margin-top:5px}
#trPanel .trh .autob{width:auto;padding:0 6px;font-size:10.5px;font-weight:800}#trPanel .trh .autob.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.talog{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;font-size:11.5px}.talog div{padding:5px 8px;border-top:1px solid var(--line)}.talog div:first-child{border:0}.talog small{color:var(--mut);margin-right:6px}.talog .err{color:var(--sell)}.talog .placed{color:var(--text)}.talog .filled{color:var(--buy)}

#trPanel .tatfs{display:flex;gap:3px;flex-wrap:wrap;margin:3px 0}#trPanel .tatfs i{font-style:normal;font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;border:1px solid var(--line2);color:var(--mut)}#trPanel .tatfs i.ok{border-color:var(--acc);color:var(--acc)}

/* TR panel on the light theme: crisp white cards, soft shadow, same layout */
[data-theme="light"] #trPanel .trc,[data-theme="light"] #trPanel .trh,[data-theme="light"] #trPanel .trauto{background:rgba(255,255,255,.94);border-color:rgba(20,40,35,.12);box-shadow:0 8px 24px -14px rgba(20,40,35,.35)}
[data-theme="light"] #trPanel .trc.go.s{background:color-mix(in srgb,var(--sell) 9%,#fff)}[data-theme="light"] #trPanel .trc.go.b{background:color-mix(in srgb,var(--buy) 9%,#fff)}
[data-theme="light"] #trPanel .trh button{background:#fff;border-color:rgba(20,40,35,.14)}
[data-theme="light"] #trPanel li i{border-color:rgba(20,40,35,.25)}
</style>

/* =====================================================================
   2. INDICATORS (pure functions on the candle array)
   ===================================================================== */
function ema(c, n) { const k = 2 / (n + 1); let e; return c.map((b, i) => { e = i ? b.close * k + e * (1 - k) : b.close; return i >= n - 1 ? { time: b.time, value: e } : { time: b.time } }) }
function sma(c, n) { let s = 0; return c.map((b, i) => { s += b.close; if (i >= n) s -= c[i - n].close; return i >= n - 1 ? { time: b.time, value: s / n } : { time: b.time } }) }
function boll(c, n, k) {
  const up = [], md = [], lo = [];
  c.forEach((b, i) => {
    if (i < n - 1) { up.push({ time: b.time }); md.push({ time: b.time }); lo.push({ time: b.time }); return }
    let s = 0, q = 0; for (let j = i - n + 1; j <= i; j++) { s += c[j].close; q += c[j].close ** 2 }
    const m = s / n, sd = Math.sqrt(Math.max(0, q / n - m * m));
    up.push({ time: b.time, value: m + k * sd }); md.push({ time: b.time, value: m }); lo.push({ time: b.time, value: m - k * sd });
  });
  return [up, md, lo];
}
function rsi(c, n) {
  let g = 0, l = 0;
  return c.map((b, i) => {
    if (!i) return { time: b.time };
    const d = b.close - c[i - 1].close;
    if (i <= n) { g += Math.max(d, 0) / n; l += Math.max(-d, 0) / n } else { g = (g * (n - 1) + Math.max(d, 0)) / n; l = (l * (n - 1) + Math.max(-d, 0)) / n }
    return i >= n ? { time: b.time, value: l ? 100 - 100 / (1 + g / l) : 100 } : { time: b.time };
  });
}
function atr(c, n = 14) {
  if (c.length < n + 1) return 0; let a = 0;
  for (let i = Math.max(1, c.length - 300); i < c.length; i++) { const tr = Math.max(c[i].high - c[i].low, Math.abs(c[i].high - c[i - 1].close), Math.abs(c[i].low - c[i - 1].close)); a = a ? (a * (n - 1) + tr) / n : tr }
  return a;
}
/* ---------- TR backtest: the same rules on every timeframe, TR1 vs TR2, scored in R ----------
   A trade = a valid retest. Result at a target of xR: +x if price reached x R before the stop, −1 if the stop came first,
   still open = not counted. Careful by design: on the entry candle only the stop counts; a candle touching stop AND target = loss.
   No spread / commission included (subtract roughly your spread ÷ stop distance per trade). */
const BT = { tfs: store.get('btTfs', ['M1', 'M5', 'M15', 'M30', 'H1', 'H4']), count: store.get('btCount', 5000), target: store.get('btTarget', 'best'), rows: [], busy: false, sel: '' };
const BT_TARGETS = [1, 1.5, 2, 3];
function btStats(tr, t) {
  let net = 0, w = 0, l = 0, gp = 0, open = 0, eq = 0, peak = 0, dd = 0, st = 0, maxSt = 0;
  for (const s of tr) {
    let r; if (s.maxR >= t) r = t; else if (s.out === 'sl') r = -1; else { open++; continue }
    net += r; eq += r; peak = Math.max(peak, eq); dd = Math.max(dd, peak - eq);
    if (r > 0) { w++; gp += r; st = 0 } else { l++; st++; maxSt = Math.max(maxSt, st) }
  }
  const n = w + l; return { t, n, w, l, open, won: gp, lost: l, win: n ? w / n * 100 : 0, net, avg: n ? net / n : 0, pf: l ? gp / l : gp ? 99 : 0, dd, streak: maxSt };
}
const btBest = tr => BT_TARGETS.map(t => btStats(tr, t)).reduce((a, b) => b.net > a.net ? b : a);
const btPick = r => BT.target === 'best' ? btBest(r.trades) : btStats(r.trades, +BT.target);

    <div class="btopts"><div class="btchips">${tfs.map(t => `<button class="${BT.tfs.includes(t) ? 'on' : ''}" onclick="btTf('${t}',this)">${t}</button>`).join('')}</div>

}
/* ---------- settings optimizer: try many TR settings × take-profit targets × timeframes at once ----------

const OPT = Object.assign({ risk: 1, minBars: [3, 4, 5, 6, 8], range: [1, 1.3, 1.6, 2, 2.5], buf: [0, .1, .25], away: [true, false], tp: [1, 1.5, 2, 3], tr: ['1', '2', '12'], minTrades: 20, rank: 'net' }, store.get('optCfg', {}));

const saveOPT = () => { const { res, busy, ...k } = OPT; store.set('optCfg', k) };

const OPT_LBL = { minBars: v => v, range: v => v + '×', buf: v => v + '×', away: v => v ? 'Yes' : 'No', tp: v => v + 'R', tr: v => ({ 1: 'TR1', 2: 'TR2', 12: 'TR1+2' })[v] };

function optChip(k, v, b) { const a = OPT[k], i = a.findIndex(x => String(x) === String(v)); if (i >= 0) { if (a.length > 1) a.splice(i, 1) } else a.push(v); a.sort((x, y) => (+x) - (+y)); saveOPT(); b.parentElement.outerHTML = optRow(k) }

const optCount = () => OPT.minBars.length * OPT.range.length * OPT.buf.length * OPT.away.length;

    </div>
    <div class="btopts"><label>Candles per timeframe<select onchange="BT.count=+this.value;store.set('btCount',BT.count)">${[2000, 5000, 10000, 20000].map(v => `<option ${v === BT.count ? 'selected' : ''} value="${v}">${v.toLocaleString()}</option>`).join('')}</select></label>
      <label>Risk per trade<select onchange="OPT.risk=+this.value;saveOPT();optRender()">${[.25, .5, 1, 2, 3].map(v => `<option value="${v}" ${v === OPT.risk ? 'selected' : ''}>${v}% of the account</option>`).join('')}</select></label>
      <label>Min. trades<select onchange="OPT.minTrades=+this.value;saveOPT();optRender()">${[10, 20, 30, 50].map(v => `<option ${v === OPT.minTrades ? 'selected' : ''}>${v}</option>`).join('')}</select></label>

  </div><div class="mact"><button class="btn ghost" data-m="no">Close</button></div>`, true);

async function optRun() {
  if (OPT.busy || !BT.tfs.length) return; OPT.busy = true; OPT.res = []; OPT.sym = S.symbol;
  const btn = $('#optRun'), out = $('#optOut'), order = Object.keys(TF_SEC), tfs = [...BT.tfs].sort((a, b) => order.indexOf(a) - order.indexOf(b));
  const total = tfs.length * optCount(); let done = 0, t0 = Date.now();
  const prog = tf => { if (out) out.innerHTML = `<div class="btempty"><span class="spin"></span>${tf}: ${done} of ${total} setting combinations tested…<div class="optbar"><i style="width:${(done / total * 100).toFixed(1)}%"></i></div></div>` };
  try {
    for (const tf of tfs) {
      prog(tf);
      let C; try { C = (await api(`/api/candles?${L()}&symbol=${enc(S.symbol)}&timeframe=${tf}&count=${BT.count}`)).candles || [] } catch { done += optCount(); continue }
      if (C.length < 200) { done += optCount(); continue }
      const A = TR.atrA(C), split = C.length * .7, days = (C[C.length - 1].time - C[0].time) / 86400;
      for (const mb of OPT.minBars) for (const rg of OPT.range) for (const bf of OPT.buf) for (const aw of OPT.away) {
        const cfg = { ...TRC, minBars: mb, rangeAtr: rg, slBuf: bf, away: aw }, r = trScan(C, cfg, { closed: C.length - 1, A });
        const valid = r.setups.filter(s => s.state === 'valid');
        for (const trf of OPT.tr) {
          const tr = valid.filter(s => trf === '12' ? s.tr <= 2 : s.tr === +trf), train = tr.filter(s => s.trig < split), test = tr.filter(s => s.trig >= split);
          for (const t of OPT.tp) OPT.res.push({ tf, mb, rg, bf, aw, trf, t, a: btStats(train, t), b: btStats(test, t), all: btStats(tr, t), days });
        }
        if (++done % 12 === 0) { prog(tf); if (btn) btn.textContent = `Testing… ${Math.round(done / total * 100)}%`; await sleep(0) }
      }
    }
  } finally { OPT.busy = false; if (btn) btn.textContent = '▶ Test all combinations' }
  OPT.ms = Date.now() - t0; optRender();
}
function optRender() {
  const out = $('#optOut'); if (!out || !OPT.res.length) return;
  // win rate: ties broken by R per trade. 'winp' = only settings that also made money (a high win rate that loses money is useless)
  const score = { net: x => x.a.net, avg: x => x.a.avg, pf: x => x.a.net > 0 ? x.a.pf : -999 + x.a.net / 1e4, win: x => x.a.win + x.a.avg / 100, winp: x => x.a.net > 0 ? x.a.win + x.a.avg / 100 : -999 + x.a.net / 1e4, both: x => Math.min(x.a.avg, x.b.n >= 5 ? x.b.avg : -9) };
  const R = v => `<b class="${v > 0 ? 'up' : v < 0 ? 'dn' : ''}">${v > 0 ? '+' : ''}${v.toFixed(1)}R</b>`, r2 = v => `${v >= 0 ? '+' : ''}${v.toFixed(2)}`;
  const rows = OPT.res.filter(x => x.a.n >= OPT.minTrades).sort((x, y) => score[OPT.rank](y) - score[OPT.rank](x)).slice(0, 30);
  if (!rows.length) { out.innerHTML = `<div class="btempty">No combination had ${OPT.minTrades}+ trades in the first 70%. Load more candles, lower “Min. trades”, or try smaller timeframes.</div>`; return }
  const ok = OPT.res.filter(x => x.a.n >= OPT.minTrades), best = f => ok.reduce((p, x) => !p || f(x) > f(p) ? x : p, null);
  const topR = best(score.net), topW = best(score.winp) || best(score.win), topP = best(score.pf), pc = v => `${v >= 0 ? '+' : '−'}${Math.abs(v * OPT.risk).toFixed(0)}%`;
  const card = (x, icon, title, main) => { if (!x) return ''; const held = x.b.n ? x.b.avg > 0 : null; return `<div class="optcard"><small>${icon} ${title}</small><b>${main}</b>
      <span>${x.tf} · ${OPT_LBL.tr(x.trf)} · TP ${x.t}R · ${x.mb} candles · range ${x.rg}× · stop buf. ${x.bf}× · ${x.aw ? 'leave first' : 'no leave rule'}</span>
      <span>${x.a.n} trades · win ${x.a.win.toFixed(0)}% · won <b class="up">+${x.a.won.toFixed(1)}R</b> · lost <b class="dn">−${x.a.lost}R</b> · ${r2(x.a.avg)}R per trade</span>
      <span>At ${OPT.risk}% risk per trade: <b class="${x.a.net >= 0 ? 'up' : 'dn'}">${pc(x.a.net)}</b> on the account · worst drawdown −${(x.a.dd * OPT.risk).toFixed(0)}%</span>
      <span class="${held ? 'ok' : 'warn'}">${held === null ? 'No unseen trades to check' : held ? `✓ Unseen: win ${x.b.win.toFixed(0)}% · ${R(x.b.net)}` : `✗ Unseen: win ${x.b.win.toFixed(0)}% · ${R(x.b.net)} (may be luck)`}</span>
      <div style="display:flex;gap:6px"><button class="btn sm acc" onclick="optApply(${OPT.res.indexOf(x)})">Use these settings</button><button class="btn sm" onclick="optSave(${OPT.res.indexOf(x)})">☆ Save as…</button></div></div>` };
  const seg = [['net', '💰 Biggest profit'], ['avg', 'R per trade'], ['winp', '🎯 Win rate (profitable)'], ['win', 'Win rate (any)'], ['pf', '⚖️ Won vs lost'], ['both', 'Good on both parts']];
  out.innerHTML = `<div class="optcards three">${card(topR, '💰', 'Biggest profit', R(topR.a.net) + ` <em>${pc(topR.a.net)} at ${OPT.risk}% risk</em>`)}${card(topW, '🎯', 'Highest win rate (profitable)', `${topW?.a.win.toFixed(0)}% <em>${topW ? R(topW.a.net) : ''}</em>`)}${card(topP, '⚖️', 'Best won vs lost', `${topP?.a.pf.toFixed(2)} <em>${topP ? `+${topP.a.won.toFixed(0)}R won / −${topP.a.lost}R lost` : ''}</em>`)}</div>

    <div class="btscroll" style="max-height:420px"><table class="bttbl opttbl"><thead><tr><th>#</th><th>TF</th><th>Signals</th><th>Candles</th><th>Range</th><th>Stop buf.</th><th>Leave</th><th>TP</th><th>Trades</th><th>Win %</th><th>Won</th><th>Lost</th><th>Net</th><th>Per trade</th><th>Won/lost</th><th>Max DD</th><th>Account @${OPT.risk}%</th><th class="un">Unseen trades</th><th class="un">Unseen win %</th><th class="un">Unseen total</th><th class="un">Per trade</th><th></th></tr></thead><tbody>

        <td class="un">${x.b.n}</td><td class="un">${x.b.n ? x.b.win.toFixed(0) + '%' : '—'}</td><td class="un">${x.b.n ? R(x.b.net) : '—'}</td><td class="un">${x.b.n ? `${r2(x.b.avg)} ${x.b.avg > 0 ? '<span class="up">✓</span>' : '<span class="dn">✗</span>'}` : '—'}</td>
        <td style="white-space:nowrap"><button class="btn sm" onclick="optApply(${OPT.res.indexOf(x)})">Use</button> <button class="btn sm ghost" onclick="optSave(${OPT.res.indexOf(x)})" title="Save as a named system">☆</button></td></tr>`).join('')}
    </tbody></table></div>
    <p class="mut" style="font-size:11px">Top 30 with at least ${OPT.minTrades} trades in the first 70%. Same scoring as the timeframe backtest (stop first on doubtful candles, no spread). The more combinations you test, the more likely the #1 is luck: trust rows that are ✓ on unseen data and look similar to their neighbours.</p>`;
}

function t2l(t) {
  const C = S.candles, n = C.length; if (!n) return 0;

  const ts = Chart.c.timeScale(), l = ts.coordinateToLogical(x), p = Chart.s.coordinateToPrice(y);

  if (!snap || l == null) return out;
  const i0 = Math.round(l), C = S.candles; let best = null, bd = snap === 2 ? Infinity : 16;
  for (let i = i0 - 1; i <= i0 + 1; i++) { // the candle under the mouse and one either side
    const b = C[i]; if (!b) continue;
    const bx = ts.logicalToCoordinate(i);

      if (d < bd) { bd = d; best = { t: b.time, p: v } }
    }

  if (best) return best;
  if (C[i0]) out.t = C[i0].time;
  return out;
}

const roundLot = (v, floor) => { const st = S.volStep || .01, x = (floor ? Math.floor(v / st + 1e-9) : Math.round(v / st)) * st; return +clamp(x, S.volMin, S.volMax).toFixed(decs(st)) };

function setRR(n) {

/* =====================================================================
   8. RISK GUARD + AUTOMATION (trailing stop, breakeven at R, partial close at R)
   ===================================================================== */
const Guard = {
  key: login => login + '|' + new Date().toISOString().slice(0, 10),
  // move today's starting balance by a deposit (+) / withdrawal (−), or forget it ('reset': new, reset or deleted account),
  // so cash moves never count as profit or loss and never trigger the daily loss lock
  rebase(login, delta) {
    const all = store.get('days', {}), k = this.key(login);
    if (delta === 'reset') delete all[k]; else if (all[k] != null) all[k] += delta;
    if (this.demoStart) delete this.demoStart[login];
    store.set('days', all);
  },
  day() {
    // only numbers that belong to THIS account: right after switching, S.account still holds the previous account until the first answer
    if (!S.account || S.accLogin !== S.login) return null;
    if (!store.get('daysFix1') && S.accounts.length) { // one-time repair of starting balances that were saved from the wrong account
      const all = store.get('days', {}), paper = new Set(S.accounts.filter(a => a.paper).map(a => String(a.login)));
      Object.keys(all).forEach(k => { if (paper.has(k.split('|')[0])) delete all[k] }); store.set('days', all); store.set('daysFix1', 1);
    }
    if (CFG.demo) { const st = (this.demoStart ||= {})[S.login] ||= S.account.balance; return { start: st, pnl: S.account.equity - st, pct: (S.account.equity - st) / st * 100 } } // the demo resets every page load
    const key = this.key(S.login), all = store.get('days', {});
    if (!all[key]) { all[key] = S.account.balance; store.set('days', Object.fromEntries(Object.entries(all).slice(-60))) }
    const start = all[key]; return { start, pnl: S.account.equity - start, pct: (S.account.equity - start) / start * 100 };
  },
  reason() {
    const d = this.day();
    if (d && CFG.maxDailyLoss && d.pct <= -CFG.maxDailyLoss) return `Daily loss limit reached (${d.pct.toFixed(2)}% / −${CFG.maxDailyLoss}%). New trades are locked until tomorrow. Closing is still allowed.`;
    if (CFG.maxPositions && S.allPositions.length >= CFG.maxPositions) return `Max open positions reached (${CFG.maxPositions}). Change it in Settings.`;
    return '';
  },
};
let autoBusy = false; const lastAuto = {};
const saveAS = () => store.set('autoState', AS);
async function autoRun() {
  const cfg = AUTO[S.symbol]; if (autoBusy || !S.bid || !cfg) return; autoBusy = true;
  try {
    for (const p of S.positions) {
      const buy = p.type === 'BUY', px = buy ? S.bid : S.ask, mv = (px - p.price_open) * (buy ? 1 : -1), t = p.ticket;
      if (p.sl && !AS.risk[t]) { AS.risk[t] = Math.abs(p.price_open - p.sl); saveAS() }
      const rk = AS.risk[t]; if (Date.now() - (lastAuto[t] || 0) < 2500) continue;
      if (cfg.partR && cfg.partPct && rk && !AS.done[t] && mv >= cfg.partR * rk) {
        AS.done[t] = 1; saveAS(); lastAuto[t] = Date.now();
        try { await api('/api/close', { login: S.login, ticket: t, percent: cfg.partPct }); toast(`⚙ Auto: closed ${cfg.partPct}% of #${t} at ${cfg.partR}R`, 'ok') } catch (e) { toast('Auto partial: ' + e.message, 'err') }
        continue;
      }
      if (cfg.beR && rk && mv >= cfg.beR * rk && (buy ? (p.sl || 0) < p.price_open : (!p.sl || p.sl > p.price_open))) {
        lastAuto[t] = Date.now();
        try { await api('/api/modify', { login: S.login, ticket: t, sl: p.price_open, tp: p.tp }); toast(`⚙ Auto: #${t} stop to breakeven at ${cfg.beR}R`, 'ok') } catch (e) { toast('Auto BE: ' + e.message, 'err') }
        continue;
      }
      if (cfg.trail) {
        const d = cfg.trail * S.point, n = +(buy ? S.bid - d : S.ask + d).toFixed(S.digits);
        if (mv > d && (buy ? n > (p.sl || 0) + S.point : (!p.sl || n < p.sl - S.point))) { lastAuto[t] = Date.now(); try { await api('/api/modify', { login: S.login, ticket: t, sl: n, tp: p.tp }) } catch {} }
      }
    }
  } finally { autoBusy = false }
}
async function editAuto() {

  const v = await formBox(`Automation for ${S.symbol}`, [
    { id: 'trail', label: 'Trailing stop distance in points (0 = off)', value: c.trail || '' },
    { id: 'beR', label: 'Move stop to breakeven at … R (0 = off)', value: c.beR || '' },
    { id: 'partR', label: 'Partial close at … R (0 = off)', value: c.partR || '' },

function setConn(state, text) {

/* ---------- BASKET: one exit price where ALL positions together make your target (0 = break-even) ---------- */
function bkCalc(target, strict) {
  const P = S.positions; if (!P.length) return { err: `No open positions on ${S.symbol}.` };

  const sg = p => p.type === 'BUY' ? 1 : -1, pu = perUnit(), net = sum(P, p => sg(p) * p.volume);
  if (Math.abs(net) < 1e-9) return { err: 'Your buys and sells cancel each other out (fully hedged), so no single price changes the result.' };
  const L = +((target / pu + sum(P, p => sg(p) * p.volume * p.price_open)) / net).toFixed(S.digits);
  if (!(L > 0)) return { err: 'That target works out to a price below zero. Try a smaller profit.' };

    return { p, field, pl, want, ref, set: !!field && (!strict || !want || field === want) };
  });

}

document.addEventListener('keydown', e => {
  const k = e.key, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName), modal = modalOpen();
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'k') { e.preventDefault(); Palette.on ? Palette.close() : Palette.open(); return }

  if (modal) { if (k === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); ($('#modal [data-m=yes]') || $('#modal [data-act=saveSettings]') || $('#modal [data-dsave]') || $('#modal [data-isave]') || $('#modal [data-act=createPaper]') || $('#modal [data-act=addMt5]'))?.click() } return }
  if (typing || Palette.on || e.altKey) return;
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z') { e.preventDefault(); return Drawings.undo() }
  if (e.ctrlKey || e.metaKey) return;
  if ((k === 'Delete' || k === 'Backspace') && D.sel) { e.preventDefault(); return Drawings.remove() }
  if (e.shiftKey && k === 'B') return placeOrder('buy');
  if (e.shiftKey && k === 'S') return placeOrder('sell');

  const lk = k.toLowerCase(), tool = Object.entries(DT).find(([, v]) => v.key === lk);
  if (tool) return Drawings.setTool(tool[0]);
  if (k === '0') return Chart.fit();
  if (k === '?') return showHelp();
  if (k === '/') { e.preventDefault(); return Palette.open() }
  if (k === '[') return fold('cw');
  if (k === ']') return fold('ct');
  if (lk === 'a') return addAlert(+(S.cross ?? S.bid).toFixed(S.digits));
  if (lk === 'p') { indOn.pdhl = !indOn.pdhl; store.set('ind2', indOn); Levels.sync(); return toast('Previous day high / low ' + (indOn.pdhl ? 'on' : 'off')) }
  if (/^[1-9]$/.test(k)) { const l = [...tfFav].sort((a, b) => TF_SEC[a] - TF_SEC[b]); if (l[+k - 1]) setTF(l[+k - 1]) }
});
(() => { // resizable + foldable dock: drag the grip, tap it, or press ▾ (phones snap to folded / ⅓ / ⅔)
  const g = $('#dockGrip'), dock = $('.dock'), cen = $('.center'), R = document.documentElement.style;
  const mob = () => innerWidth <= 860, key = () => mob() ? 'dockHm' : 'dockH';
  const minH = () => $('.tabs').offsetHeight + (mob() ? 16 : 0) + 1, maxH = () => innerHeight * (mob() ? .78 : .7);
  const set = h => R.setProperty('--dockH', clamp(h, minH(), maxH()) + 'px');
  const isMin = () => dock.classList.contains('min');
  const fold = on => {
    dock.classList.toggle('min', on); store.set('dockMin', on);
    $('#dockFold').textContent = on ? '▴' : '▾'; $('#dockFold').title = on ? 'Show the panel' : 'Hide the panel';
    if (on) set(minH()); else { fitTools(); const h = store.get(key(), 0); h ? set(Math.max(h, minH() + 20)) : R.removeProperty('--dockH'); tabSig = ''; renderTab(true) }
  };
  window.dockFold = fold; window.dockMin = isMin;
  { const h = store.get(key(), 0); if (h) set(h) }
  if (store.get('dockMin', false)) fold(true);
  let y0 = 0, h0 = 0, moved = false;
  g.addEventListener('pointerdown', e => { y0 = e.clientY; h0 = dock.offsetHeight; moved = false; g.setPointerCapture(e.pointerId); dock.classList.add('drag') });
  g.addEventListener('pointermove', e => {
    if (!g.hasPointerCapture(e.pointerId)) return;
    if (!moved && Math.abs(e.clientY - y0) < 5) return;
    if (!moved) { moved = true; cen.classList.add('dragging'); if (isMin()) { dock.classList.remove('min'); fitTools() } }
    set(h0 + y0 - e.clientY);
  });
  const end = () => {
    dock.classList.remove('drag'); cen.classList.remove('dragging');
    if (!moved) return fold(!isMin()); // a tap folds / unfolds
    let h = dock.offsetHeight;
    // "one line": the tab bar + the summary strip (Floating P/L, Open, Free margin…) shows exactly, never half a row
    const line1 = minH() + ($('#tabBody .dsum')?.offsetHeight || 48);
    if (mob()) { const sn = [minH(), line1, innerHeight * .34, innerHeight * .62]; h = sn.reduce((a, b) => Math.abs(b - h) < Math.abs(a - h) ? b : a) }
    else if (Math.abs(h - line1) < 28) h = line1; // magnet: let go near the summary line = exactly that line
    // only a drag right down to the tab bar folds; anything else stays where you let go
    if (h < minH() + 20) { if (h0 >= minH() + 20) store.set(key(), Math.round(h0)); return fold(true) }
    store.set(key(), Math.round(h)); set(h); fold(false);
  };
  g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
  addEventListener('resize', () => { if (isMin()) set(minH()) });
})();
