<style>
html,body{overflow:auto;height:auto}
body{background:var(--bg);min-height:100vh}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.grow{flex:1}

/* test-mode ribbon */
#ribbon{display:none;background:repeating-linear-gradient(-45deg,#fff4dc,#fff4dc 12px,#ffefcc 12px,#ffefcc 24px);color:#8a5a00;font-size:12px;font-weight:700;text-align:center;padding:6px 12px;border-bottom:1px solid #f1d9a6}
:root[data-theme=dark] #ribbon,:root[data-theme=midnight] #ribbon{background:#3b301a;color:#f0c46b;border-color:#5a4826}
#ribbon.on{display:block}

/* nav */
.nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:6px;height:62px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.02em;text-decoration:none;margin-right:14px;white-space:nowrap}
.brand svg{width:28px;height:28px}
.brand span{font-size:9.5px;font-weight:800;color:var(--acc);background:var(--accbg);padding:2px 6px;border-radius:5px;letter-spacing:.08em}
.nl{height:34px;padding:0 12px;border-radius:9px;display:inline-flex;align-items:center;font-weight:700;font-size:13px;color:var(--mut);text-decoration:none;white-space:nowrap}
.nl:hover,.nl.on{color:var(--text);background:var(--hover)}
.btn.lg{height:44px;padding:0 20px;font-size:14px;border-radius:12px}
.btn.md{height:36px;padding:0 15px;font-size:13px;border-radius:10px}
#acctBtn{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:12.5px}
#acctBtn i{width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acctx);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}
.burger{display:none}
.only-sm{display:none!important}@media (max-width:860px){#links.open .only-sm{display:flex!important}}

/* landing */
.hero{padding:64px 0 28px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:-40% -10% auto;height:620px;background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,#f5b73b 22%,transparent),transparent 60%),radial-gradient(ellipse at 20% 60%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 55%);pointer-events:none;z-index:-1}
.pill{display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 8px;min-height:30px;padding:5px 14px;max-width:100%;line-height:1.35;text-align:center;border-radius:30px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;color:var(--mut)}
.pill b{color:var(--acc);white-space:nowrap}
@media (max-width:560px){.hero .pill{border-radius:14px;padding:7px 14px;font-size:11.5px}.hero .pill b{flex-basis:100%}}
.hero h1{font-size:clamp(34px,5.6vw,62px);line-height:1.04;letter-spacing:-.035em;font-weight:850;margin:18px auto 16px;max-width:880px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#e0960c,#f5b73b 40%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{font-size:clamp(15px,1.8vw,18px);color:var(--mut);max-width:640px;margin:0 auto 26px;line-height:1.55}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.trust{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:18px;font-size:12.5px;color:var(--mut);font-weight:600}
.trust span::before{content:'✓ ';color:var(--acc);font-weight:800}
.shot{margin:42px auto 0;max-width:1120px;border-radius:16px;border:1px solid var(--line2);background:var(--panel);box-shadow:0 40px 90px -30px rgba(20,30,25,.35),var(--shadow);overflow:hidden;position:relative}
.shot .bar{height:34px;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.shot .bar i{width:10px;height:10px;border-radius:50%;background:var(--line2)}
.shot .bar i:nth-child(1){background:#ff6058}.shot .bar i:nth-child(2){background:#ffbd2e}.shot .bar i:nth-child(3){background:#28c941}
.shot .bar span{margin:0 auto;font-size:11.5px;color:var(--mut);font-weight:600;background:var(--panel);border:1px solid var(--line);padding:3px 40px;border-radius:7px}
.shot .vp{position:relative;overflow:hidden}
.shot iframe{position:absolute;left:0;top:0;width:1440px;height:880px;border:0;transform-origin:0 0;pointer-events:none}
.shot .live{position:absolute;right:14px;bottom:14px;z-index:2;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:6px 12px;font-size:11.5px;font-weight:800;box-shadow:var(--shadow)}
.shot .live::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fd08a;margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.shot .try{position:absolute;inset:34px 0 0;z-index:3;display:grid;place-items:center;background:rgba(0,0,0,0);transition:background .2s;cursor:pointer}
.shot .try b{opacity:0;transform:translateY(6px);transition:.2s;background:var(--acc);color:var(--acctx);padding:12px 20px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}
.shot .try:hover{background:rgba(10,14,12,.18)}.shot .try:hover b{opacity:1;transform:none}

section.blk{padding:80px 0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);text-align:center}
h2.tt{font-size:clamp(26px,3.6vw,40px);letter-spacing:-.03em;font-weight:850;text-align:center;margin:10px auto 12px;max-width:760px;line-height:1.1}
p.lead{color:var(--mut);text-align:center;max-width:640px;margin:0 auto 40px;font-size:15.5px;line-height:1.55}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.feat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;transition:transform .15s,border-color .15s}
.feat:hover{transform:translateY(-2px);border-color:var(--line2)}
.feat .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--accbg);margin-bottom:14px}
.feat h4{font-size:15.5px;margin-bottom:6px;letter-spacing:-.01em}
.feat p{color:var(--mut);font-size:13.5px;line-height:1.55}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;right:18px;top:14px;font-size:44px;font-weight:900;color:var(--line)}
.step h4{font-size:15.5px;margin:4px 0 6px}.step p{color:var(--mut);font-size:13.5px;line-height:1.55}
.sec{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px}
.sec h3{font-size:24px;letter-spacing:-.02em;margin-bottom:10px}
.sec ul{list-style:none;display:grid;gap:10px;margin-top:14px}
.sec li{font-size:14px;color:var(--text);display:flex;gap:10px}.sec li::before{content:'🔒'}
.flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:13px}
.flow div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:center;min-width:120px}
.flow div small{display:block;color:var(--mut);font-weight:600;font-size:11px;margin-top:3px}
.flow s{text-decoration:none;color:var(--mut)}

/* pricing */
.ivl{display:flex;justify-content:center;margin:-16px 0 26px}
.ivl .seg button{height:34px;padding:0 16px;font-size:13px}
.ivl em{font-style:normal;color:var(--acc);font-size:11px;margin-left:4px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;position:relative}
.plan.best{border:2px solid var(--acc);box-shadow:0 24px 60px -30px color-mix(in srgb,var(--acc) 60%,transparent)}
.plan .tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--acc);color:var(--acctx);font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;letter-spacing:.04em;white-space:nowrap}
.plan h4{font-size:17px}.plan .bl{color:var(--mut);font-size:13px;margin:6px 0 16px;min-height:38px;line-height:1.45}
.plan .pr{display:flex;align-items:baseline;gap:4px;margin-bottom:4px}.plan .pr b{font-size:40px;letter-spacing:-.04em;font-weight:850}.plan .pr span{color:var(--mut);font-weight:600}
.plan .eq{font-size:12px;color:var(--mut);min-height:18px;margin-bottom:16px}
.plan ul{list-style:none;display:grid;gap:9px;margin:18px 0 0;font-size:13.5px}
.plan li{display:flex;gap:9px}.plan li::before{content:'✓';color:var(--acc);font-weight:900}
.plan li.no{color:var(--dim)}.plan li.no::before{content:'–';color:var(--dim)}
.plan .btn{width:100%}
.plan.cur{outline:2px dashed var(--accline);outline-offset:4px}
.faq{max-width:780px;margin:0 auto;display:grid;gap:10px}
.faq details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.faq summary{cursor:pointer;font-weight:800;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:'+';color:var(--mut);font-size:18px;line-height:1}
.faq details[open] summary::after{content:'–'}
.faq p{color:var(--mut);font-size:13.5px;line-height:1.6;margin-top:10px}
.final{background:linear-gradient(135deg,#1b2a22,#10141c);color:#fff;border-radius:22px;padding:48px 30px;text-align:center}
.final h2{font-size:clamp(24px,3.4vw,36px);letter-spacing:-.03em;margin-bottom:10px}
.final p{color:#b8c2bd;margin-bottom:22px}
footer{border-top:1px solid var(--line);padding:30px 0 40px;color:var(--mut);font-size:12px;line-height:1.6}
footer .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
footer a{color:var(--mut);text-decoration:none;font-weight:600}footer a:hover{color:var(--text)}

/* app pages */
.page{padding:28px 0 60px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:26px;letter-spacing:-.03em}.ph p{color:var(--mut);font-size:13.5px;margin-top:4px}
.g{display:grid;gap:14px}.g2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.box h3{font-size:14.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.box h3 .grow+*{font-weight:600}
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:20px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.st.ok{background:var(--upbg);color:var(--up)}.st.warn{background:#fff1d6;color:#a86a00}.st.bad{background:var(--dnbg);color:var(--dn)}.st.mute{background:var(--panel2);color:var(--mut)}
:root[data-theme=dark] .st.warn,:root[data-theme=midnight] .st.warn{background:#4a3a1c;color:#f0c46b}
.subhero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.subhero .big{font-size:30px;font-weight:850;letter-spacing:-.03em}
.bar2{height:8px;border-radius:8px;background:var(--panel2);overflow:hidden;margin-top:10px}.bar2 i{display:block;height:100%;background:var(--acc);border-radius:8px}
.check{display:grid;gap:8px}
.ck{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.ck i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:12px;border:2px solid var(--line2);color:var(--mut);flex:none}
.ck.done i{background:var(--acc);border-color:var(--acc);color:var(--acctx)}
.ck b{font-size:13.5px}.ck small{display:block;color:var(--mut);font-size:12px;font-weight:500}
.ck .btn{margin-left:auto}
.key{display:flex;gap:6px;align-items:center}
.key code{flex:1;min-width:0;font:700 15px ui-monospace,Consolas,monospace;letter-spacing:.06em;background:var(--panel2);border:1px dashed var(--line2);border-radius:10px;padding:11px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist{display:grid;gap:6px;margin-top:10px}
.mrow{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:9px 10px;border:1px solid var(--line);border-radius:10px}
.mrow small{color:var(--mut)}
.lim{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:13px}.lim span{color:var(--mut)}.lim b{text-align:right}
.flist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.flist span{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.flist span.on{background:var(--accbg);color:var(--acc);border-color:transparent}
.wz{display:grid;gap:12px}
.wstep{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px}
.wstep .n{width:36px;height:36px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-weight:900;color:var(--mut)}
.wstep.done .n{background:var(--acc);color:var(--acctx);border-color:transparent}
.wstep h4{font-size:15px;margin-bottom:4px}.wstep p{color:var(--mut);font-size:13px;line-height:1.55}
pre.code{background:#121815;color:#d5e3db;border-radius:12px;padding:14px;font:12px/1.55 ui-monospace,Consolas,monospace;overflow:auto;margin-top:10px;position:relative}
pre.code .cp{position:absolute;right:8px;top:8px}
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.frm label{display:grid;gap:5px;font-size:11.5px;font-weight:700;color:var(--mut)}
input.in{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 12px;font-size:14px;color:var(--text);width:100%}
input.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.res{margin-top:12px;font-size:13px;border-radius:10px;padding:10px 12px;display:none}
.res.on{display:block}.res.ok{background:var(--upbg);color:var(--up)}.res.bad{background:var(--dnbg);color:var(--dn)}.res.warn{background:#fff1d6;color:#8a5a00}
.tbl2{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl2 th{text-align:left;color:var(--mut);font-weight:700;font-size:11px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl2 td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.empty{color:var(--mut);font-size:13px;padding:14px 0}
.kp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kp small{color:var(--mut);font-size:11.5px;font-weight:700}.kp b{display:block;font-size:24px;letter-spacing:-.03em;margin-top:4px;font-weight:850}

/* terminal page */
#termWrap{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:var(--bg)}
#termWrap.on{display:flex}
#termBar{height:38px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
#termBar a{text-decoration:none}
#termWrap iframe{flex:1;border:0;width:100%}
.paywall{max-width:520px;margin:60px auto;text-align:center}
.paywall .ic{font-size:44px}

/* auth */
.auth{width:min(420px,100%)}
.auth h3{font-size:22px;letter-spacing:-.02em;margin-bottom:4px}
.auth p{color:var(--mut);font-size:13px;margin-bottom:16px}
.auth label{display:grid;gap:5px;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:10px}
.auth .btn{width:100%;margin-top:6px}
.auth .sw{text-align:center;font-size:12.5px;color:var(--mut);margin-top:14px}.auth .sw a{color:var(--acc);font-weight:800;cursor:pointer}
.auth .err{color:var(--dn);font-size:12.5px;font-weight:700;min-height:18px;margin-top:6px}
.menu{position:absolute;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:60;display:none}
.menu.on{display:block}
.menu button,.menu a{display:flex;width:100%;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;text-align:left}
.menu button:hover,.menu a:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.menu .who{padding:8px 10px;font-size:12px;color:var(--mut)}
.menu .seg{margin:4px 6px}

.wstep ol.sub{margin:8px 0 0 18px;display:grid;gap:7px;font-size:13.5px;line-height:1.55;color:var(--text)}
.wstep ol.sub li::marker{color:var(--acc);font-weight:800}
.wstep ol.sub small{color:var(--mut)}
.wstep code,.faq code{font:12px ui-monospace,Consolas,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.term{margin-top:12px;background:#0c1220;border-radius:10px;padding:26px 14px 12px;position:relative;overflow:auto}
.term i{position:absolute;top:9px;width:9px;height:9px;border-radius:50%;background:#ff6058}.term i:nth-child(1){left:12px}.term i:nth-child(2){left:26px;background:#ffbd2e}.term i:nth-child(3){left:40px;background:#28c941}
.term pre{color:#c9d4e3;font:11.5px/1.6 ui-monospace,Consolas,monospace;margin:0;white-space:pre}.term pre b{color:#4ade80}
.livechip{margin-top:12px;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:12.5px;font-weight:700;background:#fff1d6;color:#8a5a00}
.livechip.ok{background:var(--upbg);color:var(--up)}.livechip.bad{background:var(--dnbg);color:var(--dn)}
:root[data-theme=dark] .livechip:not(.ok):not(.bad),:root[data-theme=midnight] .livechip:not(.ok):not(.bad){background:#4a3a1c;color:#f0c46b}
.box.pre{margin-bottom:14px}.chk3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chk3 div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}.chk3 b{display:block;font-size:13px;margin-bottom:4px}.chk3 small{color:var(--mut);font-size:12px;line-height:1.5}

/* ===================== landing v3: premium sections ===================== */
/* hero: grid backdrop + floating stat cards */
.hero{isolation:isolate}

.hero .wrap{position:relative}
.floaters{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:14px;padding:10px 14px;box-shadow:0 18px 40px -12px rgba(15,30,22,.28);animation:float 6s ease-in-out infinite;text-align:left}

/* how it works: timeline */
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;position:relative;margin-top:10px}
.timeline::before{content:'';position:absolute;left:16%;right:16%;top:31px;height:2px;background:repeating-linear-gradient(90deg,var(--accline) 0 8px,transparent 8px 16px)}
.tl{position:relative;text-align:center;padding:0 10px}

.lp-sec+.lp-sec{border-top:1px solid #131924}

/* buttons */
.lp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:12px;font-weight:800;font-size:14.5px;text-decoration:none;border:1px solid transparent;cursor:pointer;text-align:center;line-height:1.2;transition:transform .15s,filter .15s,background .15s}
.lp-btn.lg{min-height:52px;padding:12px 26px;font-size:15.5px;border-radius:14px}
.lp-btn.full{width:100%}
.lp-btn.gold{background:linear-gradient(135deg,#f9c95a,#e0960c);color:#1a1203;box-shadow:0 14px 40px -14px rgba(245,183,59,.65)}
.lp-btn.gold:hover{filter:brightness(1.07);transform:translateY(-1px)}
.lp-btn.ghost{background:rgba(255,255,255,.04);border-color:#2b3445;color:#e8ecf3}
.lp-btn.ghost:hover{background:rgba(255,255,255,.08)}
.lp-btn:disabled{opacity:.55;cursor:default;transform:none}
.lp-cta{display:flex;gap:10px;flex-wrap:wrap}.lp-cta.c{justify-content:center;margin-top:34px}

/* announce */
.lp-ann{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 8px;padding:9px 16px;font-size:13px;color:#d9dee8;text-decoration:none;background:linear-gradient(90deg,#141008,#231a0b,#141008);border-bottom:1px solid #2c2210;text-align:center}
.lp-ann b{color:#f5c25b}.lp-ann u{color:#fff;font-weight:700;text-underline-offset:3px}
.lp-dot{width:8px;height:8px;border-radius:50%;background:#16c784;box-shadow:0 0 0 0 rgba(22,199,132,.6);animation:lpPulse 2s infinite}
@keyframes lpPulse{70%{box-shadow:0 0 0 8px rgba(22,199,132,0)}100%{box-shadow:0 0 0 0 rgba(22,199,132,0)}}

/* hero */
.lp-hero{padding:64px 0 70px;position:relative}
.lp-hero::before{content:'';position:absolute;inset:-30% -20% auto;height:900px;pointer-events:none;
  background:radial-gradient(600px 380px at 75% 30%,rgba(245,183,59,.16),transparent 70%),radial-gradient(500px 360px at 10% 10%,rgba(22,199,132,.08),transparent 70%)}
.lp-hero::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:linear-gradient(#141a24 1px,transparent 1px),linear-gradient(90deg,#141a24 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 70%)}
.lp-hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:48px;align-items:center;position:relative;z-index:1}
.lp-hero h1{font-size:clamp(38px,5.2vw,66px);line-height:1.02;font-weight:900;letter-spacing:-.04em}
.lp-hero h1 span{display:block;background:linear-gradient(90deg,#ffd982,#f5b73b 45%,#e0960c);-webkit-background-clip:text;background-clip:text;color:transparent}
.lp-sub{color:#aab3c3;font-size:clamp(15px,1.6vw,18px);line-height:1.6;margin:20px 0 28px;max-width:560px}
.lp-checks{list-style:none;display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:20px;font-size:13px;color:var(--mut);font-weight:600}
.lp-checks li::before{content:'✓';color:#16c784;font-weight:900;margin-right:6px}
.lp-hvis{position:relative}
.lp-frame{border-radius:16px;border:1px solid #273042;background:#0e121a;box-shadow:0 40px 100px -30px rgba(0,0,0,.8),0 0 0 1px rgba(245,183,59,.06);overflow:hidden;position:relative}
.lp-frame .bar{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;background:#121722;border-bottom:1px solid #1e2531;font-size:11px;color:var(--mut);font-weight:700}
.lp-frame .bar i{width:9px;height:9px;border-radius:50%;background:#2b3445}.lp-frame .bar span{margin-left:8px}
.lp-frame .vp{position:relative;overflow:hidden;height:340px}
.lp-frame iframe{position:absolute;left:0;top:0;width:1440px;height:880px;border:0;transform-origin:0 0;pointer-events:none}
.lp-open{position:absolute;right:12px;bottom:12px;z-index:2;padding:9px 14px;border-radius:10px;font-weight:800;font-size:12.5px;background:rgba(10,13,19,.85);color:#f5c25b;border:1px solid rgba(245,183,59,.4);backdrop-filter:blur(6px);cursor:pointer}
.lp-open:hover{background:#151a24}
.lp-chip{position:absolute;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(16,20,28,.92);border:1px solid #273042;box-shadow:0 20px 50px -20px rgba(0,0,0,.8);backdrop-filter:blur(8px);animation:lpFloat 6s ease-in-out infinite}
.lp-chip i{font-style:normal;font-size:18px}.lp-chip small{display:block;font-size:11px;color:var(--mut);font-weight:700}.lp-chip b{font-size:13px;white-space:nowrap}
.lp-chip.c1{left:-26px;bottom:-20px}.lp-chip.c2{right:-18px;top:-22px;animation-delay:-3s}
.lp-chip.c1 b{color:#f0454f}.lp-chip.c2 b{color:#16c784}
@keyframes lpFloat{50%{transform:translateY(-8px)}}

/* pain */
.lp-pains{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lp-painc{padding:24px;border-radius:18px;background:linear-gradient(180deg,#121722,#0e121a);border:1px solid #1e2531}
.lp-painc b{display:block;font-size:30px;font-weight:900;letter-spacing:-.03em;color:#f0454f}
.lp-painc small{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:4px 0 12px}
.lp-painc p{color:#aab3c3;line-height:1.55;font-size:14.5px}
.lp-punch{text-align:center;margin:30px auto 0;max-width:720px;font-size:clamp(15px,1.8vw,19px);color:#aab3c3;line-height:1.5}
.lp-punch b{color:#f3f5f9}

/* calculator */
.lp-calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0;border-radius:22px;overflow:hidden;border:1px solid #273042;background:#0e121a;box-shadow:0 40px 100px -40px rgba(245,183,59,.25)}
.lp-cin{padding:28px;display:grid;gap:16px;align-content:start;border-right:1px solid #1e2531}
.lp-f label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em}
.lp-g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.lp-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:#151a24;border:1px solid #1e2531}
.lp-seg button{height:36px;border-radius:9px;font-weight:800;font-size:13px;color:var(--mut);white-space:nowrap;padding:0 4px}
.lp-seg button.on{background:#f5b73b;color:#1a1203}
.lp-inp{display:flex;align-items:center;height:44px;border-radius:12px;background:#151a24;border:1px solid #1e2531;padding:0 12px;gap:6px}
.lp-inp:focus-within{border-color:#f5b73b}
.lp-inp input{flex:1;min-width:0;background:none;border:0;color:#f3f5f9;font-size:17px;font-weight:800;outline:none;font-variant-numeric:tabular-nums}
.lp-inp span{color:var(--mut);font-size:12.5px;font-weight:700;white-space:nowrap}
.lp-step{display:grid;grid-template-columns:44px 1fr 44px;height:44px;border-radius:12px;background:#151a24;border:1px solid #1e2531;overflow:hidden}
.lp-step button{font-size:18px;color:var(--mut);font-weight:800}.lp-step button:hover{color:#fff;background:#1c2230}
.lp-step b{display:grid;place-items:center;font-size:17px}
.lp-fine{font-size:11.5px;color:var(--dim);line-height:1.5}
.lp-cout{padding:28px;display:grid;gap:14px;align-content:start;background:radial-gradient(400px 260px at 100% 0%,rgba(245,183,59,.08),transparent 70%)}
.lp-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lp-kpis div{padding:14px;border-radius:14px;background:#151a24;border:1px solid #1e2531;min-width:0}
.lp-kpis small{display:block;font-size:11px;font-weight:800;color:var(--mut);line-height:1.3;min-height:28px}
.lp-kpis b{display:block;font-size:clamp(20px,2.4vw,28px);font-weight:900;letter-spacing:-.03em;margin:6px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lp-kpis b i{font-style:normal;font-size:.55em;color:var(--mut)}
.lp-kpis em{font-style:normal;font-size:11.5px;color:var(--mut)}
.lp-kpis .dn{color:#f0454f}
.lp-alert,.lp-fix{padding:16px 18px;border-radius:14px;line-height:1.55;font-size:14px;color:#c9d0dc}
.lp-alert{background:rgba(240,69,79,.08);border:1px solid rgba(240,69,79,.3)}
.lp-alert>b{color:#f0454f}.lp-fix>b{color:#16c784}
.lp-alert>b,.lp-fix>b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.lp-alert strong{color:#fff}.lp-alert .bad{color:#f0454f;font-weight:900}
.lp-fix{background:rgba(22,199,132,.07);border:1px solid rgba(22,199,132,.28)}
.lp-cempty{color:var(--mut);padding:30px 0;text-align:center}

/* versus */
.lp-vs{border-radius:20px;border:1px solid #1e2531;overflow:hidden;background:#0e121a}
.lp-vsh,.lp-vsr{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px 22px;align-items:center}
.lp-vsh{background:#121722;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.lp-vsh .g{color:#f5b73b}
.lp-vsr{border-top:1px solid #1a202b;font-size:14.5px}
.lp-vsr span{font-weight:700;color:#f3f5f9}
.lp-vsr em{font-style:normal;color:#8a94a8}
.lp-vsr strong{color:#f3f5f9;display:flex;gap:8px;align-items:baseline}
.lp i.y{font-style:normal;color:#16c784;font-weight:900}

/* a trading day */
.lp-day{display:grid;gap:22px;position:relative}
.lp-moment{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:44px;align-items:center;padding:26px;border-radius:24px;background:linear-gradient(180deg,#0f131b,#0c1017);border:1px solid #1a202b}
.lp-moment.rev{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}.lp-moment.rev .lp-mtxt{order:2}
.lp-time{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lp-time b{font-size:13px;font-weight:900;color:#1a1203;background:#f5b73b;padding:4px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.lp-time span{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.lp-mtxt h3{font-size:clamp(21px,2.4vw,28px);line-height:1.15;font-weight:850;margin-bottom:12px}
.lp-mtxt p{color:#aab3c3;line-height:1.65}
.lp-shot{border-radius:14px;overflow:hidden;border:1px solid #273042;cursor:zoom-in;background:#151a24;aspect-ratio:4/3}
.lp-shot img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.lp-shot.noimg{display:none}
.lp-lock{border-radius:14px;border:1px solid #273042;background:#10141c;padding:22px;display:grid;gap:14px}
.lp-lockh{display:flex;justify-content:space-between;font-weight:800}.lp-lockh .dn{color:#f0454f;font-size:22px}
.lp-gauge small{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:6px}
.lp-gauge div{height:10px;border-radius:6px;background:#1c2230;overflow:hidden}.lp-gauge i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f5b73b,#f0454f)}
.lp-lockmsg{padding:12px 14px;border-radius:10px;background:rgba(240,69,79,.1);border:1px solid rgba(240,69,79,.3);color:#ffc9cc;font-weight:700;font-size:13.5px;line-height:1.5}
.lp-lockbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lp-lockbtns span{height:46px;border-radius:10px;display:grid;place-items:center;font-weight:900;color:#5d6676;background:#151a24;border:1px dashed #2b3445}

/* fit */
.lp-fit{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lp-fitc{padding:28px;border-radius:20px;border:1px solid #1e2531;background:#0e121a}
.lp-fitc h3{font-size:20px;margin-bottom:14px}
.lp-fitc ul{list-style:none;display:grid;gap:11px;color:#c9d0dc;line-height:1.45}
.lp-fitc li{display:flex;gap:10px}
.lp-fitc.yes{border-color:rgba(22,199,132,.3)}.lp-fitc.yes li::before{content:'✓';color:#16c784;font-weight:900}
.lp-fitc.no li::before{content:'✕';color:#f0454f;font-weight:900}.lp-fitc.no li{color:#8a94a8}

/* trust */
.lp-trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lp-tc{padding:22px;border-radius:18px;border:1px solid #1e2531;background:#0e121a}
.lp-tc span{font-size:22px}.lp-tc h4{font-size:16px;margin:10px 0 6px}.lp-tc p{color:#8a94a8;font-size:14px;line-height:1.55}

/* pricing */
.lp .ivl{margin:-10px 0 30px}
.lp-plans{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.15fr) minmax(0,.9fr);gap:14px;align-items:center;padding-top:14px}
.lp-plan{position:relative;padding:26px;border-radius:20px;border:1px solid #1e2531;background:#0e121a;display:flex;flex-direction:column}
.lp-plan.best{padding:34px 28px;border:1.5px solid rgba(245,183,59,.6);background:radial-gradient(500px 240px at 50% 0%,rgba(245,183,59,.12),transparent 70%),#10141c;box-shadow:0 40px 90px -40px rgba(245,183,59,.45)}
.lp-tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:5px 14px;border-radius:20px;background:#f5b73b;color:#1a1203;font-size:11.5px;font-weight:900;letter-spacing:.04em}
.lp-plan h4{font-size:18px}.lp-who{color:var(--mut);font-size:13.5px;margin:6px 0 16px;line-height:1.45}
.lp-pr{display:flex;align-items:baseline;gap:5px}.lp-pr b{font-size:42px;font-weight:900;letter-spacing:-.04em}.lp-pr span{color:var(--mut);font-weight:700}
.lp-eq{font-size:12.5px;color:var(--mut);margin:4px 0 18px}
.lp-plan ul{list-style:none;display:grid;gap:9px;margin-top:20px;font-size:13.5px}
.lp-plan li{display:flex;gap:9px;color:#c9d0dc}.lp-plan li::before{content:'✓';color:#16c784;font-weight:900}
.lp-plan li.no{color:#4d5666}.lp-plan li.no::before{content:'–';color:#4d5666}
.lp-life{margin-top:20px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:22px;align-items:center;padding:22px 26px;border-radius:20px;border:1px solid #3a2e14;background:radial-gradient(500px 200px at 0% 0%,rgba(245,183,59,.18),transparent 60%),#120f09}
.lp-badge{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#f5c25b;background:rgba(245,183,59,.14);padding:4px 10px;border-radius:20px}
.lp-life h4{font-size:19px;margin:10px 0 4px}.lp-life p{color:#b9ad95;font-size:13.5px}
.lp-lifep{text-align:right}.lp-lifep b{display:block;font-size:34px;font-weight:900;letter-spacing:-.03em}.lp-lifep small{color:#b9ad95}
.lp-rr{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;margin-top:24px;font-size:13px;color:var(--mut);font-weight:600}

/* faq */
.lp-faq{max-width:800px;margin:0 auto;display:grid;gap:10px}
.lp-faq details{border:1px solid #1e2531;border-radius:16px;background:#0e121a;padding:18px 20px}
.lp-faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;font-weight:800;font-size:15px}
.lp-faq summary::-webkit-details-marker{display:none}
.lp-faq summary::after{content:'+';color:#f5b73b;font-size:20px;line-height:1}.lp-faq details[open] summary::after{content:'–'}
.lp-faq p{color:#aab3c3;line-height:1.65;margin-top:10px;font-size:14.5px}

/* final + footer */
.lp-final{text-align:center;padding:60px 28px;border-radius:28px;border:1px solid #3a2e14;background:radial-gradient(700px 300px at 50% 0%,rgba(245,183,59,.2),transparent 70%),#0f0d09}
.lp-final h2{font-size:clamp(26px,3.8vw,44px);line-height:1.1;font-weight:900}
.lp-final p{color:#b9ad95;margin-top:14px;line-height:1.6}
.lp-foot{border-top:1px solid #131924;padding:34px 0 90px;color:var(--mut);font-size:12.5px}
.lp-foot .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-bottom:16px}
.lp-foot a{text-decoration:none}.lp-foot a:hover{color:#fff}
.lp-foot p{line-height:1.6;margin-top:8px;max-width:900px}
.lp .stickycta{--panel:#10141c;--line2:#2b3445}
.lp .stickycta .btn.acc{background:linear-gradient(135deg,#f9c95a,#e0960c);color:#1a1203}

/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.lp-chip,.lp-dot{animation:none}}

/* responsive */
@media (max-width:980px){
  .lp-hgrid{grid-template-columns:1fr;gap:40px}
  .lp-htxt{text-align:center}.lp-sub{margin-left:auto;margin-right:auto}.lp-cta{justify-content:center}.lp-checks{justify-content:center}
  .lp-chip.c1{left:8px}.lp-chip.c2{right:8px}
  .lp-calc{grid-template-columns:1fr}.lp-cin{border-right:0;border-bottom:1px solid #1e2531}
  .lp-moment,.lp-moment.rev{grid-template-columns:1fr;gap:20px}.lp-moment.rev .lp-mtxt{order:0}
  .lp-plans{grid-template-columns:1fr;max-width:460px;margin:0 auto}.lp-plan.best{order:-1}
  .lp-trust{grid-template-columns:1fr 1fr}
  .lp-life{grid-template-columns:1fr;text-align:center}.lp-lifep{text-align:center}
}
@media (max-width:640px){
  .lp-sec{padding:54px 0}.lp-hero{padding:40px 0 56px}
  .lp-pains,.lp-trust,.lp-fit{grid-template-columns:1fr}
  .lp-kpis{grid-template-columns:1fr 1fr}.lp-kpis div:last-child{grid-column:1/-1}
  .lp-cin,.lp-cout{padding:20px}
  .lp-vsh{display:none}
  .lp-vsr{grid-template-columns:1fr;gap:6px;padding:16px 18px}
  .lp-vsr em::before{content:'MT5: ';font-weight:700;color:#5d6676}
  .lp-moment{padding:18px;border-radius:18px}
  .lp-chip{padding:8px 11px}.lp-chip b{font-size:12px}.lp-chip.c2{display:none}.lp-chip.c1{bottom:-26px}
  .lp-btn.lg{width:100%}
  .lp-final{padding:40px 20px}
}
/* ================= landing motion layer ================= */
/* scroll progress */
.lp-prog{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;background:linear-gradient(90deg,#16c784,#f5b73b,#ffd982);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 12px rgba(245,183,59,.7);pointer-events:none}
/* ticker tape */
.lp-tape{position:relative;overflow:hidden;height:38px;border-bottom:1px solid #151b26;background:#080a10;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.lp-tape-in{display:flex;width:max-content;height:100%;align-items:center;animation:lpTape 60s linear infinite}
.lp-tape:hover .lp-tape-in{animation-play-state:paused}
@keyframes lpTape{to{transform:translateX(-50%)}}
.lp-tape .tk{display:inline-flex;align-items:center;gap:8px;padding:0 22px;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;border-right:1px solid #151b26;border-radius:4px;transition:background .6s}
.lp-tape .tk b{color:#e8ecf3;font-weight:800;letter-spacing:.02em}.lp-tape .tk em{font-style:normal;color:#aab3c3;font-family:ui-monospace,'SF Mono',Consolas,monospace}
.lp-tape .tk i{font-style:normal;font-weight:800;font-size:11.5px}.lp-tape .tk i.up{color:#16c784}.lp-tape .tk i.dn{color:#f0454f}
.lp-tape .tk.fu{animation:lpFlashU .9s}.lp-tape .tk.fd{animation:lpFlashD .9s}
.lp-tape .tk.sim{color:#566074;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
@keyframes lpFlashU{0%{background:rgba(22,199,132,.22)}100%{background:transparent}}
@keyframes lpFlashD{0%{background:rgba(240,69,79,.22)}100%{background:transparent}}
/* hero canvas */
.lp-hcv{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.9;mask-image:linear-gradient(180deg,transparent,#000 25%,#000 70%,transparent);-webkit-mask-image:linear-gradient(180deg,transparent,#000 25%,#000 70%,transparent)}
.lp-hero h1 span{font-variant-ligatures:none}
@media (min-width:981px){.lp-hcv{mask-image:linear-gradient(90deg,rgba(0,0,0,.14),rgba(0,0,0,.14) 44%,#000 64%);-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.14),rgba(0,0,0,.14) 44%,#000 64%)}}
@media (max-width:980px){.lp-hcv{opacity:.38}}

// Find the license server by itself: your setting, then this site, then the test website inside your own bridge (port 8765),
// then the stand-alone test server (port 8800). The first one that answers wins.
async function findServer() {
  const here = location.protocol === 'file:' ? [] : [location.origin + location.pathname.replace(/\/[^/]*$/, ''), location.origin, location.origin + '/saas'];
  const list = [...new Set([SRV, store.get('saasServer', ''), ...here, 'http://127.0.0.1:8765/saas', 'http://127.0.0.1:8800'].filter(Boolean).map(s => s.replace(/\/+$/, '')))];
  for (const s of list) {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 2500);
      const r = await fetch(s + '/api/plans', { signal: ctl.signal }); clearTimeout(t);
      if (r.ok) { const j = await r.json(); if (j.plans) { SRV = s; store.set('saasServer', s); return j } }
    } catch {}
  }
  SRV = list[0] || location.origin; return null;
}
const SITE = location.protocol === 'file:' ? SRV : location.origin + location.pathname; // the bridge opens this page after it starts

async function srv(path, body, method) {
  const opt = { method: method || (body ? 'POST' : 'GET'), headers: {} };
  if (A.token) opt.headers.Authorization = 'Bearer ' + A.token;
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body) }
  let r; try { r = await fetch(SRV + path, opt) } catch { throw new Error('Cannot reach the Goldmine server. Check your internet connection.') }
  let j = null; try { j = await r.json() } catch {}
  if (r.status === 401 && A.token && !/auth\//.test(path)) { logout(true); throw new Error('Your session expired. Please log in again.') }
  if (!r.ok) { const d = j?.detail; throw new Error(typeof d === 'string' ? d : Array.isArray(d) ? d.map(x => (x.loc?.slice(-1)[0] || '') + ': ' + x.msg).join(', ') : 'Server error ' + r.status) }
  return j;
}
async function bridge(path, body) { // direct call to the customer's bridge (never demo mode)
  const opt = { headers: { 'X-Gomez-Key': CFG.key || '' } };
  if (body) { opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body) }
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000); opt.signal = ctl.signal;
  let r; try { r = await fetch(CFG.base.replace(/\/+$/, '') + path, opt) } catch { throw new Error(`No answer from ${CFG.base}. Is start_bridge.bat running on that PC, and is the address right?`) } finally { clearTimeout(t) }
  let j = null; try { j = await r.json() } catch {}
  if (r.status === 401) throw new Error('The bridge key is wrong. Use the api_key from config.json on your bridge PC.');
  if (r.status === 404 && path.startsWith('/api/license')) throw new Error('This bridge is an older version without licensing. Download the bridge again from step 1.');
  if (!r.ok) throw new Error(j?.detail || 'Bridge error ' + r.status);
  return j;
}

/* the challenge calculator */
function lpCalc() {
  const out = $('#cOut'); if (!out) return;
  const num_ = id => { const v = parseFloat(String($('#' + id).value).replace(',', '.')); return isFinite(v) && v > 0 ? v : 0 };
  const xau = LPC.mkt === 'xau', dl = num_('cDL'), r = num_('cRisk'), stop = num_('cStop'), n = LPC.n, bal = LPC.bal;
  $('#cStopU').textContent = xau ? '$ move' : 'pips';
  if (!dl || !r || !stop) { out.innerHTML = `<div class="lp-cempty">Fill in the daily loss limit, the risk per trade and the stop distance.</div>`; return }
  const unit = xau ? 100 : 10, risk = bal * r / 100, dlUsd = bal * dl / 100;
  const per = Math.max(0.01, Math.floor(risk / (stop * unit) / n * 100) / 100), real = per * n * stop * unit;
  const streak = Math.floor(dl / r + 1e-9);
  const typo = (per * 10 + per * (n - 1)) * stop * unit, times = typo / dlUsd;
  const f2 = v => v.toFixed(2);
  out.innerHTML = `
    <div class="lp-kpis">
      <div><small>Risk per trade</small><b data-cnt="${risk}" data-fmt="m" data-key="risk">${lpMoney(risk)}</b><em>${r}% of ${lpMoney(bal)}</em></div>
      <div><small>Lots per entry</small><b>${f2(per)}<i> × ${n}</i></b><em>${f2(per * n)} lots in total</em></div>
      <div><small>Losses in a row before the limit</small><b class="${streak <= 2 ? 'dn' : ''}" data-cnt="${streak}" data-fmt="i" data-key="streak">${streak || '0'}</b><em>daily limit ${lpMoney(dlUsd)}</em></div>
    </div>
    <div class="lp-alert"><b>One wrong digit</b><p>Type <span class="bad">${f2(per * 10)}</span> instead of ${f2(per)} on one entry and this trade risks <strong>${lpMoney(typo)}</strong> (${(typo / bal * 100).toFixed(1)}% of the account).
      ${times >= 1 ? `That is <strong>${times.toFixed(1)}×</strong> your whole daily limit, in one click.` : `That is <strong>${Math.round(times * 100)}%</strong> of your daily limit, in one click.`}</p></div>

/* 1 · ticker tape (simulated quotes) */
const LP_SYMS = [['XAUUSD', 2418.4, 2], ['EURUSD', 1.0842, 5], ['GBPUSD', 1.2714, 5], ['US100', 18452, 1], ['USDJPY', 151.38, 3], ['BTCUSD', 67210, 1], ['US30', 39120, 1], ['XAGUSD', 28.41, 3], ['GER40', 18210, 1], ['AUDUSD', 0.6612, 5]];
function lpTape() {
  const el = $('#lpTape'); if (!el) return;
  const st = LP_SYMS.map(([s, p, d]) => ({ s, p, d, o: p }));
  const one = () => st.map((q, i) => { const ch = (q.p - q.o) / q.o * 100; return `<span class="tk" data-i="${i}"><b>${q.s}</b><em>${q.p.toFixed(q.d)}</em><i class="${ch >= 0 ? 'up' : 'dn'}">${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch).toFixed(2)}%</i></span>` }).join('') + '<span class="tk sim">simulated prices</span>';
  el.innerHTML = one() + one();
  if (LPFX.still) return;
  lpEvery(1100, () => {
    if (document.hidden || !el.isConnected) return;
    for (let k = 0; k < 3; k++) {
      const i = Math.floor(Math.random() * st.length), q = st[i], up = Math.random() > 0.48;
      q.p *= 1 + (up ? 1 : -1) * Math.random() * 0.0007;
      const ch = (q.p - q.o) / q.o * 100;

        t.classList.remove('fu', 'fd'); void t.offsetWidth; t.classList.add(up ? 'fu' : 'fd');

}

/* 2 · hero background: a slow live candle chart drawn on a canvas */
function lpHeroChart() {
  const cv = $('#lpHcv'); if (!cv) return;
  const ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  let W = 0, H = 0, candles = [], p = 100, t = 0, last = 0, cw = 14;
  const add = () => { const o = p, c = o + (Math.random() - 0.48) * 1.6, h = Math.max(o, c) + Math.random() * 0.8, l = Math.min(o, c) - Math.random() * 0.8; p = c; candles.push({ o, h, l, c }) };
  const size = () => { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); cw = W < 700 ? 10 : 14; while (candles.length < W / cw + 4) add() };
  size(); addEventListener('resize', size);
  const draw = () => {
    ctx.clearRect(0, 0, W, H);
    const vis = candles.slice(-Math.ceil(W / cw) - 2), lo = Math.min(...vis.map(k => k.l)), hi = Math.max(...vis.map(k => k.h));
    const y = v => H * 0.18 + (hi - v) / (hi - lo || 1) * H * 0.62, off = (t % 1) * cw;
    vis.forEach((k, i) => {
      const x = i * cw - off, up = k.c >= k.o;
      ctx.strokeStyle = ctx.fillStyle = up ? 'rgba(22,199,132,.22)' : 'rgba(240,69,79,.20)';
      ctx.beginPath(); ctx.moveTo(x + cw / 2, y(k.h)); ctx.lineTo(x + cw / 2, y(k.l)); ctx.stroke();
      ctx.fillRect(x + cw * 0.2, y(Math.max(k.o, k.c)), cw * 0.6, Math.max(1, Math.abs(y(k.o) - y(k.c))));
    });
    ctx.beginPath(); // gold moving average with a glow
    vis.forEach((k, i) => { const s = vis.slice(Math.max(0, i - 8), i + 1), m = s.reduce((a, b) => a + b.c, 0) / s.length, x = i * cw - off + cw / 2; i ? ctx.lineTo(x, y(m)) : ctx.moveTo(x, y(m)) });
    ctx.strokeStyle = 'rgba(245,183,59,.55)'; ctx.lineWidth = 2; ctx.shadowColor = 'rgba(245,183,59,.8)'; ctx.shadowBlur = 12; ctx.stroke(); ctx.shadowBlur = 0; ctx.lineWidth = 1;
    const lp = y(vis[vis.length - 1].c); // live price line
    ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(245,183,59,.35)'; ctx.beginPath(); ctx.moveTo(0, lp); ctx.lineTo(W, lp); ctx.stroke(); ctx.setLineDash([]);
  };
  if (LPFX.still) return draw();
  const loop = now => {
    if (!cv.isConnected) return;
    requestAnimationFrame(loop);
    if (document.hidden || now - last < 33 || cv.getBoundingClientRect().bottom < 0) return;
    last = now; t += 0.02; if (t >= 1) { t -= 1; add(); if (candles.length > 400) candles.splice(0, 100) }
    else { const k = candles[candles.length - 1]; k.c += (Math.random() - 0.5) * 0.12; k.h = Math.max(k.h, k.c); k.l = Math.min(k.l, k.c) }
    draw();
  };
  requestAnimationFrame(loop);
}

/* 3 · headline: characters decode into place */
function lpScramble(el) {
  if (!el || LPFX.still) return;
  const final = el.textContent, glyph = '█▓▒░<>/\\|=+*#$%01';
  let fr = 0; const len = final.length;
  const id = setInterval(() => {
    fr++;
    el.textContent = [...final].map((ch, i) => ch === ' ' || i < fr / 1.6 - 4 ? ch : glyph[Math.floor(Math.random() * glyph.length)]).join('');
    if (fr / 1.6 - 4 > len) { el.textContent = final; clearInterval(id) }
  }, 30);
}

        if (c.ok) { setMe(await srv('/api/me')); toast('Your account is now an admin account: log in anywhere to open Admin.', 'ok', 7000); return renderAdmin() }
      } catch {}
    }
    A.adm = j;
    if (quiet && $('#admT')) return admTable();
    const c = j.counts, conv = (c.active + c.past_due) / Math.max(1, j.customers.length) * 100;
    $('#adm').innerHTML = `<div class="g"><div class="g g4 kps">
      ${[['MRR', eur(j.mrr)], ['ARR', eur(j.arr)], ['Revenue 30 days', eur(j.revenue_30d)], ['Paying customers', c.active + c.past_due], ['In trial', c.trialing], ['Sign-ups 30 days', j.signups_30d], ['Trial → paid', conv.toFixed(0) + '%'], ['Churned / expired', c.expired + c.canceled]]
        .map(([k, v]) => `<div class="kp"><small>${k}</small><b>${v}</b></div>`).join('')}</div>
      <div class="box"><h3>Funnel</h3>
        <div class="g g4 kps">${[['Rulebook leads', j.leads ?? 0], ['Leads 30 days', j.leads_30d ?? 0], ['Lead → sign-up', j.leads ? Math.round(j.customers.length / Math.max(1, j.leads) * 100) + '%' : '—'],
          ['Founding seats left', j.founding ? `${j.founding.left} / ${j.founding.seats}` : '—'], ['Lifetime left', j.founding ? `${j.founding.lifetime_left} / ${j.founding.lifetime_seats}` : '—'], ['Founding closes', j.founding?.ends || 'no date set']]
          .map(([k, v]) => `<div class="kp"><small>${k}</small><b>${v}</b></div>`).join('')}</div></div>
      <div class="box">
        <div class="admtop"><div class="seg admtabs">${[['customers', '👥 Customers'], ['leads', '📄 Leads'], ['payments', '💶 Payments'], ['log', '🕑 Admin log']].map(([k, t]) => `<button data-admtab="${k}" class="${(A.admTab || 'customers') === k ? 'on' : ''}">${t}</button>`).join('')}</div><span class="grow"></span>
          <button class="btn sm acc" data-act="admAdd">＋ Add customer</button><button class="btn sm" data-act="admCsv">⤓ Customers CSV</button></div>
        <div class="admpane" data-pane="customers">
          <div class="admbar"><input class="in" id="admQ" placeholder="Search email or name…" value="${esc(A.admQ || '')}"><span class="mut" style="font-size:12px" id="admN"></span></div>
          <div class="seg" id="admF" style="margin-bottom:12px;flex-wrap:wrap;width:max-content;max-width:100%">${ADMF.map(([k, t, fn]) => `<button data-admf="${k}" class="${A.admF === k ? 'on' : ''}">${t} <span class="mut">${j.customers.filter(fn).length}</span></button>`).join('')}</div>
          <p class="mut" style="font-size:12px;margin:-4px 0 8px">Click a customer to upgrade, extend, block, reset, record payments, add notes or delete.</p>
          <div class="tscroll" id="admT"></div></div>
        <div class="admpane" data-pane="leads" style="display:none"></div><div class="admpane" data-pane="payments" style="display:none"></div><div class="admpane" data-pane="log" style="display:none"></div>
      </div></div>`;
    admTable(); renderNav('admin'); if (A.admTab && A.admTab !== 'customers') admTab(A.admTab);
  } catch (e) { $('#adm').innerHTML = `<div class="res on bad">${esc(e.message)}</div>` }
}
document.addEventListener('input', e => { if (e.target.id === 'admQ') { A.admQ = e.target.value; admTable() } });
document.addEventListener('click', e => {
  const r = e.target.closest('[data-admu]'); if (r && $('#view').dataset.v === 'admin') { e.preventDefault(); return admUser(r.dataset.admu) }
  const ad = e.target.closest('[data-ada]'); if (ad) return admButton(ad.dataset.ada, ad);
  const tb = e.target.closest('[data-admtab]'); if (tb) return admTab(tb.dataset.admtab);
  const cp = e.target.closest('[data-adcopy]'); if (cp) { navigator.clipboard?.writeText(cp.dataset.adcopy); return toast('Copied', 'ok') }
});

/* ---------------------------------------------------------------- legal placeholders */
const LEGAL = {
  terms: ['Terms of service', 'Replace this with your own terms (use a lawyer or a generator such as Termly / iubenda). Cover: subscription & renewal, refunds, acceptable use, license limits (number of PCs), no investment advice, limitation of liability, governing law.'],
  privacy: ['Privacy policy', 'Replace with your GDPR privacy policy. You store: email, name, hashed password, subscription status and bridge PC identifiers. Payments are processed by Stripe. Customers\' MT5 passwords are never sent to you.'],
  risk: ['Risk disclosure', 'Trading forex, CFDs and other leveraged products carries a high risk of losing money. Goldmine Pro is software only. It does not give advice, manage money or execute trades on its own initiative. Past performance shown in the journal is not indicative of future results.'],
};

/* ---------------------------------------------------------------- events */
document.addEventListener('click', async e => {
  const cta = e.target.closest('[data-cta]'); if (cta) track('cta_click', { id: cta.dataset.cta }); // analytics hook
  const of = e.target.closest('[data-offer]'); if (of) { if (of.dataset.offer === 'no') return resolveModal(null); return offerAction(of.dataset.offer) }
  const af = e.target.closest('[data-admf]'); if (af) { A.admF = af.dataset.admf; return admTable() }
  const z = e.target.closest('[data-zoom]');
  const tr = e.target.closest('[data-tour]'); if (tr) { e.preventDefault(); return document.getElementById('tour' + tr.dataset.tour)?.scrollIntoView({ behavior: 'smooth', block: 'center' }) }
  if (z) { const m = openModal(`<img src="${z.dataset.zoom}" alt="">`, true); m.classList.add('shotbox'); return }
  const t = e.target.closest('[data-act],[data-buy],[data-ivl],[data-sw],[data-unlink],[data-theme-set],[data-copy],[data-tstate],[data-acctrm]');
  if (!t) { if (!e.target.closest('#menu')) closeMenus(); return }
  if (t.dataset.buy) return buy(t.dataset.buy, t.dataset.bivl);
  if (t.dataset.acctrm) { if (!(await confirmBox('Remove this account?', '<p>It disappears from the terminal. You can add it again any time.</p>', 'Remove', 'danger'))) return; try { await bridge('/api/accounts/remove', { login: +t.dataset.acctrm }); toast('Account removed', 'ok'); loadAccts() } catch (err) { toast(err.message, 'err') } return }
  if (t.dataset.tstate) { try { setMe(await srv('/api/test/state', { state: t.dataset.tstate })); toast('Account is now: ' + t.textContent, 'ok'); $('#view').dataset.v = ''; route() } catch (err) { toast(err.message, 'err') } return }
  if (t.dataset.ivl) { A.interval = t.dataset.ivl; store.set('saasIvl', A.interval); $$('[data-ivl]').forEach(b => b.classList.toggle('on', b.dataset.ivl === A.interval)); $('#plans').innerHTML = $('.lp') ? lpPlans() : ['starter', 'pro', 'elite'].filter(k => !P(k)?.hidden || SUB().plan === k).map(k => priceCard(k)).join(''); return }
  if (t.dataset.sw) { resolveModal(null); location.hash = t.dataset.sw; return }
  if (t.dataset.themeSet) { CFG.theme = t.dataset.themeSet; saveCfg(); applyTheme(); $('#view').dataset.v = ''; return route() }
  if (t.dataset.copy) { navigator.clipboard?.writeText($('#cfgEx').textContent); return toast('Copied', 'ok') }
  if (t.dataset.unlink) { if (!(await confirmBox('Remove this PC?', 'Its bridge stops working until it is activated again.', 'Remove', 'danger'))) return; try { setMe(await srv('/api/license/machines/remove', { machine: t.dataset.unlink })); renderDashboard(); toast('PC removed', 'ok') } catch (err) { toast(err.message, 'err') } return }
  const a = t.dataset.act;
  if (a === 'burger') return $('#links').classList.toggle('open');
  if (a === 'menu') { e.stopPropagation(); return $('#menu').classList.toggle('on') }
  if (a === 'logout') return logout();
  if (a === 'demo') { window.open('terminal_pro.html?demo=1', '_blank'); return }
  if (a === 'legal') { e.preventDefault(); const [h, b] = LEGAL[t.dataset.k]; openModal(`<h3 style="margin-bottom:10px">${h}</h3><p style="color:var(--mut);line-height:1.6;font-size:13.5px">${b}</p><div style="text-align:right;margin-top:16px"><button class="btn md" onclick="resolveModal(null)">Close</button></div>`); return }
  if (a === 'reveal') { const c = $('#lic'); const on = c.textContent.includes('•'); c.textContent = on ? c.dataset.k : c.dataset.k.slice(0, 8) + '•••••-•••••-•••••'; t.textContent = on ? 'Hide' : 'Show'; return }
  if (a === 'copyKey') { navigator.clipboard?.writeText(A.me.license); return toast('License key copied', 'ok') }
  if (a === 'rotate') { if (!(await confirmBox('Generate a new license key?', 'The old key stops working right away and every linked PC is removed. Download the bridge again or activate it with the new key.', 'Generate new key', 'danger'))) return; try { setMe(await srv('/api/license/rotate', {})); store.set('bridgeOk', 0); renderDashboard(); toast('New key generated', 'ok') } catch (err) { toast(err.message, 'err') } return }
  if (a === 'download') return downloadBridge();
  if (a === 'acctAdd') return acctAdd();
  if (a === 'revealBk') { const c = $('#bkey'), on = c.textContent.includes('•'); c.textContent = on ? c.dataset.k : c.dataset.k.slice(0, 6) + '••••••••••••••••••••'; t.textContent = on ? 'Hide' : 'Show'; return }
  if (a === 'copyBk') { navigator.clipboard?.writeText(A.me.bridge_key); return toast('API key copied', 'ok') }
  if (a === 'saveManual') return saveManual();
  if (a === 'liveOn') return setLive(true);
  if (a === 'liveOff') { e.preventDefault(); return setLive(false) }
  if (a === 'resetManual') return resetManual();
  if (a === 'testerToggle') { store.set('testerOpen', store.get('testerOpen', 1) ? 0 : 1); return renderTester() }
  if (a === 'quickAccount') { if (A.me) { A.token = ''; A.me = null } return quickAccount() }
  if (a === 'checkNow') { BR.state = ''; return checkBridge().then(() => toast(BR.msg || 'Waiting for the bridge…')) }
  if (a === 'portal') { try { const j = await srv('/api/billing/portal', {}); if (j.url) location.href = j.url; else toast('Billing portal is available once Stripe is connected (test mode now).', 'warn') } catch (err) { toast(err.message, 'err') } return }
  if (a === 'cancelSub') return downsellCancel();
  if (a === 'resume') { try { setMe(await srv('/api/billing/resume', {})); renderBilling(); toast('Subscription resumed', 'ok') } catch (err) { toast(err.message, 'err') } return }
  if (a === 'admLoad') return admLoad();
  if (a === 'admAdd') return admAdd();
  if (a === 'admCsv') return admDownload('/api/admin/customers.csv', 'goldmine-customers.csv');
  if (a === 'admLeads') { try { const r = await fetch(SRV + '/api/admin/leads', { headers: admHeaders() }); if (!r.ok) throw new Error('Could not load leads'); const u = URL.createObjectURL(await r.blob()), l = document.createElement('a'); l.href = u; l.download = 'goldmine-leads.csv'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000) } catch (err) { toast(err.message, 'err') } return }
});

  pro: { name: 'Pro', month: 29, year: 197, lifetime: 497, accounts: 5, machines: 2, features: ['terminal', 'journal', 'alerts', 'drawings', 'layers', 'basket', 'manage', 'paper', 'copy'], blurb: 'Everything to size, manage and protect your trades. Five MT5 accounts.' },
  elite: { name: 'Elite', month: 59, year: 590, accounts: 25, machines: 3, features: ['terminal', 'journal', 'alerts', 'drawings', 'layers', 'basket', 'manage', 'paper', 'copy', 'priority'], blurb: 'For many accounts and small teams: 25 accounts, 3 PCs, priority support.' } } };
function noServer() { // nothing answered: say exactly what to start, instead of a vague error
  const mine = /^(127\.0\.0\.1|localhost)$/.test(location.hostname) || location.protocol === 'file:';
  if (!mine) return; // public visitors just see the page; sign-up explains itself
  $('#ribbon').className = 'on';
  $('#ribbon').innerHTML = '⚠ The subscription server is not running on this PC. Start <b>start_bridge.bat</b> (the test website is built in) or <b>saas\\TEST_EVERYTHING.bat</b>, then reload.';
}
document.addEventListener('submit', e => {
  if (A.plans?.offline && e.target.id === 'authF') {
    e.preventDefault(); e.stopImmediatePropagation();
    $('#authErr').innerHTML = /github\.io$/.test(location.hostname)
      ? 'Sign-ups are not open yet. Please try again soon.<br><small style="color:var(--mut);font-weight:600">Owner: start your bridge or TEST_EVERYTHING.bat on your PC to test sign-up from this page.</small>'
      : 'The subscription server is not running. See the yellow bar at the top.';
  }
}, true);

/* ---------------------------------------------------------------- boot */
(async () => {
  A.plans = await findServer();
  if (!A.plans) { A.plans = OFFLINE_PLANS; noServer() } // the landing page and prices always show; only sign-up needs the server
  if (A.token) { try { setMe(await srv('/api/me')) } catch { A.token = ''; store.set('saasToken', '') } }
  if (!location.hash && A.me) location.hash = 'dashboard';
  route();
  setInterval(() => { if (A.me && document.visibilityState === 'visible') srv('/api/me').then(setMe).catch(() => {}) }, 60000);
})();
</script>
