<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin · Gomez Trading</title><link rel="stylesheet" href="gm.css"></head><body>
<div id="views">
 <section data-v="ov"><div class="kp" id="kpi"></div><div class="cols"><div class="card"><div class="ch"><h2>Needs your attention</h2></div><div class="cb" id="att"></div></div><div class="card"><div class="ch"><h2>Newest members</h2></div><div class="cb" id="nw"></div></div></div></section>
 <section data-v="us"><div class="tbar"><input id="q" placeholder="Search by name or email"><div class="chips" id="ch"></div></div><div class="card tw" id="ut"></div></section>
 <section data-v="tr"><div id="trq"></div><div class="card tw" id="trt"></div></section>
 <section data-v="cp"><div class="card tw" id="ct"></div></section>
 <section data-v="ac"><div class="kp" id="bk"></div><div class="card" id="key" style="margin-top:14px"></div><div class="card tw" id="bt" style="margin-top:14px"></div></section>
</div>
<script type="module">
import{guard,db,F,esc,money,icon,ini,dt,mount,toast,ask,dlg,closeAll}from"./gm.js";
const me=await guard(["admin"]),$=s=>document.querySelector(s);
const sh=mount(me,{items:[
 {id:"ov",label:"Overview",icon:"home",title:"Overview",sub:"What needs your attention today"},
 {id:"us",label:"Users",icon:"users",title:"Users",sub:"Everyone on the platform"},
 {id:"tr",label:"Traders",icon:"star",title:"Traders",sub:"Approved traders and their followers"},
 {id:"cp",label:"Copying",icon:"link",title:"Copy links",sub:"Who copies whom, and how much"},
 {id:"ac",label:"Accounts",icon:"server",title:"Broker accounts",sub:"MT5 accounts and the copier running on your bridge"}],
 actions:`<a class="b sm" id="tl" href="#ac">${icon("chart",15)}<span class="hd">Trading terminal</span></a>`,
 extra:`<div class="ni soon">${icon("wallet")}Fees & payouts<span class="pl">Soon</span></div>`});
let U=[],FL=[],flt="all",BR=null;
const role=u=>(u.roles||[]).includes("trader")?"trader":"investor",live=()=>FL.filter(f=>f.status==="active"),sum=a=>a.reduce((s,f)=>s+(+f.amount||0),0);
const person=(n,e)=>`<div class="pc"><span class="av">${esc(ini(n))}</span><div><b>${esc(n)}</b><small>${esc(e)}</small></div></div>`;
const rp=u=>role(u)==="trader"?`<span class="pl g">Trader</span>`:`<span class="pl b">Investor</span>`,st=u=>u.status==="blocked"?`<span class="pl r">Blocked</span>`:`<span class="pl">Active</span>`;
const empty=(t,s)=>`<div class="em"><b>${t}</b>${s}</div>`;
const pend=()=>U.filter(u=>u.requestedTrader&&role(u)!=="trader"&&u.status!=="blocked");
const reqRows=()=>pend().map(u=>`<div class="al">${person(u.displayName,u.email)}<span class="sp"></span><button class="b sm" data-a="deny" data-id="${u.id}">Decline</button><button class="b sm pr" data-a="role" data-id="${u.id}" data-v="trader">Approve</button></div>`).join("");
const mine=u=>FL.filter(f=>(role(u)==="trader"?f.traderId:f.investorId)===u.id&&f.status==="active");
async function load(){const[a,b]=await Promise.all([F.getDocs(F.collection(db,"users")),F.getDocs(F.collection(db,"follows"))]);U=a.docs.map(d=>({id:d.id,...d.data()}));FL=b.docs.map(d=>({id:d.id,...d.data()}));render()}
function render(){
 const tr=U.filter(u=>role(u)==="trader"),inv=U.filter(u=>role(u)==="investor"),p=pend(),wk=U.filter(u=>u.createdAt?.seconds>Date.now()/1e3-6048e2).length;
 $("#kpi").innerHTML=[["Total users",U.length,`+${wk} this week`],["Traders",tr.length,`${p.length} request${p.length==1?"":"s"} pending`],["Investors",inv.length,`${new Set(live().map(f=>f.investorId)).size} actively copying`],["Capital copied",money(sum(live())),`${live().length} active link${live().length==1?"":"s"}`]].map(([l,v,s])=>`<div class="card kpi"><small>${l}</small><b>${v}</b><span>${s}</span></div>`).join("");
 const bl=U.filter(u=>u.status==="blocked").length;let a=p.length?`<p class="lb">Trader requests · ${p.length}</p>${reqRows()}`:"";
 if(BR&&!BR.ok)a+=`<div class="al"><span class="pl r">Bridge offline</span><span class="hint">Copying and the terminal are paused.</span><span class="sp"></span><button class="b sm" data-go="ac">Fix</button></div>`;
 if(bl)a+=`<div class="al"><span class="pl a">${bl} blocked</span><span class="hint">Members who can't sign in.</span><span class="sp"></span><button class="b sm" data-go="us">View</button></div>`;
 $("#att").innerHTML=a||empty("All clear","No requests, no problems.");
 const so=[...U].sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
 $("#nw").innerHTML=so.slice(0,6).map(u=>`<div class="al">${person(u.displayName,dt(u.createdAt))}<span class="sp"></span>${rp(u)}</div>`).join("")||empty("No members yet","Sign-ups will appear here.");
 sh.badge("tr",p.length);
 const cnt={all:U.length,trader:tr.length,investor:inv.length,blocked:bl},lab={all:"All",trader:"Traders",investor:"Investors",blocked:"Blocked"};
 $("#ch").innerHTML=Object.keys(lab).map(k=>`<button class="chip${flt===k?" on":""}" data-f="${k}">${lab[k]}<em>${cnt[k]}</em></button>`).join("");
 const q=$("#q").value.toLowerCase(),L=so.filter(u=>(flt==="all"||(flt==="blocked"?u.status==="blocked":role(u)===flt))&&(u.displayName+u.email).toLowerCase().includes(q));
 $("#ut").innerHTML=L.length?`<table class="tb"><tr><th>Member</th><th>Role</th><th>Status</th><th>Joined</th><th></th></tr>${L.map(u=>`<tr data-u="${u.id}"><td>${person(u.displayName,u.email)}</td><td>${rp(u)}${u.id===me.uid?' <span class="pl a">You</span>':""}</td><td>${st(u)}</td><td>${dt(u.createdAt)}</td><td class="r">›</td></tr>`).join("")}</table>`:empty("No members found","Try another search or filter.");
 $("#trq").innerHTML=p.length?`<div class="card" style="margin-bottom:14px"><div class="ch"><h2>Requests to become a trader</h2></div><div class="cb">${reqRows()}</div></div>`:"";
 $("#trt").innerHTML=tr.length?`<table class="tb"><tr><th>Trader</th><th>Followers</th><th>Capital following</th><th>Status</th><th></th></tr>${tr.map(u=>`<tr data-u="${u.id}"><td>${person(u.displayName,u.email)}</td><td>${mine(u).length}</td><td>${money(sum(mine(u)))}</td><td>${st(u)}</td><td class="r">›</td></tr>`).join("")}</table>`:empty("No traders yet","Approve a request, or open a member under Users and make them a trader.");
 $("#ct").innerHTML=FL.length?`<table class="tb"><tr><th>Investor</th><th>Copies</th><th>Amount</th><th>Status</th><th></th></tr>${FL.map(f=>`<tr><td><b>${esc(f.investorName)}</b></td><td>${esc(f.traderName)}</td><td>${money(f.amount)}</td><td><span class="pl ${f.status==="active"?"g":""}">${f.status==="active"?"Active":"Stopped"}</span></td><td><button class="b sm ${f.status==="active"?"dn":""}" data-a="fl" data-id="${f.id}" data-v="${f.status==="active"?"stopped":"active"}">${f.status==="active"?"Stop":"Resume"}</button></td></tr>`).join("")}</table>`:empty("No copy links yet","They appear when an investor starts copying a trader.");
}
function openUser(id){
 const u=U.find(x=>x.id===id),tr=role(u)==="trader",m=mine(u),self=id===me.uid;
 dlg(`<div class="pc big">${`<span class="av">${esc(ini(u.displayName))}</span>`}<div><b>${esc(u.displayName)}</b><small>${esc(u.email)}</small></div></div>
 <div style="margin:14px 0 6px">${rp(u)} ${st(u)} ${self?'<span class="pl a">You</span>':""}</div>
 <div class="kv"><span>Joined</span><b>${dt(u.createdAt)}</b></div><div class="kv"><span>${tr?"Active followers":"Traders copied"}</span><b>${m.length}</b></div><div class="kv"><span>${tr?"Capital following":"Capital allocated"}</span><b>${money(sum(m))}</b></div><div class="kv"><span>User ID</span><b class="mono">${esc(id)}</b></div>
 ${self?`<p class="hint" style="margin-top:16px">This is your own account.</p>`:`<div class="ra" style="margin-top:22px;flex-wrap:wrap"><button class="b" data-a="role" data-id="${id}" data-v="${tr?"investor":"trader"}">Make ${tr?"investor":"trader"}</button><button class="b ${u.status==="blocked"?"":"dn"}" data-a="block" data-id="${id}">${u.status==="blocked"?"Unblock":"Block"} member</button></div>`}`,"dr");
}
$("#q").oninput=render;
const ping=async()=>{try{await call("/api/health",await cfg(),4e3);BR={ok:true}}catch(e){BR={ok:!!e.http}}render()};
// ----- bridge (your Python app.py) -----
const cfg=async()=>{let b=localStorage.getItem("gm_base")||"";try{const d=await F.getDoc(F.doc(db,"platform","bridge"));if(d.exists()&&d.data().url)b=d.data().url}catch(e){}return{base:(b||"http://127.0.0.1:8765").replace(/\/+$/,""),key:localStorage.getItem("gm_key")||""}};
const call=async(p,c,ms=7e3)=>{const k=new AbortController(),t=setTimeout(()=>k.abort(),ms);try{const r=await fetch(c.base+p,{headers:{"X-Gomez-Key":c.key},signal:k.signal});if(!r.ok){const e=Error(r.status==401||r.status==403?"Wrong or missing key":"Bridge error "+r.status);e.http=1;throw e}return await r.json()}finally{clearTimeout(t)}};
const kp=(l,v,s)=>`<div class="card kpi"><small>${l}</small><b>${v}</b><span>${s}</span></div>`;
async function loadAc(){
 const c=await cfg();
 $("#key").innerHTML=`<div class="cb"><b>Cloudflare link</b><p class="hint" style="margin:2px 0 10px">Paste the new link here every time you start the tunnel. The Trading terminal button opens it.</p><div class="tbar" style="margin:0 0 16px"><input id="bu" style="max-width:480px" placeholder="https://something.trycloudflare.com" value="${/127\.0\.0\.1|localhost/.test(c.base)?"":esc(c.base)}"><button class="b pr" id="bus">Save link</button></div><b>Bridge key</b><div class="tbar" style="margin:8px 0 0"><input id="bk2" type="password" placeholder="Bridge key" value="${c.key?"••••••••":""}"><button class="b" id="bks">Save key</button></div><p class="hint" style="margin:10px 0 0">The key is stored on this device only.</p></div>`;
 try{const[ac,cs]=await Promise.all([call("/api/accounts",c),call("/api/copy/status",c)]);BR={ok:true};
  $("#bk").innerHTML=kp("Bridge","Online","Reachable")+kp("MT5 accounts",ac.accounts.length,"Configured on your PC")+kp("Copier",cs.running?"Running":"Stopped","Master to slave")+kp("Open trades copied",cs.links.length,"Right now");
  $("#bt").innerHTML=`<table class="tb"><tr><th>Account</th><th>Login</th><th>Server</th><th>Type</th><th>Balance / Equity</th></tr>${ac.accounts.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${a.login}</td><td>${esc(a.server)}</td><td><span class="pl ${a.is_demo?"":"r"}">${a.is_demo?"Demo":"LIVE"}</span></td><td id="bal${a.login}"><button class="b sm" data-bal="${a.login}">Load</button></td></tr>`).join("")}</table>`;
 }catch(x){BR={ok:!!x.http};$("#bk").innerHTML=kp("Bridge",x.http?"Key problem":"Offline",x.http?"Reachable, key rejected":"Can't be reached");
  $("#bt").innerHTML=empty(x.http?"The bridge rejected the key":"Can't reach your bridge",x.http?"Paste the correct key above and save.":"Check that app.py and your tunnel are running, then reopen the terminal through the tunnel once so the address updates.")}
 render();
}
const setTerm=async()=>{const c=await cfg();$("#tl").href=/127\.0\.0\.1|localhost/.test(c.base)?"#ac":c.base};
async function saveLink(){let u=$("#bu").value.trim().replace(/\/+$/,"");if(u&&!/^https?:\/\//.test(u))u="https://"+u;if(!u){toast("Paste your Cloudflare link first",1);return}
 localStorage.setItem("gm_base",u);try{await F.setDoc(F.doc(db,"platform","bridge"),{url:u,updatedAt:F.serverTimestamp()})}catch(e){toast(e.message,1);return}
 toast("Link saved");setTerm();loadAc()}
sh.hooks.ac=loadAc;
document.body.addEventListener("click",async e=>{
 const t=e.target,g=t.closest("[data-go]"),f=t.closest("[data-f]"),r=t.closest("tr[data-u]"),b=t.closest("[data-a]"),l=t.closest("[data-bal]");
 if(g){closeAll();sh.show(g.dataset.go);return}if(f){flt=f.dataset.f;render();return}if(r){openUser(r.dataset.u);return}
 if(t.id==="bus"){saveLink();return}
 if(t.id==="bks"){const v=$("#bk2").value.trim();if(v&&!v.startsWith("•"))localStorage.setItem("gm_key",v);loadAc();return}
 if(l){l.disabled=true;try{const a=await call("/api/account?login="+l.dataset.bal,await cfg());$("#bal"+l.dataset.bal).textContent=`${a.balance} / ${a.equity} ${a.currency||""}`}catch(x){$("#bal"+l.dataset.bal).textContent=x.message}return}
 if(!b)return;const{a,id,v}=b.dataset,u=U.find(x=>x.id===id);
 try{
  if(a==="role"){if(v==="investor"&&!await ask("Remove trader access?",`${esc(u.displayName)} can no longer be copied and their followers stop copying.`,"Make investor",1))return;
   await F.updateDoc(F.doc(db,"users",id),{roles:[v],requestedTrader:false});
   await F.setDoc(F.doc(db,"traders",id),{displayName:u.displayName,status:v==="trader"?"active":"inactive",updatedAt:F.serverTimestamp()},{merge:true});
   if(v==="investor")await Promise.all(FL.filter(x=>x.traderId===id&&x.status==="active").map(x=>F.updateDoc(F.doc(db,"follows",x.id),{status:"stopped"})));
   toast(v==="trader"?`${u.displayName} is now a trader`:"Changed to investor")}
  if(a==="deny"){await F.updateDoc(F.doc(db,"users",id),{requestedTrader:false});toast("Request declined")}
  if(a==="block"){const k=u.status!=="blocked";if(k&&!await ask(`Block ${esc(u.displayName)}?`,"They won't be able to use the platform until you unblock them.","Block",1))return;await F.updateDoc(F.doc(db,"users",id),{status:k?"blocked":"active"});toast(k?"Member blocked":"Member unblocked")}
  if(a==="fl"){if(v==="stopped"&&!await ask("Stop this copy link?","The investor will stop copying this trader.","Stop copying",1))return;await F.updateDoc(F.doc(db,"follows",id),{status:v});toast(v==="stopped"?"Copy link stopped":"Copy link resumed")}
  closeAll();await load();
 }catch(x){toast(x.message,1)}
});
await load();setTerm();ping();sh.show(location.hash.slice(1)||"ov");
</script></body></html>
