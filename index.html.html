<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goldmine Sync</title>
<style>
:root{--bg:#f6f8f7;--chart:#f5f2ea;--ink:#111;--mut:#8b9490;--grn:#2e9e6b;--grnl:#d6f3e4;--red:#d9484f;--blu:#2196f3;--line:#e3e7e5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0b0b0d;font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--ink)}
button,input{font-family:inherit}
#app{height:100%;max-width:560px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px 4px;font-weight:800}
.top .sym{font-size:20px;font-weight:800;border:0;background:none;padding:0;color:var(--ink)}.top .sym i{font-size:11px;color:#999;font-style:normal}
.dot{width:9px;height:9px;border-radius:50%;background:#e0a030}.dot.ok{background:#2fd08a}.dot.off{background:#e0555a}
.pill{background:var(--grnl);border:1.5px solid #8fdcb8;color:#1c9a62;border-radius:10px;padding:4px 10px;font-size:14px}
.pill.neg{background:#fde4e4;border-color:#f0b4b6;color:#c2383f}
.sp{flex:1}.bid{color:#b3261e;font-size:15px}.ask{color:#0a7a3a;font-size:15px}
.tfs{display:flex;gap:2px;padding:4px 10px;overflow:auto;scrollbar-width:none}
.tfs button{border:0;background:none;color:#a7b0ac;font-weight:700;font-size:13px;padding:7px 11px;border-radius:9px;white-space:nowrap}
.tfs button.on{background:var(--grnl);color:#25a06d;outline:1.5px solid #8fdcb8}
#chartView{flex:1;min-height:0;display:flex;flex-direction:column}
#panelView{flex:1;min-height:0;overflow:auto;padding:6px 14px 14px;display:none}
#cw{position:relative;flex:1;min-height:160px;background:var(--chart);border-top:1px solid #ddd}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#riskOverlay{z-index:2;pointer-events:none}
.tb{position:absolute;top:6px;left:6px;display:flex;gap:5px}
.tb button{border:1px solid #d6d2c6;background:#fffdf7cc;color:#6d716f;font-weight:700;font-size:11px;padding:4px 8px;border-radius:7px}
.tb button.on{background:#e5f7ee;border-color:#9fdcbd;color:#2a9565}
#tm{position:absolute;top:6px;right:68px;background:#1d2b27;color:#4fe3a0;font-weight:800;font-size:12px;padding:4px 8px;border-radius:7px;font-variant-numeric:tabular-nums}
#toast{position:absolute;left:12px;right:12px;top:38px;background:#0e5240;color:#7dffc5;border:1px solid #2fa36e;border-radius:10px;padding:10px 12px;text-align:center;font-weight:700;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:4}
#toast.bad{background:#5a1c20;color:#ffc2c5;border-color:#c2383f}#toast.on{opacity:1}
.chips{display:flex;gap:8px;align-items:center;padding:0 10px;overflow:auto;scrollbar-width:none;white-space:nowrap}
.chips:not(:empty){padding:6px 10px}
.be{background:#fdf3e0;border:1.5px solid #f0d9a8;color:#e8860b;font-weight:800;border-radius:10px;padding:7px 12px;font-size:13px}
.row2{display:flex;gap:20px;padding:4px 14px 6px;overflow:auto;scrollbar-width:none;white-space:nowrap;font-weight:800;font-size:14px}
.row2:empty{display:none}
.row2 .buy,.row2 .sell{color:#111}.row2 em{font-style:normal;color:#b7bdbb;font-weight:600}.row2 b{font-weight:800;margin-right:2px}.row2 u{text-decoration:none;color:#ee6a6a;margin-left:8px;padding:2px 4px}
.mode{display:flex;padding:2px 10px}.mode button{flex:1;border:0;background:none;color:var(--mut);font-weight:700;font-size:14px;padding:8px;border-radius:9px}
.mode button.on{background:#d9f5e7;color:#25a06d;outline:1.5px solid #9fdcbd}
.ent{display:none;align-items:center;gap:8px;padding:4px 14px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.ent input{width:110px;border:1.5px solid #cfd6d3;border-radius:9px;padding:7px 9px;font-size:16px;font-weight:700;background:#fff}
.ent button{width:34px;height:34px;border:0;border-radius:9px;background:#e8ebea;font-size:20px;font-weight:800}
.ent p{flex-basis:100%;margin:2px 0 0;font-size:12px}
.lots{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 14px}
.lots button{width:40px;height:40px;border:0;border-radius:10px;background:#e8ebea;font-size:24px;font-weight:800}
.lots .v{text-align:center;font-size:26px;font-weight:800;line-height:1;min-width:64px}.lots small{display:block;font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.5px;margin-top:3px}
.lots .sltp{margin-left:auto;width:auto;font-size:13px;padding:0 14px;background:none;border:1.5px solid #cfd6d3;color:#79827e}
.go{display:flex;gap:12px;padding:4px 14px 8px}.go button{flex:1;border:0;border-radius:14px;height:56px;color:#fff;font-weight:800;font-size:17px;line-height:1.2}
.go button:disabled{opacity:.55}.go small{display:block;font-size:15px;font-weight:700}
#sell{background:#0d0d0f}#buy{background:var(--blu)}
.nav{display:flex;border-top:1px solid var(--line);padding:6px 0 4px;background:var(--bg)}
.nav button{flex:1;border:0;background:none;font-size:10.5px;font-weight:700;color:#79827e;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7}.nav .on{color:var(--blu)}
#sheet{position:absolute;inset:auto 0 0 0;background:#fff;border-radius:18px 18px 0 0;padding:16px 18px 20px;box-shadow:0 -10px 40px #0004;transform:translateY(110%);transition:transform .25s;z-index:9;max-height:82%;overflow:auto}
#sheet.on{transform:none}#sheet h4{margin:0 0 8px;font-size:16px}
#sheet button,.pn button.wide{display:block;width:100%;margin:6px 0;padding:12px;border:1.5px solid #cfd6d3;border-radius:11px;background:#fff;font-weight:700;font-size:14px}
#sheet button.bad{border-color:#e9a5a8;color:#c2383f}
#sheet label,.pn label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:8px 0 0}
#sheet input,.pn input{display:block;width:100%;margin-top:4px;border:1.5px solid #cfd6d3;border-radius:10px;padding:10px;font-size:16px;font-weight:600}
#sheet .sm,.pn .sm{font-size:12px;color:var(--mut);margin:0 0 4px}
.pn h3{margin:12px 0 4px;font-size:15px}
.pn .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.pn .r small{color:var(--mut);font-size:12px}.pn .r button{border:1.5px solid #cfd6d3;background:#fff;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px}
.buy{color:#2a8fe0}.sell{color:#e0555a}.pos{color:#1c9a62}.neg{color:#c2383f}
.pn .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.pn .kv b{font-weight:800}
.pn .note{font-size:12px;color:var(--mut);line-height:1.5;margin:8px 0}
.demo{display:inline-block;background:var(--grnl);color:#1c9a62;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:800}
</style></head><body>
<div id="app">
<div class="top"><button class="sym" id="symBtn">GOLD <i>▼</i></button><span class="dot" id="dot"></span><span class="pill" id="pl">+$0.00</span><span class="sp"></span><span class="bid" id="hb">–</span><span class="ask" id="ha">–</span></div>
<div class="tfs" id="tfs"></div>
<div id="chartView">
 <div id="cw"><canvas id="c"></canvas><canvas id="riskOverlay" aria-hidden="true"></canvas>
  <div class="tb"><button id="tEma">EMA</button><button id="tLbl">Labels: small</button><button data-do="manage">Manage</button></div>
  <div id="tm">⧗ --:--</div><div id="toast"></div></div>
 <div class="chips" id="chips"></div>
 <div class="row2" id="row"></div>
 <div class="mode" id="mode"><button class="on" data-m="Market">Market</button><button data-m="Limit">Limit</button><button data-m="Stop">Stop</button></div>
 <div class="ent" id="ent">ENTRY <button id="em">−</button><input id="entv" type="number" step="any" inputmode="decimal"><button id="ep">+</button><p id="entHint"></p></div>
 <div class="lots"><button id="mi">–</button><div class="v"><span id="lv">0.10</span><small>LOTS</small></div><button id="pu">+</button><button class="sltp" id="sltp">SL / TP</button></div>
 <div class="go"><button id="sell">SELL<small id="sp">–</small></button><button id="buy">BUY<small id="bp">–</small></button></div>
</div>
<div id="panelView" class="pn"></div>
<div class="nav" id="nav"></div>
<div id="sheet"></div>
</div>
<script>
/* ============ Goldmine Sync — live MT5 dashboard (talks to app.py v0.4 on your PC) ============ */
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const TFLIST=['M1','M3','M5','M12','M15','M30','H1','H4','D1'];
const S={base:LS.get('gm_base','http://127.0.0.1:8765'),key:LS.get('gm_key',''),login:+LS.get('gm_login',0)||0,symbol:LS.get('gm_symbol',''),
 tf:TFLIST.includes(LS.get('gm_tf','')) ? LS.get('gm_tf','') : 'M5',digits:2,point:.01,contract:100,tfs:300,bid:0,ask:0,off:0,
 C:[],P:[],O:[],allP:[],allO:[],acct:null,gold:[],symbols:[],ok:false};
const DEF={sl:+LS.get('gm_sl',0)||0,tp:+LS.get('gm_tp',0)||0};
let mode='Market',lots=+LS.get('gm_lots',0.1)||0.1,entry=0,ema=LS.get('gm_ema','1')=='1',lbl=LS.get('gm_lbl','small'),panel=null;
const view={n:80,pan:0,gap:6,scale:1,vshift:0};
let activePos=null,activeLevels={};
const cv=$('#c'),g=cv.getContext('2d'),riskCv=$('#riskOverlay'),rg=riskCv.getContext('2d');let W=0,H=0,dirty=true,hits=[],geo=null,drag=null,frontRiskLabels=[];

/* ---------- helpers ---------- */
const fx=x=>(+x).toFixed(S.digits);
const CUR=()=>({USD:'$',EUR:'€',GBP:'£'}[S.acct&&S.acct.currency]||(S.acct?S.acct.currency+' ':'$'));
const money=x=>(x<0?'−':'+')+CUR()+Math.abs(x).toFixed(2);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(t,bad){const e=$('#toast');e.textContent=t;e.className=(bad?'bad ':'')+'on';clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),bad?5000:2800)}
function status(s){$('#dot').className='dot '+s}

/* ---------- bridge calls ---------- */
async function api(path,body){
 const o={headers:{'X-Gomez-Key':S.key}};
 if(body){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
 let r;try{r=await fetch(S.base+path,o)}catch(e){throw new Error('Cannot reach the bridge. Is start_bridge.bat running on your PC?')}
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok)throw new Error((j&&(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail)))||('Bridge error '+r.status));
 return j}

async function connect(){
 stopPoll();S.ok=false;
 if(!S.key){status('off');showPanel('Settings');return}
 status('wait');
 try{
  await api('/api/health');
  const a=await api('/api/accounts');
  if(!a.accounts.length)throw new Error('No account is configured in config.json.');
  if(!a.accounts.some(x=>x.login==S.login))S.login=a.accounts[0].login;
  LS.set('gm_login',S.login);
  const sy=await api('/api/symbols?login='+S.login);
  S.symbols=sy.symbols||[];S.gold=sy.gold||[];
  const known=[...S.symbols,...S.gold];
  if(!S.symbol||!known.includes(S.symbol))S.symbol=S.gold[0]||S.symbols[0]||'XAUUSD';
  LS.set('gm_symbol',S.symbol);
  await loadCandles();
  S.ok=true;status('ok');showPanel('Chart');startPoll();
  toast('✓ Connected — live '+S.symbol+' from your broker');
 }catch(e){status('off');toast(e.message,1);showPanel('Settings')}
}
async function loadCandles(){
 const r=await api(`/api/candles?login=${S.login}&symbol=${encodeURIComponent(S.symbol)}&timeframe=${S.tf}&count=1000`);
 S.C=r.candles;S.digits=r.digits;S.point=r.point;S.tfs=r.tf_seconds;view.pan=0;dirty=true;header()}

let polling=false,pollT=null,wasOff=false;
function startPoll(){stopPoll();pollT=setInterval(poll,700);poll()}
function stopPoll(){clearInterval(pollT);pollT=null}
async function poll(){
 if(polling||!S.ok)return;polling=true;const sym=S.symbol,tf=S.tf;
 try{
  const r=await api(`/api/live?login=${S.login}&symbol=${encodeURIComponent(sym)}&timeframe=${tf}`);
  if(sym!==S.symbol||tf!==S.tf)return;
  S.bid=r.bid;S.ask=r.ask;S.digits=r.digits;S.point=r.point;S.contract=r.contract||S.contract;S.off=r.time-Date.now()/1000;
  for(const b of r.bars){const L=S.C[S.C.length-1];
   if(!L||b.time>L.time)S.C.push(b);
   else for(let i=S.C.length-1;i>=Math.max(0,S.C.length-3);i--)if(S.C[i].time===b.time){S.C[i]=b;break}}
  if(S.C.length>6000)S.C.splice(0,S.C.length-5000);
  S.allP=r.positions;S.allO=r.pending;S.P=r.positions.filter(p=>p.symbol===sym);S.O=r.pending.filter(o=>o.symbol===sym);S.acct=r.account;
  if(wasOff){toast('✓ Reconnected');wasOff=false}
  status('ok');header();list();if(panel==='Positions')renderPositions();dirty=true;
 }catch(e){status('off');if(!wasOff){wasOff=true;toast(e.message,1)}}
 finally{polling=false}}

/* ---------- header / lists ---------- */
function header(){
 $('#symBtn').innerHTML=esc(S.symbol||'—')+' <i>▼</i>';
 $('#hb').textContent=S.bid?fx(S.bid):'–';$('#ha').textContent=S.ask?fx(S.ask):'–';
 $('#sp').textContent=S.bid?fx(S.bid):'–';$('#bp').textContent=S.ask?fx(S.ask):'–';
 const pr=S.acct?S.acct.profit:0,el=$('#pl');el.textContent=money(pr);el.className='pill'+(pr<0?' neg':'');
 $('#lv').textContent=lots.toFixed(2);
 $('#sltp').textContent=(DEF.sl||DEF.tp)?`SL ${DEF.sl||'–'} · TP ${DEF.tp||'–'}`:'SL / TP';
 $('#tEma').className=ema?'on':'';$('#tLbl').textContent='Labels: '+({small:'small',lines:'lines only',off:'hidden'}[lbl]);
 $('#tfs').innerHTML=TFLIST.map(t=>`<button class="${t==S.tf?'on':''}" data-t="${t}">${t}</button>`).join('');
 const hint=mode=='Limit'?'Limit: buy BELOW market, sell ABOVE market. Tap the chart to pick a price.':'Stop: buy ABOVE market, sell BELOW market. Tap the chart to pick a price.';
 $('#entHint').textContent=hint;
 document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m==mode));
 $('#ent').style.display=mode=='Market'?'none':'flex';
}
let rowSig='';
function list(){
 const P=S.P,O=S.O,sig=P.map(p=>p.ticket+':'+p.sl+':'+p.tp).join()+'|'+O.map(o=>o.ticket+':'+o.price).join();
 if(sig!==rowSig){rowSig=sig;
  $('#chips').innerHTML=P.length?`<button class="be" id="be">🛡 BE ALL (${P.length})</button>`:'';
  $('#row').innerHTML=P.map(p=>`<span class="${p.type.toLowerCase()}"><b>${p.type}</b> ${p.volume} &nbsp;<span data-pl="${p.ticket}"></span><u data-x="${p.ticket}">×</u></span>`).join('')+
   O.map(o=>`<span class="${o.name.startsWith('BUY')?'buy':'sell'}"><b>${o.name} ${o.volume}</b> <em>@ ${fx(o.price)}</em><u data-o="${o.ticket}">×</u></span>`).join('')}
 P.forEach(p=>{const e=document.querySelector(`[data-pl="${p.ticket}"]`);if(e){e.textContent=money(p.profit);e.className=p.profit<0?'neg':'pos'}});
}

/* ---------- chart ---------- */
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);riskCv.width=cv.width;riskCv.height=cv.height;g.setTransform(d,0,0,d,0,0);rg.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;dirty=true}
const AX=62,BX=22,BH=18;
const eff=(kind,t,v)=>drag&&drag.kind===kind&&drag.ticket===t?drag.price:v;
function orderLevels(){
 const out=[];
 S.P.forEach(p=>{out.push(p.price_open);const sl=eff('sl',p.ticket,p.sl),tp=eff('tp',p.ticket,p.tp);if(sl)out.push(sl);if(tp)out.push(tp)});
 S.O.forEach(o=>{out.push(eff('pend',o.ticket,o.price));const sl=eff('psl',o.ticket,o.sl),tp=eff('ptp',o.ticket,o.tp);if(sl)out.push(sl);if(tp)out.push(tp)});
 if(mode!='Market'&&entry)out.push(entry);
 return out}
const NICE=[.01,.02,.05,.1,.2,.5,1,2,5,10,20,25,50,100,200,500,1000];
function draw(){
 if(!W||!H)return;dirty=false;g.clearRect(0,0,W,H);rg.clearRect(0,0,W,H);frontRiskLabels=[];hits=[];
 const cw=W-AX,ph=H-BX,n=view.n,bw=cw/n,C=S.C;
 if(!C.length){g.fillStyle='#8b9490';g.font='600 14px sans-serif';g.textAlign='center';g.fillText(S.ok?'Loading candles…':'Not connected — open Settings',cw/2,ph/2);g.textAlign='left';return}
 const vis=n-view.gap,last=C.length-1-view.pan,first=last-vis+1;
 const arr=[];for(let k=0;k<vis;k++){const c=C[first+k];if(c)arr.push([k,c])}
 let hi=-1e9,lo=1e9;arr.forEach(([k,c])=>{hi=Math.max(hi,c.high);lo=Math.min(lo,c.low)});
 if(hi<lo){hi=(S.ask||1)+1;lo=(S.bid||0)-1}
 const m=(hi-lo)*.6||1;orderLevels().forEach(x=>{if(x>lo-m&&x<hi+m){hi=Math.max(hi,x);lo=Math.min(lo,x)}});
 if(view.pan===0)[S.ask,S.bid].forEach(x=>{if(x){hi=Math.max(hi,x);lo=Math.min(lo,x)}});
 const pad=(hi-lo)*.08||.5;hi+=pad;lo-=pad;
 // Keep manual vertical zoom/pan stable while horizontal zoom changes.
 const mid=(hi+lo)/2,half=(hi-lo)/2/Math.max(.15,view.scale);hi=mid+half-view.vshift;lo=mid-half-view.vshift;
 const Y=p=>8+(hi-p)/(hi-lo)*(ph-16),X=k=>k*bw+bw/2;
 geo={ph,cw,bw,inv:y=>hi-(y-8)/(ph-16)*(hi-lo)};
 // watermark
 g.fillStyle='rgba(150,150,150,.16)';g.font='900 54px Helvetica,Arial';g.textAlign='center';g.fillText('GOLDMINE',cw/2,ph*.45);g.font='900 32px Helvetica,Arial';g.fillText('SYNC',cw/2,ph*.45+38);g.textAlign='left';
 // grid + price axis
 const step=NICE.find(s=>(hi-lo)/s<=9)||1000;
 g.font='500 11px -apple-system,Arial';g.lineWidth=1;
 for(let p=Math.ceil(lo/step)*step;p<hi;p+=step){const y=Y(p);g.strokeStyle='rgba(0,0,0,.06)';g.beginPath();g.moveTo(0,y);g.lineTo(cw,y);g.stroke();g.fillStyle='#333';g.fillText(p.toFixed(step<1?2:0),cw+6,y+4)}
 g.fillStyle='#0003';g.fillRect(cw,0,1,ph);g.fillRect(0,ph,W,1);
 // time axis
 const secs=[60,300,900,1800,3600,7200,14400,43200,86400,172800,604800];
 const tstep=secs.find(s=>s/S.tfs*bw>=70)||604800;
 g.fillStyle='#333';g.textAlign='center';g.font='600 11px -apple-system,Arial';
 arr.forEach(([k,c])=>{if(c.time%tstep===0){const d=new Date(c.time*1000);
  const t=tstep>=86400?d.getUTCDate()+'/'+(d.getUTCMonth()+1):String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
  g.fillText(t,X(k),H-7)}});g.textAlign='left';
 // EMA
 if(ema&&C.length>30)[[9,'#f2c230'],[21,'#2f7fd6']].forEach(([len,col])=>{const kk=2/(len+1);let e=C[0].close;const E=C.map(c=>e=c.close*kk+e*(1-kk));
  g.beginPath();let st=0;arr.forEach(([k,c])=>{const y=Y(E[first+k]);st?g.lineTo(X(k),y):g.moveTo(X(k),y);st=1});g.strokeStyle=col;g.lineWidth=1.3;g.stroke()});
 // candles
 arr.forEach(([k,c])=>{const up=c.close>=c.open,x=X(k),w=Math.max(2,bw*.62);
  g.strokeStyle='#111';g.lineWidth=1.2;g.beginPath();g.moveTo(x,Y(c.high));g.lineTo(x,Y(c.low));g.stroke();
  const y1=Y(Math.max(c.open,c.close)),h=Math.max(1.5,Math.abs(Y(c.open)-Y(c.close)));
  g.fillStyle=up?'#4db3f5':'#161616';g.fillRect(x-w/2,y1,w,h);g.strokeStyle='#111';g.lineWidth=1;g.strokeRect(x-w/2,y1,w,h)});

const ptrs=new Map();let pan=null,pinch=null,tap=null,scaleDrag=null,confirmClose=null;
const hitAt=(x,y)=>[...hits].reverse().find(h=>x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h);
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 ptrs.set(e.pointerId,{x,y});try{cv.setPointerCapture(e.pointerId)}catch(_){}
 if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,n:view.n};pan=null;drag=null;tap=null;return}
 const h=hitAt(x,y);
 if(h&&h.act==='drag'){const dk=h.kind,t=h.ticket;drag={kind:dk,ticket:t,price:+geo.inv(y).toFixed(S.digits),startY:y,moved:false};dirty=true;return}
 if(h){tap={h,x,y};return}
 if(x>=W-AX){scaleDrag={y,scale:view.scale,shift:view.vshift};pan=null;drag=null;tap=null;return}
 pan={x,y,p:view.pan,g:view.gap,vs:view.vshift,moved:false}});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x,y});

 if(scaleDrag){const dy=y-scaleDrag.y;view.scale=clamp(scaleDrag.scale*Math.exp(-dy*.012),.15,20);dirty=true;return}
 if(drag){if(Math.abs(y-(drag.startY??y))>3)drag.moved=true;drag.price=+geo.inv(clamp(y,0,geo.ph)).toFixed(S.digits);dirty=true;return}
 if(tap&&Math.hypot(x-tap.x,y-tap.y)>8)tap=null;
 if(pan){const dx=x-pan.x,dy=y-pan.y;if(Math.abs(dx)>5||Math.abs(dy)>5)pan.moved=true;if(geo){const slots=Math.round(dx/geo.bw);let gap=pan.g-slots,extra=0;if(gap<0)gap=0;if(gap>=view.n){extra=Math.floor(gap/view.n);gap=gap%view.n}view.gap=clamp(gap,0,view.n-1);view.pan=clamp(pan.p+extra,0,Math.max(0,S.C.length-25));const range=Math.abs(geo.inv(0)-geo.inv(geo.ph));view.vshift=pan.vs-dy/(geo.ph-16)*range/Math.max(.15,view.scale);dirty=true}}});
function endPtr(e,cancel){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;ptrs.delete(e.pointerId);
 if(ptrs.size<2)pinch=null;

 if(scaleDrag){scaleDrag=null;dirty=true;return}
 if(drag){const d=drag;drag=null;if(d.moved)commitDrag(d);dirty=true;return}

function onHit(h){
 if(h.act==='close'){confirmClose=confirmClose===h.ticket?null:h.ticket;dirty=true}
 else if(h.act==='confirmclose'){const t=h.ticket;confirmClose=null;dirty=true;closePos(t,100)}
 else if(h.act==='cancel'){cancelPending(h.ticket)}
 else if(h.act==='pos'){activePos=activePos===h.ticket?null:h.ticket;if(activePos!==null){const p=S.P.find(x=>x.ticket===activePos);if(p&&!activeLevels[p.ticket])activeLevels[p.ticket]={sl:p.sl||null,tp:p.tp||null};}dirty=true}}

async function commitDrag(d){

 try{
  if(d.kind==='sl'||d.kind==='tp'){const p=S.P.find(p=>p.ticket===d.ticket);if(!p)return;
   const lev=activeLevels[d.ticket]||(activeLevels[d.ticket]={sl:p.sl,tp:p.tp});lev[d.kind]=price;

   await api('/api/pending/modify',body);toast('✓ Pending order moved to '+fx(price))}
  poll();

document.addEventListener('click',e=>{
 const t=e.target.closest('button,u');if(!t)return;const d=t.dataset;
 if(t.id==='symBtn'){symSheet();return}
 if(d.t){S.tf=d.t;LS.set('gm_tf',S.tf);S.C=[];header();if(S.ok)loadCandles().then(poll).catch(x=>toast(x.message,1));return}
 if(d.m){mode=d.m;if(mode!=='Market'&&S.bid)entry=+(S.bid+(mode==='Limit'?-1:1)*S.point*300).toFixed(S.digits);$('#entv').value=mode==='Market'?'':entry;header();dirty=true;return}
 if(d.x){const p=S.P.find(p=>p.ticket==d.x);if(p)closePos(+d.x,100);return}
 if(d.o){cancelPending(+d.o);return}
 if(d.pc){closePos(+d.pc,100);return}
 if(d.po){cancelPending(+d.po);return}
 if(d.n){showPanel(d.n);return}
 if(d.sym){S.symbol=d.sym;LS.set('gm_symbol',S.symbol);S.C=[];S.P=[];S.O=[];sheet(null);header();if(S.ok)loadCandles().then(poll).catch(x=>toast(x.message,1));return}
 switch(t.id){
  case 'be':beAll();return;
  case 'mi':lots=lots>0.1?+(lots-0.1).toFixed(2):Math.max(0.01,+(lots-0.01).toFixed(2));LS.set('gm_lots',lots);header();return;
  case 'pu':lots=lots>=0.1?Math.min(1,+(lots+0.1).toFixed(2)):+(lots+0.01).toFixed(2);LS.set('gm_lots',lots);header();return;
  case 'sltp':defSheet();return;
  case 'sell':place('sell');return;case 'buy':place('buy');return;
  case 'tEma':ema=!ema;LS.set('gm_ema',ema?'1':'0');header();dirty=true;return;
  case 'tLbl':lbl={small:'lines',lines:'off',off:'small'}[lbl];LS.set('gm_lbl',lbl);header();dirty=true;return;
  case 'em':case 'ep':{const st=S.point*10*(t.id==='em'?-1:1);entry=+((entry||S.bid)+st).toFixed(S.digits);$('#entv').value=entry;dirty=true;return}}
 if(d.do)doAction(d.do,d.t)});
$('#entv').addEventListener('input',e=>{entry=+e.target.value||0;dirty=true});

async function beAll(){let ok=0,skip=0;for(const p of S.P){if(p.profit<=0){skip++;continue}
  try{await api('/api/modify',{login:S.login,ticket:p.ticket,sl:p.price_open,tp:p.tp});ok++}catch(e){skip++}}
 toast(`✓ Break-even set on ${ok}`+(skip?` · ${skip} skipped (not in profit yet)`:''),!ok);poll()}

async function doAction(a,tk){
 const t=+tk;
 if(a==='x'){sheet(null);return}
 if(a==='manage'){manageSheet();return}
 if(a==='manage100'){sheet(null);if(!confirm('Close ALL open positions now?'))return;try{const r=await api('/api/close-all',{login:S.login});toast(`✓ Closed ${r.closed}`+(r.failed?` · ${r.failed} failed`:''),r.failed>0)}catch(e){toast(e.message,1)}poll();return}
 if(['manage75','manage50','manage25'].includes(a)){const pct=+a.replace('manage','');const ps=[...S.P];sheet(null);if(!ps.length){toast('No open positions to manage.',1);return}if(!confirm(`Close ${pct}% of all ${ps.length} open position(s)?`))return;let ok=0,failed=0;for(const p of ps){try{await api('/api/close',{login:S.login,ticket:p.ticket,percent:pct});ok++}catch(e){failed++}}toast(`✓ Closed ${pct}% on ${ok} position(s)`+(failed?` · ${failed} failed`:''),failed>0);poll();return}
 if(a==='savesltp'){const sl=+$('#fsl').value||0,tp=+$('#ftp').value||0;sheet(null);await run(()=>api('/api/modify',{login:S.login,ticket:t,sl,tp}),'✓ SL / TP saved');return}
 if(a==='be'){const p=S.P.find(p=>p.ticket===t);if(!p)return;sheet(null);await run(()=>api('/api/modify',{login:S.login,ticket:t,sl:p.price_open,tp:p.tp}),'✓ SL moved to break-even');return}
 if(a==='c50'){sheet(null);await closePos(t,50);return}
 if(a==='c100'){sheet(null);await closePos(t,100);return}
 if(a==='savedef'){DEF.sl=Math.max(0,+$('#dsl').value||0);DEF.tp=Math.max(0,+$('#dtp').value||0);LS.set('gm_sl',DEF.sl);LS.set('gm_tp',DEF.tp);sheet(null);header();return}
 if(a==='closeall'){if(!confirm('Close ALL open positions now?'))return;try{const r=await api('/api/close-all',{login:S.login});toast(`✓ Closed ${r.closed}`+(r.failed?` · ${r.failed} failed`:''),r.failed>0)}catch(e){toast(e.message,1)}poll();return}
 if(a==='saveconn'){S.base=($('#sBase').value.trim()||'http://127.0.0.1:8765').replace(/\/+$/,'');S.key=$('#sKey').value.trim();LS.set('gm_base',S.base);LS.set('gm_key',S.key);connect();return}
 if(a==='pickSym'){if(!S.symbols.length&&!S.gold.length){toast('Connect first, then pick a symbol.',1);return}symSheet();return}
 if(a==='forget'){S.key='';LS.set('gm_key','');S.ok=false;stopPoll();status('off');renderSettings();toast('Key removed from this device.')}
}

/* ---------- start ---------- */
new ResizeObserver(size).observe($('#cw'));
navUI();header();size();connect();
</script></body></html>
