<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trader · Gomez Trading</title><link rel="stylesheet" href="gm.css"></head><body>
<div id="views">
 <section data-v="ov"><div class="kp" id="kpi"></div><div class="card" style="margin-top:14px"><div class="cb"><div class="al" style="border:0"><div><b>Your performance page</b><div class="hint">Connect your MT5 account to show your results and let investors copy your trades.</div></div><span class="sp"></span><span class="pl a">Coming soon</span></div></div></div></section>
 <section data-v="fl"><div class="card tw" id="ft"></div></section>
</div>
<script type="module">
import{guard,db,F,esc,money,icon,ini,dt,mount}from"./gm.js";
const me=await guard(["trader","admin"]),$=s=>document.querySelector(s);
mount(me,{items:[{id:"ov",label:"Overview",icon:"home",title:"Overview",sub:"How your followers are doing"},{id:"fl",label:"Followers",icon:"users",title:"Followers",sub:"Investors copying you"}],
 extra:me.role==="admin"?`<a class="ni" href="admin.html">${icon("home")}Back to admin</a>`:""}).show(location.hash.slice(1)||"ov");
const s=await F.getDocs(F.query(F.collection(db,"follows"),F.where("traderId","==",me.uid))),fl=s.docs.map(d=>d.data()),ac=fl.filter(f=>f.status==="active");
$("#kpi").innerHTML=[["Active followers",ac.length,"Investors copying you now"],["Capital following you",money(ac.reduce((a,f)=>a+(+f.amount||0),0)),"Declared by investors"],["All-time followers",fl.length,"Including stopped"]].map(([l,v,t])=>`<div class="card kpi"><small>${l}</small><b>${v}</b><span>${t}</span></div>`).join("");
$("#ft").innerHTML=fl.length?`<table class="tb"><tr><th>Investor</th><th>Amount</th><th>Since</th><th>Status</th></tr>${fl.map(f=>`<tr><td><div class="pc"><span class="av">${esc(ini(f.investorName))}</span><b>${esc(f.investorName)}</b></div></td><td>${money(f.amount)}</td><td>${dt(f.createdAt)}</td><td><span class="pl ${f.status==="active"?"g":""}">${f.status==="active"?"Active":"Stopped"}</span></td></tr>`).join("")}</table>`:`<div class="em"><b>No followers yet</b>Investors will appear here once they copy you.</div>`;
</script></body></html>
