<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gomez Trading · Trader</title><link rel="stylesheet" href="gm.css"></head><body>
<header><b>Gomez Trading</b><span class="tag">TRADER</span><span class="sp"></span><a class="b" id="back" href="admin.html" hidden>Admin</a><button class="b" id="out">Sign out</button></header>
<main><h2 id="hi"></h2><div class="g" id="kpi"></div><h2>Your followers</h2><div class="w" id="ft"></div>
<p class="note">Your performance stats and trade history will appear here once your MT5 account is connected.</p></main>
<script type="module">
import{guard,db,F,esc,money,logout}from"./gm.js";
const me=await guard(["trader","admin"]);const $=s=>document.querySelector(s);
$("#out").onclick=logout;$("#back").hidden=me.role!=="admin";$("#hi").textContent="Welcome, "+(me.data.displayName||me.u.email);
const s=await F.getDocs(F.query(F.collection(db,"follows"),F.where("traderId","==",me.uid)));
const fl=s.docs.map(d=>d.data()),act=fl.filter(f=>f.status==="active");
$("#kpi").innerHTML=[["Active followers",act.length],["Capital following you",money(act.reduce((a,f)=>a+(+f.amount||0),0))],["All-time followers",fl.length]].map(([l,v])=>`<div class="k"><small>${l}</small><b>${v}</b></div>`).join("");
$("#ft").innerHTML=fl.length?`<table><tr><th>Investor</th><th>Amount</th><th>Status</th></tr>${fl.map(f=>`<tr><td>${esc(f.investorName)}</td><td>${money(f.amount)}</td><td><span class="pill ${f.status}">${esc(f.status)}</span></td></tr>`).join("")}</table>`:`<div class="empty">No followers yet.</div>`;
</script></body></html>
